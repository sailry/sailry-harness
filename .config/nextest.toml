[profile.ci]
# Each test gets a fresh process to isolate environment and global state.
test-threads = 2
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

[test-groups]
host-startup = { max-threads = 1 }

[[profile.ci.overrides]]
# Fresh Host profiles durably materialize every bundled package. Avoid competing
# full-sync workloads; concurrency within each lifecycle test remains intact.
filter = 'package(sailry-host) & binary(lifecycle)'
test-group = 'host-startup'

# Keep database results separate from the ordinary backend report.
[profile.databases]
test-threads = 1
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.databases.junit]
path = "junit.xml"

[profile.lifecycle]
test-threads = 1
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.lifecycle.junit]
path = "junit.xml"
