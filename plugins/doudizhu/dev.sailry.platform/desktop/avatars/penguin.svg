<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <linearGradient id="fm3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ea0b8"/>
      <stop offset="100%" stop-color="#6d91aa"/>
    </linearGradient>
    <linearGradient id="fm3-cloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="fm3-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="fm3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background container (matches test color #6d91aa) -->
  <rect width="420" height="420" rx="34" fill="#6d91aa"/>
  
  <circle cx="210" cy="210" r="190" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#fm3-shadow)">
    <!-- Cotton Shoulders -->
    <path d="M 60 420 C 60 320 125 280 210 280 C 295 280 360 320 360 420 Z" fill="url(#fm3-cloth)"/>
    
    <!-- White Inner Collar V -->
    <path d="M 165 284 L 210 338 L 255 284" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="210" cy="358" r="6" fill="#f8fafc"/>
    <circle cx="210" cy="388" r="6" fill="#f8fafc"/>
    
    <!-- Neck -->
    <path d="M 182 240 L 182 290 Q 210 300 238 290 L 238 240 Z" fill="#fdba74"/>

    <!-- Head / Face -->
    <ellipse cx="210" cy="210" rx="72" ry="76" fill="url(#fm3-skin)"/>

    <!-- Ears -->
    <ellipse cx="136" cy="212" rx="12" ry="18" fill="#fed7aa"/>
    <ellipse cx="284" cy="212" rx="12" ry="18" fill="#fed7aa"/>

    <!-- Cheerful Cheeks -->
    <ellipse cx="162" cy="226" rx="15" ry="9" fill="#f87171" opacity="0.45"/>
    <ellipse cx="258" cy="226" rx="15" ry="9" fill="#f87171" opacity="0.45"/>

    <!-- Eyes -->
    <path d="M 164 196 Q 180 184 196 196" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
    <path d="M 224 196 Q 240 184 256 196" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 160 180 Q 178 170 196 180" fill="none" stroke="#292524" stroke-width="5" stroke-linecap="round"/>
    <path d="M 224 180 Q 242 170 260 180" fill="none" stroke="#292524" stroke-width="5" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="210" cy="214" rx="10" ry="8" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>

    <!-- Grin -->
    <path d="M 186 234 Q 210 262 234 234 Z" fill="#991b1b"/>
    <path d="M 190 234 Q 210 244 230 234" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>

    <!-- Peasant Head Wrap -->
    <path d="M 134 172 C 134 100 170 85 210 85 C 250 85 286 100 286 172 Z" fill="#0284c7"/>
    <path d="M 128 170 Q 210 186 292 170 L 290 180 Q 210 194 130 180 Z" fill="#0369a1"/>
  </g>

  <!-- Role Badge: 农民 -->
  <g transform="translate(290, 24)">
    <rect width="98" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="49" y="23" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#f0f9ff" text-anchor="middle">农民</text>
  </g>
</svg>
