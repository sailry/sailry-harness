<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <linearGradient id="ll-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#111315"/>
    </linearGradient>
    <linearGradient id="ll-robe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="ll-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ll-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="ll-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background container (matches test color #111315) -->
  <rect width="420" height="420" rx="34" fill="#111315"/>
  
  <!-- Subtle decorative lucky cloud/border ring -->
  <circle cx="210" cy="210" r="190" fill="none" stroke="url(#ll-gold)" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="12 8"/>
  <circle cx="210" cy="210" r="180" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#ll-shadow)">
    <!-- Silk Robe Shoulders -->
    <path d="M 60 420 C 60 320 125 280 210 280 C 295 280 360 320 360 420 Z" fill="url(#ll-robe)"/>
    
    <!-- Robe golden patterns -->
    <path d="M 110 390 Q 140 340 180 370" fill="none" stroke="url(#ll-gold)" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 310 390 Q 280 340 240 370" fill="none" stroke="url(#ll-gold)" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    
    <!-- Golden collar V -->
    <path d="M 148 288 L 210 346 L 272 288" fill="none" stroke="url(#ll-gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 160 292 L 210 338 L 260 292" fill="none" stroke="#991b1b" stroke-width="3"/>
    
    <!-- Golden Knot Button -->
    <circle cx="210" cy="358" r="8" fill="url(#ll-gold)"/>
    <circle cx="210" cy="358" r="4" fill="#78350f"/>
    <circle cx="210" cy="384" r="7" fill="url(#ll-gold)"/>

    <!-- Neck -->
    <path d="M 180 240 L 180 290 Q 210 302 240 290 L 240 240 Z" fill="#fcd34d"/>

    <!-- Plump Head / Face -->
    <ellipse cx="210" cy="204" rx="78" ry="82" fill="url(#ll-skin)"/>

    <!-- Ears -->
    <ellipse cx="132" cy="208" rx="14" ry="22" fill="#fde68a"/>
    <ellipse cx="134" cy="208" rx="8" ry="14" fill="#fcd34d"/>
    <ellipse cx="288" cy="208" rx="14" ry="22" fill="#fde68a"/>
    <ellipse cx="286" cy="208" rx="8" ry="14" fill="#fcd34d"/>

    <!-- Rosy cheeks -->
    <ellipse cx="158" cy="222" rx="18" ry="11" fill="#f87171" opacity="0.55"/>
    <ellipse cx="262" cy="222" rx="18" ry="11" fill="#f87171" opacity="0.55"/>

    <!-- Jovial Eyes -->
    <path d="M 160 190 Q 178 176 194 190" fill="none" stroke="#1c1917" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 226 190 Q 242 176 260 190" fill="none" stroke="#1c1917" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 154 174 Q 176 160 196 174" fill="none" stroke="#292524" stroke-width="5" stroke-linecap="round"/>
    <path d="M 224 174 Q 244 160 266 174" fill="none" stroke="#292524" stroke-width="5" stroke-linecap="round"/>

    <!-- Big Round Nose -->
    <ellipse cx="210" cy="206" rx="14" ry="10" fill="#fcd34d" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Smirking Open Mouth -->
    <path d="M 186 230 Q 210 262 234 230 Z" fill="#991b1b"/>
    <path d="M 190 230 Q 210 240 230 230" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="210" cy="248" rx="12" ry="7" fill="#ef4444"/>

    <!-- Classic Handlebar Mustache (八字胡) -->
    <path d="M 210 220 C 196 218 166 226 146 244 C 166 238 190 230 208 226 C 210 226 210 226 212 226 C 230 230 254 238 274 244 C 254 226 224 218 210 220 Z" fill="#1c1917"/>

    <!-- Traditional Skullcap (瓜皮帽) -->
    <!-- Dome -->
    <path d="M 132 168 C 132 85 168 76 210 76 C 252 76 288 85 288 168 Z" fill="#18181b"/>
    <!-- Seams / Ribs -->
    <path d="M 210 76 Q 166 118 162 168" fill="none" stroke="#3f3f46" stroke-width="3"/>
    <path d="M 210 76 Q 254 118 258 168" fill="none" stroke="#3f3f46" stroke-width="3"/>
    <path d="M 210 76 L 210 168" fill="none" stroke="#3f3f46" stroke-width="2.5"/>
    <!-- Brim -->
    <path d="M 126 166 Q 210 182 294 166 Q 294 178 290 180 Q 210 194 130 180 Z" fill="#27272a"/>
    <path d="M 128 166 Q 210 180 292 166" fill="none" stroke="url(#ll-gold)" stroke-width="2"/>

    <!-- Red Gem Crown (红玛瑙顶珠) -->
    <path d="M 200 76 Q 210 72 220 76 L 218 80 L 202 80 Z" fill="url(#ll-gold)"/>
    <circle cx="210" cy="66" r="12" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
    <ellipse cx="206" cy="62" rx="4" ry="2.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Role Badge: 地主 -->
  <g transform="translate(290, 24)">
    <rect width="98" height="34" rx="17" fill="#dc2626" stroke="url(#ll-gold)" stroke-width="2"/>
    <text x="49" y="23" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">地主</text>
  </g>
</svg>
