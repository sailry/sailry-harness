<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <linearGradient id="fm2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f586f"/>
      <stop offset="100%" stop-color="#34485b"/>
    </linearGradient>
    <linearGradient id="fm2-cloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="fm2-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="fm2-straw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="fm2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background container (matches test color #34485b) -->
  <rect width="420" height="420" rx="34" fill="#34485b"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="210" cy="210" r="190" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="210" cy="210" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#fm2-shadow)">
    <!-- Terracotta Cotton Shoulders -->
    <path d="M 60 420 C 60 320 125 280 210 280 C 295 280 360 320 360 420 Z" fill="url(#fm2-cloth)"/>
    
    <!-- White Inner Collar V -->
    <path d="M 165 284 L 210 338 L 255 284" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Placket & Buttons -->
    <line x1="210" y1="338" x2="210" y2="420" stroke="#9a3412" stroke-width="4"/>
    <circle cx="210" cy="358" r="6" fill="#fef08a"/>
    <circle cx="210" cy="388" r="6" fill="#fef08a"/>
    
    <!-- Youthful Neck -->
    <path d="M 182 240 L 182 290 Q 210 300 238 290 L 238 240 Z" fill="#fcd34d"/>

    <!-- Head / Face -->
    <ellipse cx="210" cy="210" rx="72" ry="76" fill="url(#fm2-skin)"/>

    <!-- Ears -->
    <ellipse cx="136" cy="212" rx="12" ry="18" fill="#fde68a"/>
    <ellipse cx="284" cy="212" rx="12" ry="18" fill="#fde68a"/>

    <!-- Cheerful Rosy Cheeks -->
    <ellipse cx="162" cy="226" rx="15" ry="9" fill="#f87171" opacity="0.45"/>
    <ellipse cx="258" cy="226" rx="15" ry="9" fill="#f87171" opacity="0.45"/>

    <!-- Bright Young Eyes -->
    <ellipse cx="178" cy="198" rx="8" ry="10" fill="#1c1917"/>
    <circle cx="176" cy="195" r="3.5" fill="#ffffff"/>
    <ellipse cx="242" cy="198" rx="8" ry="10" fill="#1c1917"/>
    <circle cx="240" cy="195" r="3.5" fill="#ffffff"/>

    <!-- Spirited Eyebrows -->
    <path d="M 160 180 Q 178 168 196 178" fill="none" stroke="#292524" stroke-width="5" stroke-linecap="round"/>
    <path d="M 224 178 Q 242 168 260 180" fill="none" stroke="#292524" stroke-width="5" stroke-linecap="round"/>

    <!-- Youthful Nose -->
    <ellipse cx="210" cy="214" rx="10" ry="8" fill="#fcd34d" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Enthusiastic Grin -->
    <path d="M 186 234 Q 210 262 234 234 Z" fill="#991b1b"/>
    <path d="M 190 234 Q 210 244 230 234" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>

    <!-- Woven Straw Hat (草帽) -->
    <!-- Crown Cone/Dome -->
    <path d="M 136 150 C 144 80 180 65 210 65 C 240 65 276 80 284 150 Z" fill="url(#fm2-straw)"/>
    <!-- Straw Weave lines -->
    <path d="M 170 146 Q 210 136 250 146" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 180 116 Q 210 108 240 116" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 194 88 Q 210 82 226 88" fill="none" stroke="#ca8a04" stroke-width="2"/>

    <!-- Red Ribbon Hatband -->
    <path d="M 134 148 Q 210 162 286 148 L 288 158 Q 210 172 132 158 Z" fill="#dc2626"/>

    <!-- Wide Straw Brim -->
    <ellipse cx="210" cy="164" rx="108" ry="24" fill="url(#fm2-straw)" stroke="#a16207" stroke-width="2.5"/>
    <ellipse cx="210" cy="164" rx="98" ry="18" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Role Badge: 农民 -->
  <g transform="translate(290, 24)">
    <rect width="98" height="34" rx="17" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="49" y="23" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#f0f9ff" text-anchor="middle">农民</text>
  </g>
</svg>
