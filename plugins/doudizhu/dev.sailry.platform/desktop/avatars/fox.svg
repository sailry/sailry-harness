<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <linearGradient id="fm1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f4e44"/>
      <stop offset="100%" stop-color="#173d35"/>
    </linearGradient>
    <linearGradient id="fm1-cloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="fm1-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="fm1-towel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="fm1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background container (matches test color #173d35) -->
  <rect width="420" height="420" rx="34" fill="#173d35"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="210" cy="210" r="190" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="210" cy="210" r="180" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#fm1-shadow)">
    <!-- Indigo Cotton Shoulders -->
    <path d="M 60 420 C 60 320 125 280 210 280 C 295 280 360 320 360 420 Z" fill="url(#fm1-cloth)"/>
    
    <!-- White Inner Collar V -->
    <path d="M 170 284 L 210 336 L 250 284" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cloth Placket & Buttons -->
    <line x1="210" y1="336" x2="210" y2="420" stroke="#1e3a8a" stroke-width="4"/>
    <circle cx="210" cy="354" r="6" fill="#f8fafc"/>
    <circle cx="210" cy="384" r="6" fill="#f8fafc"/>
    
    <!-- Rustic Neck -->
    <path d="M 180 240 L 180 290 Q 210 300 240 290 L 240 240 Z" fill="#fdba74"/>

    <!-- Head / Face -->
    <ellipse cx="210" cy="208" rx="74" ry="78" fill="url(#fm1-skin)"/>

    <!-- Ears -->
    <ellipse cx="134" cy="210" rx="13" ry="20" fill="#fed7aa"/>
    <ellipse cx="286" cy="210" rx="13" ry="20" fill="#fed7aa"/>

    <!-- Honest, Warm Cheeks -->
    <ellipse cx="160" cy="226" rx="16" ry="10" fill="#ea580c" opacity="0.25"/>
    <ellipse cx="260" cy="226" rx="16" ry="10" fill="#ea580c" opacity="0.25"/>

    <!-- Warm Smiling Eyes -->
    <path d="M 162 196 Q 178 184 194 196" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
    <path d="M 226 196 Q 242 184 258 196" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>

    <!-- Honest Thick Eyebrows -->
    <path d="M 156 182 Q 176 172 196 182" fill="none" stroke="#292524" stroke-width="6" stroke-linecap="round"/>
    <path d="M 224 182 Q 244 172 264 182" fill="none" stroke="#292524" stroke-width="6" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="210" cy="214" rx="12" ry="9" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>

    <!-- Honest Big Smile -->
    <path d="M 184 236 Q 210 268 236 236 Z" fill="#991b1b"/>
    <path d="M 188 236 Q 210 246 232 236" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>

    <!-- Classic Peasant Knotted White Headband / Towel (白毛巾扎头) -->
    <!-- Base Wrap -->
    <path d="M 132 176 C 132 108 168 96 210 96 C 252 96 288 108 288 176 C 288 178 132 178 132 176 Z" fill="#334155" opacity="0.2"/>
    <!-- Folded towel wrap band -->
    <path d="M 128 176 C 136 126 170 120 210 120 C 250 120 284 126 292 176 C 294 188 126 188 128 176 Z" fill="url(#fm1-towel)"/>
    <path d="M 126 174 Q 210 186 294 174" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Towel Knot at Top/Side (毛巾结) -->
    <g transform="translate(186, 92)">
      <!-- Knot core -->
      <ellipse cx="24" cy="24" rx="14" ry="12" fill="url(#fm1-towel)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Left ear of knot -->
      <path d="M 16 18 C 6 4 2 12 12 24 Z" fill="url(#fm1-towel)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Right ear of knot -->
      <path d="M 32 18 C 42 4 46 12 36 24 Z" fill="url(#fm1-towel)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Fold creases -->
      <path d="M 18 24 Q 24 28 30 24" fill="none" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>

  <!-- Role Badge: 农民 -->
  <g transform="translate(290, 24)">
    <rect width="98" height="34" rx="17" fill="#059669" stroke="#34d399" stroke-width="2"/>
    <text x="49" y="23" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#ecfdf5" text-anchor="middle">农民</text>
  </g>
</svg>
