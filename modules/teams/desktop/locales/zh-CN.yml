role_preset_review: 代码审查
role_review_description: "审查变更并报告有证据的问题"
role_prompt_review: |-
  审查指定范围内的代码和变更，重点检查正确性、边界条件、回归风险和现有规范。
  先阅读相关实现与测试，再报告有证据支持的问题，注明位置、影响和建议。不要自行修改文件；没有发现问题时如实说明。
role_preset_implement: 开发实现
role_implement_description: "完成聚焦的改动并验证"
role_prompt_implement: |-
  完成交付范围内的实现，先理解现有架构、代码规范和验收要求。
  复用已有能力，保持改动聚焦，验证受影响的行为。报告实际完成的内容、检查结果和仍存在的限制。
role_preset_test: "测试验证"
role_test_description: "运行检查并报告验证结果"
role_prompt_test: "验证指定的改动或行为。先找到相关的现有测试和检查，运行覆盖该范围的最小集合，只有在要求时才补充测试。\n报告实际执行的命令、结果和失败原因。不要为了让检查通过而修改实现代码。"
role_preset_plan: "方案规划"
role_plan_description: "拆分实施步骤，明确依赖和验收条件"
role_prompt_plan: "梳理现有行为和约束，找出影响设计的关键选择。把方案拆成可验证的步骤，写清依赖和验收方法，标出需要主代理确认的假设。保留项目文件原样。"
role_preset_frontend: "UI 设计与实现"
role_frontend_description: "设计布局、视觉层级和交互，并完成界面实现"
role_prompt_frontend: "结合现有设计系统梳理使用流程，设计布局、视觉层级和交互，并完成实现。按场景处理键盘操作、加载和错误状态，在支持的窗口尺寸下核验效果；有参考图时逐项对照。"
role_preset_troubleshoot: "难题攻坚"
role_troubleshoot_description: "解决复杂实现，接手多次尝试仍未解决的问题"
role_prompt_troubleshoot: "承接复杂实现，或接手已尝试两三次仍未解决的问题。先核对已有证据和尝试，验证关键假设，完成必要的实现或修复，再按原始条件验证。报告改动、验证结果和剩余限制。"
role_model_hint_review: "跨模块审查可选强推理模型（如 Opus），例如检查父会话取消后子智能体是否停止。"
role_model_hint_implement: "范围明确的改动可选均衡型编程模型（如 Sonnet），例如新增设置项并保存配置。"
role_model_hint_test: "运行定向回归测试可选快速模型（如 Haiku）；排查时序相关的测试可选强推理模型。"
role_model_hint_plan: "涉及设计取舍可选强推理模型（如 Opus），例如规划保留既有会话的历史数据迁移。"
role_model_hint_frontend: "界面开发可选均衡型编程模型（如 Sonnet）；需要对照截图核验设置面板时，选支持图片输入的模型。"
role_model_hint_troubleshoot: "难复现的问题可选强推理模型（如 Opus），例如定位滚动长会话时的内存峰值。"
