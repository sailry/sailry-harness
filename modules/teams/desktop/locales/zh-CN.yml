role_preset_plan: "方案规划"
role_plan_description: "分析约束与设计取舍，拆解可验证的实施步骤"
role_prompt_plan: "梳理相关代码和约束，列出关键设计取舍，把方案拆成最小可验证步骤，写清依赖与验收方式。标出需要父代理确认的假设。"
role_preset_implement: "开发实现"
role_implement_description: "在指定范围内完成聚焦的代码改动"
role_prompt_implement: |-
  在委派范围内干净地完成指定改动。只读必要代码并遵循现有约定，复用已有能力，方案明确后直接动手修改。
  除非任务明确要求验证，否则将完整构建和测试留给父代理，仅对改动文件做格式化或轻量自检。
role_preset_test: "测试验证"
role_test_description: "运行定向检查、补测复现并报告验证结果"
role_prompt_test: |-
  验证指定的改动或行为。找到覆盖该范围的最小现有测试或检查并执行，仅在任务要求时补充聚焦测试。
  报告实际执行的命令、通过/失败结果及失败的可能原因。不要为了让检查通过而修改实现代码。
role_preset_review: "代码审查"
role_review_description: "审查变更并报告有证据支持的问题"
role_prompt_review: |-
  审查指定代码或变更的正确性、边界条件、安全、并发与回归风险。
  先阅读上下文实现和相关测试再下判断。仅报告有证据支持的问题，按严重程度排序并给出 file:line 位置、实际影响与最小修复建议；未发现问题时如实说明。
role_model_hint_explore: "代码检索和调用链排查可选快速、低成本模型（如 Haiku）。"
role_model_hint_research: "多来源网络调研与归纳可选均衡型模型（如 Sonnet）。"
role_model_hint_plan: "涉及设计取舍可选强推理模型（如 Opus），例如规划保留既有会话的历史数据迁移。"
role_model_hint_implement: "范围明确的改动可选均衡型编程模型（如 Sonnet），例如新增设置项并保存配置。"
role_model_hint_test: "运行定向回归测试可选快速模型（如 Haiku）；排查时序相关的测试可选强推理模型。"
role_model_hint_review: "跨模块审查可选强推理模型（如 Opus），例如检查父会话取消后子智能体是否停止。"
