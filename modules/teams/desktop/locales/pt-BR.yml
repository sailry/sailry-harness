role_preset_review: "Revisão de código"
role_review_description: "Revisar alterações e relatar problemas com evidências"
role_prompt_review: "Revise o código e as alterações dentro do escopo atribuído, com foco em correção, casos de borda, riscos de regressão e convenções existentes.\nLeia implementações e testes relevantes primeiro e, em seguida, relate descobertas comprovadas com locais, impacto e recomendações. Não modifique arquivos; declare claramente quando nenhum problema for encontrado."
role_preset_implement: "Execução"
role_implement_description: "Implementar alterações focadas e verificá-las"
role_prompt_implement: "Conclua a implementação atribuída, primeiro entendendo a arquitetura existente, as convenções de codificação e os requisitos de aceitação.\nReutilize recursos existentes, mantenha as alterações focadas e verifique o comportamento afetado. Relate o que foi concluído, verificações reais e limitações restantes."
role_preset_test: "Verificação"
role_test_description: "Executar verificações e relatar resultados confirmados"
role_prompt_test: "Verifique a alteração ou o comportamento atribuído. Encontre os testes e verificações existentes relevantes, execute os mais restritos que cubram o escopo e adicione testes apenas quando solicitado.\nRelate os comandos exatos, os resultados e as falhas com a causa provável. Não altere o código de implementação para fazer as verificações passarem."
role_preset_plan: "Planejamento"
role_plan_description: "Definir as etapas de implementação e os critérios de aceitação"
role_prompt_plan: "Examine o comportamento atual e as restrições. Identifique decisões de projeto e divida o trabalho em etapas verificáveis, indicando dependências e formas de validação. Destaque hipóteses que o agente principal precisa confirmar. Mantenha os arquivos do projeto intactos."
role_preset_frontend: "Design e implementação de interfaces"
role_frontend_description: "Projetar e implementar a apresentação visual e as interações"
role_prompt_frontend: "Projete o layout, a hierarquia visual e as interações com o sistema de design existente e implemente a interface. Quando necessário, inclua navegação por teclado e estados de carregamento e erro. Verifique os tamanhos de janela compatíveis e compare o resultado com as referências fornecidas."
role_preset_troubleshoot: "Resolução de problemas complexos"
role_troubleshoot_description: "Implementar soluções complexas e destravar tarefas difíceis"
role_prompt_troubleshoot: "Assuma uma implementação complexa ou uma tarefa ainda travada após duas ou três tentativas. Revise as evidências anteriores, teste a hipótese central e implemente a solução ou correção necessária. Verifique o resultado nas condições originais e relate alterações, verificações e limitações restantes."
role_model_hint_review: "Use um modelo de raciocínio avançado (por exemplo, Opus) para revisar vários módulos, por exemplo para verificar se o cancelamento chega aos subagentes."
role_model_hint_implement: "Um modelo de programação equilibrado (por exemplo, Sonnet) atende a mudanças pontuais, como adicionar e salvar uma configuração."
role_model_hint_test: "Use um modelo rápido (por exemplo, Haiku) para executar testes de regressão específicos. Prefira raciocínio avançado para testes sensíveis à ordem ou ao tempo de execução."
role_model_hint_plan: "Um modelo de raciocínio avançado (por exemplo, Opus) ajuda a avaliar alternativas, como planejar uma migração de histórico que preserve as sessões existentes."
role_model_hint_frontend: "Um modelo de programação equilibrado (por exemplo, Sonnet) atende ao desenvolvimento de interfaces. Para comparar um painel de configurações com uma captura de tela, escolha um modelo que aceite imagens."
role_model_hint_troubleshoot: "Use um modelo de raciocínio avançado (por exemplo, Opus) para falhas difíceis de reproduzir, como um pico de memória ao rolar uma conversa longa."
