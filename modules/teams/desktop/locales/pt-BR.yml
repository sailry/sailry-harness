role_preset_plan: "Planejamento"
role_plan_description: "Analisar restrições e definir etapas verificáveis de implementação"
role_prompt_plan: "Examine o código e as restrições relevantes, destaque as principais decisões de design e divida o trabalho nas menores etapas verificáveis com dependências e critérios de aceitação. Sinalize hipóteses que o agente principal precisa resolver."
role_preset_implement: "Implementação"
role_implement_description: "Implementar alterações pontuais com clareza dentro dos arquivos atribuídos"
role_prompt_implement: "Conclua a alteração atribuída com clareza dentro do escopo delegado. Leia apenas o código e as convenções necessários, reutilize abstrações existentes e parta direto para a edição assim que a abordagem estiver clara.\nDeixe builds completos e suítes de testes para o agente principal, salvo se a tarefa pedir verificação; limite as autoverificações à formatação ou verificações pontuais nos arquivos alterados."
role_preset_test: "Verificação"
role_test_description: "Executar verificações pontuais, reproduzir regressões e relatar resultados"
role_prompt_test: "Verifique a alteração ou o comportamento atribuído. Encontre os testes, linters ou verificações existentes mais restritos que cubram o escopo, execute-os e adicione testes focados apenas quando solicitado.\nRelate os comandos exatos, os resultados de aprovação/falha e a causa provável de qualquer falha. Não altere o código de implementação para fazer as verificações passarem."
role_preset_review: "Revisão de código"
role_review_description: "Revisar alterações e relatar problemas com evidências"
role_prompt_review: "Revise o código ou diff atribuído quanto à correção, casos de borda, segurança, concorrência e riscos de regressão.\nLeia a implementação e os testes ao redor antes de julgar. Relate apenas achados com evidências, ordenados por gravidade com locais file:line, impacto concreto e correções mínimas, sem modificar arquivos; informe claramente quando nenhum problema for encontrado."
role_model_hint_explore: "Use um modelo rápido e econômico (por exemplo, Haiku) para buscas rápidas no código e rastreamento de chamadas."
role_model_hint_research: "Use um modelo equilibrado (por exemplo, Sonnet) para pesquisa na web em múltiplas fontes e síntese."
role_model_hint_plan: "Um modelo de raciocínio avançado (por exemplo, Opus) ajuda a avaliar alternativas, como planejar uma migração de histórico que preserve as sessões existentes."
role_model_hint_implement: "Um modelo de programação equilibrado (por exemplo, Sonnet) atende a mudanças pontuais, como adicionar e salvar uma configuração."
role_model_hint_test: "Use um modelo rápido (por exemplo, Haiku) para executar testes de regressão específicos. Prefira raciocínio avançado para testes sensíveis à ordem ou ao tempo de execução."
role_model_hint_review: "Use um modelo de raciocínio avançado (por exemplo, Opus) para revisar vários módulos, por exemplo para verificar se o cancelamento chega aos subagentes."
