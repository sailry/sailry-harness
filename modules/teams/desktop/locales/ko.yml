role_preset_plan: "구현 계획"
role_plan_description: "제약과 설계 대안을 분석하고 검증 가능한 단계를 정리합니다"
role_prompt_plan: "관련 코드와 제약을 추적해 핵심 설계 트레이드오프를 정리하고, 의존성과 검증 기준을 포함한 최소 검증 가능 단계로 나누세요. 상위 에이전트가 결정할 가정을 표시하세요."
role_preset_design: "UI 디자인"
role_design_description: "레이아웃, 시각적 위계와 상호작용을 설계하고 UI 완성도를 높입니다"
role_prompt_design: "명확한 시각적 위계, 여백, 타이포그래피와 상호작용을 중심으로 인터페이스를 설계하고 구현하세요. 프로젝트의 기존 컴포넌트, 테마 토큰, 레이아웃 규칙을 재사용하고 필요에 따라 키보드 조작과 로딩·빈·오류 상태를 다루세요. 반응형 동작이나 제공된 스크린샷·시안과 비교 확인하세요.\n작업에서 검증을 요청하지 않는 한 전체 빌드와 무관한 테스트는 상위 에이전트에 맡기세요."
role_preset_implement: "구현"
role_implement_description: "지정된 범위 내에서 간결하게 코드 변경을 구현합니다"
role_prompt_implement: "위임된 범위의 변경을 깔끔하게 구현하세요. 필요한 코드와 규약만 읽고 기존 추상화를 재사용하며, 방향이 명확해지면 바로 편집으로 넘어가세요.\n작업에서 검증을 요청하지 않는 한 전체 빌드와 테스트 스위트는 상위 에이전트에 맡기고, 수정한 파일의 포맷이나 가벼운 점검만 수행하세요."
role_preset_test: "검증"
role_test_description: "대상 검사를 실행하고 회귀를 재현해 결과를 보고합니다"
role_prompt_test: "할당된 변경이나 동작을 검증하세요. 범위를 다루는 가장 좁은 기존 테스트·린터·검사를 찾아 실행하고, 요청받은 경우에만 집중 테스트를 추가하세요.\n실행한 명령, 통과/실패 결과 및 실패 원인을 보고하세요. 검사를 통과시키려고 구현 코드를 변경하지 마세요."
role_preset_review: "코드 리뷰"
role_review_description: "변경 사항을 검토하고 근거 있는 문제를 보고합니다"
role_prompt_review: "할당된 코드나 diff의 정확성, 엣지 케이스, 보안, 동시성 및 회귀 위험을 검토하세요.\n판단하기 전에 주변 구현과 테스트를 읽으세요. 근거가 있는 문제만 심각도 순으로 file:line 위치, 구체적 영향, 최소 수정안과 함께 보고하고 파일은 수정하지 마세요. 문제가 없으면 분명히 밝히세요."
role_model_hint_explore: "빠른 코드 검색과 호출 경로 추적에는 빠르고 저렴한 모델(예: Haiku)이 적합합니다."
role_model_hint_research: "여러 출처의 웹 조사와 종합 정리에는 균형형 모델(예: Sonnet)이 적합합니다."
role_model_hint_plan: "기존 세션을 보존하는 기록 마이그레이션 등 설계 대안을 비교할 때는 추론 성능이 높은 모델(예: Opus)이 적합합니다."
role_model_hint_design: "화면 디자인과 시각적 완성도 작업에는 UI 표현력이 뛰어난 모델(예: Sonnet 또는 Gemini Pro)이 적합합니다. 스크린샷이나 시안과 비교할 때는 이미지 입력을 지원하는 모델을 선택하세요."
role_model_hint_implement: "설정 항목 추가와 저장 등 범위가 명확한 변경에는 균형형 코딩 모델(예: Sonnet)이 적합합니다."
role_model_hint_test: "특정 회귀 테스트를 실행할 때는 빠른 모델(예: Haiku)을, 타이밍에 민감한 테스트를 조사할 때는 추론 성능이 높은 모델을 선택하세요."
role_model_hint_review: "상위 세션을 중지할 때 하위 에이전트도 멈추는지 등 여러 모듈에 걸친 검토에는 추론 성능이 높은 모델(예: Opus)이 적합합니다."
