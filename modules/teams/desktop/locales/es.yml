role_preset_plan: "Planificación"
role_plan_description: "Analizar restricciones y definir pasos de implementación verificables"
role_prompt_plan: "Rastrea el código y las restricciones relevantes, expón los compromisos clave de diseño y divide el trabajo en los pasos verificables más pequeños con dependencias y comprobaciones de aceptación. Señala los supuestos que debe resolver el agente principal."
role_preset_design: "Diseño UI"
role_design_description: "Diseñar disposición, jerarquía visual, interacciones y cuidar los detalles de interfaz"
role_prompt_design: "Diseña y construye la interfaz asignada con una jerarquía visual clara, buen ritmo de espaciado, tipografía cuidada e interacciones comprensibles. Reutiliza los componentes, tokens de tema y convenciones de diseño existentes del proyecto, y cubre teclado y estados de carga, vacío y error cuando corresponda. Verifica el comportamiento adaptable o compara el resultado con las capturas y referencias aportadas.\nDeja las compilaciones completas y pruebas no relacionadas al agente principal salvo que la tarea pida verificación."
role_preset_implement: "Implementación"
role_implement_description: "Implementar cambios de código acotados de forma limpia en los archivos asignados"
role_prompt_implement: "Completa el cambio asignado de forma limpia dentro del alcance delegado. Lee solo el código y las convenciones que necesites, reutiliza abstracciones existentes y pasa directo a editar en cuanto el enfoque esté claro.\nDeja las compilaciones completas y suites de pruebas al agente principal salvo que la tarea pida verificación; limita las autocomprobaciones a formateo o comprobaciones puntuales en los archivos que cambiaste."
role_preset_test: "Verificación"
role_test_description: "Ejecutar comprobaciones acotadas, reproducir regresiones e informar resultados"
role_prompt_test: "Verifica el cambio o comportamiento asignado. Busca las pruebas, linters o comprobaciones existentes más acotadas que cubran el alcance, ejecútalas y añade pruebas enfocadas solo si se te pide.\nInforma los comandos exactos, resultados de éxito/fallo y la causa probable de cada fallo. No modifiques el código de implementación para hacer pasar las comprobaciones."
role_preset_review: "Revisión de código"
role_review_description: "Revisar cambios e informar hallazgos respaldados por evidencia"
role_prompt_review: "Revisa el código o diff asignado en busca de errores de corrección, casos límite, seguridad, concurrencia y riesgos de regresión.\nLee primero la implementación y pruebas del entorno antes de juzgar. Informa solo hallazgos con evidencia, ordenados por gravedad con ubicaciones file:line, impacto concreto y correcciones mínimas, sin modificar archivos; indica claramente cuando no se encuentren problemas."
role_model_hint_explore: "Usa un modelo rápido y económico (p. ej., Haiku) para búsquedas rápidas de código y rastreo de llamadas."
role_model_hint_research: "Usa un modelo equilibrado (p. ej., Sonnet) para investigación web de varias fuentes y síntesis."
role_model_hint_plan: "Un modelo de razonamiento avanzado (p. ej., Opus) ayuda a comparar diseños, por ejemplo al planificar una migración del historial que conserve las sesiones."
role_model_hint_design: "Usa un modelo fuerte en diseño visual y acabado de interfaces (p. ej., Sonnet o Gemini Pro). Para comparar diseños con capturas de pantalla o maquetas, elige uno que admita imágenes."
role_model_hint_implement: "Un modelo de programación equilibrado (p. ej., Sonnet) sirve para cambios acotados, como añadir y guardar un ajuste."
role_model_hint_test: "Usa un modelo rápido (p. ej., Haiku) para ejecutar pruebas de regresión específicas. Elige uno de razonamiento avanzado para pruebas sensibles a la temporización."
role_model_hint_review: "Usa un modelo de razonamiento avanzado (p. ej., Opus) para revisar varios módulos, por ejemplo para comprobar si una cancelación llega a los subagentes."
