role_preset_plan: "実装計画"
role_plan_description: "制約と設計のトレードオフを整理し、検証可能な手順に分ける"
role_prompt_plan: "関連コードと制約を追い、重要な設計上の判断を整理して、依存関係と検証方法付きの最小の検証可能な手順に分解する。親エージェントの確認が必要な前提を明記する。"
role_preset_implement: "実装"
role_implement_description: "割り当てられた範囲で簡潔にコード変更を実装する"
role_prompt_implement: "委任された範囲の変更を的確に実装する。必要なコードと規約だけを読み、既存の仕組みを再利用し、方針が固まったらすぐ編集に移る。\nタスクで検証を求められない限り、全体ビルドとテスト実行は親エージェントに任せ、変更ファイルの整形や軽量な確認にとどめる。"
role_preset_test: "検証"
role_test_description: "対象を絞った検査を実行し、検証結果を報告する"
role_prompt_test: "割り当てられた変更や動作を検証する。対象範囲をカバーする最小限の既存テストやチェックを実行し、求められた場合のみテストを追加する。\n実行したコマンド、合否、失敗の考えられる原因を報告する。チェックを通すために実装コードを変更しない。"
role_preset_review: "コードレビュー"
role_review_description: "変更をレビューし、根拠のある指摘を報告する"
role_prompt_review: "割り当てられたコードや差分の正確性、エッジケース、セキュリティ、並行性、回帰リスクをレビューする。\n周辺の実装とテストを読んでから判断する。根拠のある指摘のみを重要度順に file:line・影響・最小の修正案付きで報告し、ファイルは変更しない。問題がなければその旨を明記する。"
role_model_hint_explore: "コード検索や呼び出し経路の追跡には、高速で低コストなモデル（例：Haiku）が適している。"
role_model_hint_research: "複数ソースの Web 調査と要約にはバランス型モデル（例：Sonnet）が適している。"
role_model_hint_plan: "既存のセッションを保持する履歴移行など、設計上の選択を伴う計画には推論に強いモデル（例：Opus）が適している。"
role_model_hint_implement: "設定項目の追加と保存など、範囲が明確な変更にはバランス型のコーディングモデル（例：Sonnet）が適している。"
role_model_hint_test: "対象を絞った回帰テストには高速モデル（例：Haiku）、タイミングに依存するテストの調査には推論に強いモデルが適している。"
role_model_hint_review: "親セッションの停止が子エージェントに伝わるかなど、複数モジュールのレビューには推論に強いモデル（例：Opus）が適している。"
