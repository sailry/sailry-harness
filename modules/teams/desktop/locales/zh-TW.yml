role_preset_plan: "方案規劃"
role_plan_description: "分析限制與設計取捨，拆解可驗證的實作步驟"
role_prompt_plan: "梳理相關程式碼與限制，列出關鍵設計取捨，將方案拆成最小可驗證步驟，寫明相依關係與驗收方式。標示需要父代理確認的假設。"
role_preset_implement: "開發實作"
role_implement_description: "在指定範圍內完成聚焦的程式碼改動"
role_prompt_implement: "在委派範圍內乾淨完成指定改動。只讀必要程式碼並遵循現有規範，複用既有能力，方案明確後直接修改。\n除非任務明確要求驗證，否則將完整建置與測試留給父代理，僅對改動檔案做格式化或輕量自檢。"
role_preset_test: "測試驗證"
role_test_description: "執行定向檢查、補測重現並回報驗證結果"
role_prompt_test: "驗證指定的變更或行為。找出涵蓋該範圍的最小現有測試或檢查並執行，僅在任務要求時補充聚焦測試。\n回報實際執行的命令、通過/失敗結果及失敗的可能原因。不要為了讓檢查通過而修改實作程式碼。"
role_preset_review: "程式碼審查"
role_review_description: "審查變更並回報有證據支援的問題"
role_prompt_review: "審查指定程式碼或變更的正確性、邊界條件、安全、並行與迴歸風險。\n先閱讀上下文實作與相關測試再判斷。僅回報有證據支援的問題，依嚴重程度排序並提供 file:line 位置、實際影響與最小修復建議；未發現問題時如實說明。"
role_model_hint_explore: "程式碼檢索與呼叫鏈排查可選快速、低成本模型（例如 Haiku）。"
role_model_hint_research: "多來源網路調研與歸納可選均衡型模型（例如 Sonnet）。"
role_model_hint_plan: "涉及設計取捨可選推理能力強的模型（例如 Opus），例如規劃保留既有工作階段的歷程資料遷移。"
role_model_hint_implement: "範圍明確的修改可選均衡型程式設計模型（例如 Sonnet），例如新增設定欄位並儲存設定。"
role_model_hint_test: "執行特定回歸測試可選快速模型（例如 Haiku）；排查涉及時序的測試可選推理能力強的模型。"
role_model_hint_review: "跨模組審查可選推理能力強的模型（例如 Opus），例如檢查父工作階段取消後子智能體是否停止。"
