role_preset_plan: "Planification"
role_plan_description: "Analyser les contraintes et définir des étapes vérifiables"
role_prompt_plan: "Examinez le code et les contraintes concernés, mettez en évidence les arbitrages clés et découpez le travail en plus petites étapes vérifiables avec leurs dépendances et contrôles d’acceptation. Signalez les hypothèses à trancher par l’agent parent."
role_preset_implement: "Implémentation"
role_implement_description: "Réaliser proprement des modifications ciblées dans le périmètre assigné"
role_prompt_implement: "Réalisez proprement la modification assignée dans le périmètre délégué. Ne lisez que le code et les conventions nécessaires, réutilisez les abstractions existantes et passez directement à l’édition dès que l’approche est claire.\nLaissez les builds complets et suites de tests à l’agent parent sauf demande explicite de vérification ; limitez les auto-vérifications au formatage ou à des contrôles ciblés sur vos fichiers modifiés."
role_preset_test: "Vérification"
role_test_description: "Exécuter des vérifications ciblées, reproduire les régressions et rapporter les résultats"
role_prompt_test: "Vérifiez la modification ou le comportement attribué. Trouvez les tests, linters ou contrôles existants les plus ciblés qui couvrent le périmètre, exécutez-les et n’ajoutez des tests ciblés que sur demande.\nIndiquez les commandes exactes, les réussites/échecs et la cause probable de chaque échec. Ne modifiez pas le code d’implémentation pour faire passer les vérifications."
role_preset_review: "Revue de code"
role_review_description: "Examiner les modifications et signaler les problèmes étayés"
role_prompt_review: "Examinez le code ou le diff assigné pour déceler les erreurs de logique, cas limites, risques de sécurité, de concurrence et de régression.\nLisez d’abord l’implémentation et les tests environnants avant de juger. Ne signalez que des constats étayés, classés par gravité avec file:line, impact concret et correctifs minimaux, sans modifier de fichiers ; indiquez clairement lorsqu’aucun problème n’est trouvé."
role_model_hint_explore: "Un modèle rapide et économique (p. ex. Haiku) convient aux recherches rapides dans le code et au suivi des appels."
role_model_hint_research: "Un modèle équilibré (p. ex. Sonnet) convient aux recherches web multi-sources et à leur synthèse."
role_model_hint_plan: "Un modèle à raisonnement avancé (p. ex. Opus) convient aux choix de conception, comme planifier une migration d’historique qui préserve les sessions existantes."
role_model_hint_implement: "Un modèle de programmation équilibré (p. ex. Sonnet) convient à une modification ciblée, comme ajouter et enregistrer un paramètre."
role_model_hint_test: "Un modèle rapide (p. ex. Haiku) suffit pour lancer des tests de régression ciblés. Privilégiez le raisonnement avancé pour les tests sensibles au séquencement."
role_model_hint_review: "Un modèle à raisonnement avancé (p. ex. Opus) convient aux revues transversales, par exemple pour vérifier la propagation d’une annulation aux sous-agents."
