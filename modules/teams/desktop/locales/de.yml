role_preset_plan: "Planung"
role_plan_description: "Rahmenbedingungen analysieren und prüfbare Schritte festlegen"
role_prompt_plan: "Untersuche den relevanten Code und die Rahmenbedingungen, benenne zentrale Entwurfsabwägungen und gliedere die Arbeit in kleinste prüfbare Schritte mit Abhängigkeiten und Abnahmekriterien. Kennzeichne Annahmen, die der übergeordnete Agent klären muss."
role_preset_implement: "Implementierung"
role_implement_description: "Klar abgegrenzte Codeänderungen sauber umsetzen"
role_prompt_implement: "Setze die zugewiesene Änderung im vorgegebenen Umfang sauber um. Lies nur den nötigen Code und die Konventionen, nutze vorhandene Abstraktionen wieder und wechsle direkt zum Bearbeiten, sobald der Ansatz klar ist.\nÜberlasse vollständige Builds und Testsuiten dem übergeordneten Agenten, sofern keine Prüfung angefordert wurde; beschränke Selbstprüfungen auf Formatierung oder gezielte Prüfungen der geänderten Dateien."
role_preset_test: "Prüfung"
role_test_description: "Gezielte Prüfungen ausführen, Regressionen reproduzieren und Ergebnisse melden"
role_prompt_test: "Prüfe die zugewiesene Änderung oder das Verhalten. Finde die engsten vorhandenen Tests, Linter oder Prüfungen für den Umfang, führe sie aus und ergänze gezielte Tests nur auf Anfrage.\nMelde die genauen Befehle, Ergebnisse und die wahrscheinliche Ursache jedes Fehlers. Ändere keinen Implementierungscode, um Prüfungen bestehen zu lassen."
role_preset_review: "Code-Review"
role_review_description: "Änderungen prüfen und belegte Befunde melden"
role_prompt_review: "Prüfe den zugewiesenen Code oder Diff auf Korrektheit, Randfälle, Sicherheit, Nebenläufigkeit und Regressionsrisiken.\nLies zuerst die umliegende Implementierung und Tests. Melde nur belegte Befunde nach Schweregrad geordnet mit file:line-Angaben, konkreten Auswirkungen und minimalen Korrekturen, ohne Dateien zu ändern; gib klar an, wenn keine Probleme gefunden wurden."
role_model_hint_explore: "Für schnelle Code-Recherchen und Aufrufpfade eignet sich ein schnelles, günstiges Modell (z. B. Haiku)."
role_model_hint_research: "Für Webrecherchen aus mehreren Quellen und deren Zusammenfassung eignet sich ein ausgewogenes Modell (z. B. Sonnet)."
role_model_hint_plan: "Für Entwurfsentscheidungen eignet sich ein schlussfolgerungsstarkes Modell (z. B. Opus), etwa bei der Planung einer Migration, die vorhandene Sitzungen erhält."
role_model_hint_implement: "Ein ausgewogenes Programmiermodell (z. B. Sonnet) eignet sich für klar begrenzte Änderungen, etwa ein neues Einstellungsfeld samt Speicherung."
role_model_hint_test: "Für gezielte Regressionstests eignet sich ein schnelles Modell (z. B. Haiku). Für zeitkritische Testabläufe ist ein schlussfolgerungsstarkes Modell sinnvoll."
role_model_hint_review: "Für modulübergreifende Prüfungen eignet sich ein schlussfolgerungsstarkes Modell (z. B. Opus), etwa um zu prüfen, ob ein Abbruch auch die Unteragenten stoppt."
