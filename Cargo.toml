[workspace]
members = ["apps/desktop", "apps/host", "crates/node-runtime", "crates/protocol", "crates/link", "crates/client", "crates/mobile-bridge", "crates/speech", "crates/content", "crates/embedding", "crates/model-assets", "crates/ocr", "crates/decision", "tools/release"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
tracing = "=0.1.44"
tracing-log = "=0.2.0"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry", "tracing-log", "json"] }
tracing-appender = "=0.2.5"
rolling-file = "=0.2.0"
# Retains the native subsystem/category strings through the log object's lifetime.
oslog = { git = "https://github.com/steven-joruk/oslog", rev = "8afad459855d8a77b2c0618fe29016d87674d6a3", default-features = false }
opendal = { version = "=0.57.0", default-features = false, features = ["services-fs", "services-s3", "services-webdav", "reqwest-rustls-no-provider-tls"] }
age = { version = "=0.11.5", default-features = false }
anyhow = "=1.0.104"
ammonia = "=4.1.4"
html5ever = "=0.39.0"
html5gum = "=0.8.4"
ropey = "=2.0.0-beta.1"
percent-encoding = "=2.3.2"
embed-resource = "=3.0.11"
# Application permissions and selection shortcuts remain separate from computer use.
cua-platform-macos = { package = "platform-macos", git = "https://github.com/trycua/cua.git", rev = "58aba84b5b83d77e7e2b0f006547699eb594e50d" }
sherpa-onnx = { version = "=1.13.8", default-features = false }
sailry-speech = { path = "crates/speech" }
sailry-embedding = { path = "crates/embedding" }
sailry-ocr = { path = "crates/ocr" }
sailry-decision = { path = "crates/decision" }
minijinja = { version = "=3.0.1", default-features = false, features = ["builtins", "json", "serde", "fuel", "macros", "multi_template", "std_collections"] }
oar-ocr-core = { version = "=0.10.0", default-features = false, features = ["simd"] }
ndarray = "=0.17.2"
hayro = { version = "=0.8.0", default-features = false, features = ["embed-cmaps", "simd"] }
sailry-model-assets = { path = "crates/model-assets" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-28"] }
libloading = "=0.9.0"
prost = "=0.14.4"
memmap2 = "=0.9.11"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
rayon = "=1.12.0"
sailry-content = { path = "crates/content" }
# The pinned release exposes owned provider construction through this feature.
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXError", "AXAttributeConstants", "AXRoleConstants", "AXActionConstants", "AXValue"] }
objc2-core-graphics = { version = "=0.3.2", features = ["CGWindow"] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3", "common-controls-v6"] }
gpui-kit = { git = "https://github.com/dux-web/gpui-component", rev = "7fc6a4cfa126a23ad11ed8fed58186b51e451d64", features = ["tree-sitter-languages", "gpui-fast"] }
gpui-fps = { git = "https://github.com/dux-web/gpui-component", rev = "7fc6a4cfa126a23ad11ed8fed58186b51e451d64", features = ["gpui-fast"] }
gpui-shell = { git = "https://github.com/dux-web/gpui-component", rev = "7fc6a4cfa126a23ad11ed8fed58186b51e451d64", features = ["gpui-fast"] }
gpui-webview = { git = "https://github.com/dux-web/gpui-component", rev = "7fc6a4cfa126a23ad11ed8fed58186b51e451d64", features = ["gpui-fast"] }
wry = { package = "lb-wry", version = "=0.53.3", features = ["transparent", "devtools"] }
rust-i18n = "=4.2.0"
sys-locale = "=0.3.2"
objc2 = "=0.6.4"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSRunLoop", "NSDate", "NSError", "NSString", "NSUUID", "NSHTTPCookie", "NSDictionary", "NSArray", "NSSet"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSVisualEffectView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKWebView", "WKSnapshotConfiguration", "WKHTTPCookieStore", "WKWebsiteDataRecord", "block2"] }
raw-window-handle = "=0.6.2"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "signal", "macros", "io-util"] }
tempfile = "=3.27.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
dirs = "=6.0.0"
thiserror = "=2.0.20"
libc = "=0.2.189"
sailry-node-runtime = { path = "crates/node-runtime" }
sailry-protocol = { path = "crates/protocol" }
sailry-link = { path = "crates/link" }
sailry-client = { path = "crates/client" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
# Keep the Node VM on its exact published source, separate from Kit's JIT facade.
rquickjs = { version = "=0.12.2", git = "https://github.com/DelSkayn/rquickjs.git", rev = "635f9322ccc875e3f9851e7f75ec538cf3274fd5", features = ["loader"] }
roxmltree = "=0.21.1"
htmd = "=0.5.5"
schemars = "=1.2.2"
umya-spreadsheet = "=3.1.0"
lopdf = { version = "=0.45.0", default-features = false }
base64 = "=0.22.1"
jsonschema = { version = "=0.47.0", default-features = false }
qrcode = { version = "=0.14.1", default-features = false, features = ["image"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
serde-saphyr = { version = "=0.0.29", default-features = false, features = ["deserialize"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
turso = { version = "=0.8.3", default-features = false, features = ["fts"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
lsp-types = "=0.97.0"
flate2 = "=1.1.10"
tar = "=0.4.46"
xz2 = { version = "=0.1.7", features = ["static"] }
toml = "=1.1.5"
bytes = "=1.12.1"
tokio-util = { version = "=0.7.19", features = ["rt", "codec"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
self_update = { version = "=1.3.0", default-features = false, features = ["async", "manifest", "checksums", "signatures", "archive-zip", "compression-zip-deflate"] }
ed25519-dalek = "=3.0.0"
semver = "=1.0.28"
zipsign-api = { version = "=0.2.1", default-features = false }
# Reuse the locked HTTP stack for bounded, opt-in model acceptance fixtures.
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
system-configuration = "=0.8.0"
windows-registry = "=0.6.1"
http-body-util = "=0.1.5"
eventsource-stream = "=0.2.3"
zeroize = { version = "=1.9.0", features = ["derive"] }
blake3 = "=1.8.7"
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
pbkdf2 = "=0.12.2"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
md-5 = "=0.10.6"
security-framework = "=3.7.0"
block2 = "=0.6.2"
mime_guess = "=2.0.5"
file-format = { version = "=0.29.0", default-features = false, features = ["reader-ebml", "reader-id3v2", "reader-mp4"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk", "network"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc"] }
flutter_rust_bridge = "=2.13.0"
jni = { version = "=0.22.4", default-features = false }
rustls-platform-verifier = "=0.7.0"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
cap-tempfile = "=4.0.3"
trash = "=5.2.6"
regex = "=1.13.1"
encoding_rs = "=0.8.40"
ignore = "=0.4.33"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
pulldown-cmark = { version = "=0.13.4", default-features = false }
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.25"
russh-sftp = "=3.0.0"
russh = { version = "=0.62.4", default-features = false, features = ["flate2", "ring", "rsa"] }
# The SQLx fork exposes separate tunnel routing, verified optional TLS, and SQLite NOFOLLOW.
# See its SAILRY_PATCHES.md; Node business storage uses the native Turso driver.
sqlx = { version = "=0.9.0", git = "https://github.com/sailry/sqlx.git", rev = "747f74eb23aaea1f545ab08ab9c2d12f6628abed", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql-rsa", "sqlite"] }
libsqlite3-sys = "=0.38.2"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "=0.8.4"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
webpki-roots = "=1.0.9"
notify = "=8.2.0"
globset = "=0.4.20"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https", "ssh"] }
portable-pty = "=0.9.0"
vte = { version = "=0.15.0", default-features = false }
which = "=8.0.6"
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
libghostty-vt = { git = "https://github.com/sailry/libghostty-rs.git", rev = "0b239afc87748c2a4bced30194a87f075a474a4b", default-features = false, features = ["kitty-graphics"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
adk-browser = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false }
adk-eval = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false }
cpal = "=0.18.2"
adk-sandbox = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false, features = ["sandbox-macos", "sandbox-linux"] }
adk-core = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false }
adk-gemini = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false }
adk-session = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false }
adk-runner = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false }
adk-agent = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false }
adk-model = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false, features = ["openai", "openai-ws", "anthropic", "gemini", "deepseek", "opencode", "azure-ai"] }
adk-tool = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false, features = ["mcp"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["auth", "client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
adk-acp = { git = "https://github.com/dux-web/adk-rust.git", rev = "2d5c3731efacbe63f38622a92352bde5272b1359", default-features = false }
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
futures = "=0.3.34"
url = "=2.5.8"
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots", "connect"] }

[patch.crates-io]
rquickjs = { git = "https://github.com/dux-web/gpui-component", rev = "7fc6a4cfa126a23ad11ed8fed58186b51e451d64" }
gpui-fast = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
gpui-fast-macros = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
gpui-fast-apple = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
gpui-fast-wgpu = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
gpui-fast-macos = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
gpui-fast-linux = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
gpui-fast-windows = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
gpui-fast-web = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
gpui-fast-platform = { git = "https://github.com/dux-web/gpui-fast", rev = "aa12fda8c18c5b8fb1a0b2ff16650cf138908b8b" }
rmcp = { git = "https://github.com/sailry/rust-sdk.git", rev = "5e8fb5a9502d0fd153c29369b11e93bee88e63ac" }
portable-pty = { git = "https://github.com/sailry/wezterm.git", rev = "e814e06b5149d73ddbcb5be670b41855b2873c74" }

[profile.release]
strip = "symbols"

# Keep development code and unwind metadata small without disabling unwinding.
[profile.dev]
opt-level = "z"
debug = "limited"
split-debuginfo = "unpacked"
incremental = false

# Keep text geometry and layout hot paths optimized during desktop development.
[profile.dev.package]
gpui-base = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
taffy = { opt-level = 3 }

# Compile Node test targets without size optimization; release settings stay unchanged.
[profile.test.package.sailry-node-runtime]
opt-level = 0
