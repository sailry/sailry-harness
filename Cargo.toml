[workspace]
members = ["apps/desktop", "apps/host", "crates/node-runtime", "crates/protocol", "crates/link", "crates/client", "crates/mobile-bridge", "crates/speech"]
exclude = ["vendor/rmcp", "vendor/gpui-base", "vendor/gpui-component", "vendor/gpui-renderer/gpui", "vendor/gpui-renderer/apple", "vendor/gpui-renderer/wgpu", "vendor/gpui-renderer/windows", "vendor/rquickjs-compat", "vendor/block", "vendor/libghostty-vt-sys", "vendor/adk-model"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
embed-resource = "=3.0.11"
# Official Cua Driver 0.32.0; all driver packages use the unmodified release.
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "58aba84b5b83d77e7e2b0f006547699eb594e50d" }
cua-driver-contract = { git = "https://github.com/trycua/cua.git", rev = "58aba84b5b83d77e7e2b0f006547699eb594e50d" }
# The SDK host starts the official macOS overlay's main-thread loop.
cua-platform-macos = { package = "platform-macos", git = "https://github.com/trycua/cua.git", rev = "58aba84b5b83d77e7e2b0f006547699eb594e50d" }
sherpa-onnx = { version = "=1.13.8", default-features = false }
sailry-speech = { path = "crates/speech" }
# The pinned release exposes owned provider construction through this feature.
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXError", "AXAttributeConstants", "AXRoleConstants", "AXActionConstants", "AXValue"] }
objc2-core-graphics = { version = "=0.3.2", features = ["CGWindow"] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3", "common-controls-v6"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0", features = ["tree-sitter-languages"] }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0" }
gpui-component-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0" }
gpui-wry = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0" }
wry = { package = "lb-wry", version = "=0.53.3", features = ["transparent", "devtools"] }
rust-i18n = "=4.2.0"
sys-locale = "=0.3.2"
objc2 = "=0.6.4"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSRunLoop", "NSDate", "NSError", "NSString", "NSUUID", "NSHTTPCookie", "NSDictionary", "NSArray", "NSSet"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSVisualEffectView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKWebView", "WKSnapshotConfiguration", "WKHTTPCookieStore", "WKWebsiteDataRecord", "block2"] }
raw-window-handle = "=0.6.2"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "signal", "macros", "io-util"] }
tempfile = "=3.27.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
dirs = "=6.0.0"
thiserror = "=2.0.20"
libc = "=0.2.189"
sailry-node-runtime = { path = "crates/node-runtime" }
sailry-protocol = { path = "crates/protocol" }
sailry-link = { path = "crates/link" }
sailry-client = { path = "crates/client" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
# Keep the Node VM on its exact published source, separate from Kit's JIT facade.
rquickjs = { version = "=0.12.2", git = "https://github.com/DelSkayn/rquickjs.git", rev = "635f9322ccc875e3f9851e7f75ec538cf3274fd5", features = ["loader"] }
roxmltree = "=0.21.1"
schemars = "=1.2.2"
umya-spreadsheet = "=3.1.0"
lopdf = { version = "=0.45.0", default-features = false }
office2pdf = "=0.7.0"
base64 = "=0.22.1"
jsonschema = { version = "=0.47.0", default-features = false }
serde-saphyr = { version = "=0.0.29", default-features = false, features = ["deserialize"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio-util = { version = "=0.7.19", features = ["rt", "codec"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
self_update = { version = "=1.3.0", default-features = false, features = ["async", "rustls", "manifest", "checksums", "signatures", "archive-zip", "compression-zip-deflate"] }
ed25519-dalek = "=3.0.0"
semver = "=1.0.28"
zipsign-api = { version = "=0.2.1", default-features = false }
# Reuse the locked HTTP stack for bounded, opt-in model acceptance fixtures.
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.5"
eventsource-stream = "=0.2.3"
zeroize = { version = "=1.9.0", features = ["derive"] }
blake3 = "=1.8.7"
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
pbkdf2 = "=0.12.2"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
security-framework = "=3.7.0"
block2 = "=0.6.2"
mime_guess = "=2.0.5"
file-format = { version = "=0.29.0", default-features = false, features = ["reader-ebml", "reader-id3v2", "reader-mp4"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk", "network"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc"] }
flutter_rust_bridge = "=2.13.0"
jni = { version = "=0.22.4", default-features = false }
rustls-platform-verifier = "=0.7.0"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
cap-tempfile = "=4.0.3"
trash = "=5.2.6"
regex = "=1.13.1"
pulldown-cmark = { version = "=0.13.4", default-features = false }
unicode-segmentation = "=1.13.3"
russh-sftp = "=3.0.0"
russh = { version = "=0.62.4", default-features = false, features = ["flate2", "ring", "rsa"] }
mysql_async = { version = "=0.36.2", default-features = false, features = ["minimal-rust", "rustls-tls", "tls12", "ring"] }
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "=0.8.4"
webpki-roots = "=1.0.9"
notify = "=8.2.0"
globset = "=0.4.20"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https", "ssh"] }
portable-pty = "=0.9.0"
vte = { version = "=0.15.0", default-features = false }
which = "=8.0.6"
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "6111c4d72f11f0a1894cf3c5943b9ee25a6d0c61", default-features = false, features = ["kitty-graphics"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
adk-browser = { git = "https://github.com/dux-web/adk-rust.git", rev = "b3e360bbf49ca39d49cccba182c0f7cb4d251970", default-features = false }
adk-eval = { git = "https://github.com/dux-web/adk-rust.git", rev = "b3e360bbf49ca39d49cccba182c0f7cb4d251970", default-features = false }
cpal = "=0.18.2"
adk-core = { git = "https://github.com/dux-web/adk-rust.git", rev = "b3e360bbf49ca39d49cccba182c0f7cb4d251970", default-features = false }
adk-session = { git = "https://github.com/dux-web/adk-rust.git", rev = "b3e360bbf49ca39d49cccba182c0f7cb4d251970", default-features = false }
adk-runner = { git = "https://github.com/dux-web/adk-rust.git", rev = "b3e360bbf49ca39d49cccba182c0f7cb4d251970", default-features = false }
adk-agent = { git = "https://github.com/dux-web/adk-rust.git", rev = "b3e360bbf49ca39d49cccba182c0f7cb4d251970", default-features = false }
adk-model = { git = "https://github.com/dux-web/adk-rust.git", rev = "b3e360bbf49ca39d49cccba182c0f7cb4d251970", default-features = false, features = ["openai", "anthropic", "gemini", "deepseek", "opencode", "bedrock", "azure-ai", "gemini-vertex"] }
adk-tool = { git = "https://github.com/dux-web/adk-rust.git", rev = "b3e360bbf49ca39d49cccba182c0f7cb4d251970", default-features = false, features = ["mcp"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["auth", "client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
async-trait = "=0.1.92"
aws-smithy-eventstream = "=0.61.2"
aws-smithy-types = "=1.6.3"
chrono = { version = "=0.4.45", features = ["serde"] }
futures = "=0.3.34"
url = "=2.5.8"

[patch."https://github.com/Uzaaft/libghostty-rs.git"]
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

[patch.crates-io]
rquickjs = { path = "vendor/rquickjs-compat" }
# Preserve approved materials on Kit 0.7.0's exact GPUI snapshot.
gpui-pre = { path = "vendor/gpui-renderer/gpui" }
gpui-pre-apple = { path = "vendor/gpui-renderer/apple" }
gpui-pre-wgpu = { path = "vendor/gpui-renderer/wgpu" }
gpui-pre-windows = { path = "vendor/gpui-renderer/windows" }
block = { path = "vendor/block" }
rmcp = { path = "vendor/rmcp" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }

# Reduce debug binary size and keep Apple compact unwind offsets encodable.
[profile.dev]
opt-level = 1
debug = "limited"
split-debuginfo = "unpacked"

# Keep text geometry and layout hot paths optimized during desktop development.
[profile.dev.package]
gpui-base = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
taffy = { opt-level = 3 }

[patch."https://github.com/dux-web/adk-rust.git"]
# Preserve streaming for Responses native tools in the pinned ADK revision.
adk-model = { path = "vendor/adk-model" }
