<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Plugins</title>
  <desc id="desc">One agent-plugins package adds skills, MCP servers, tools and model providers to the agent through the Node, and JavaScript pages that Desktop renders with native GPUI Kit components.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker>
    <marker id="link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D8BEF"/></marker>
  </defs>
  <rect width="1200" height="380" rx="28" fill="#0F1217"/>
  <text x="60" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA4B2" text-anchor="start" letter-spacing="2">PLUGIN PACKAGE</text>
  <text x="470" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA4B2" text-anchor="start" letter-spacing="2">SAILRY</text>
  <text x="900" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA4B2" text-anchor="start" letter-spacing="2">RESULT</text>
  <rect x="60" y="96" width="300" height="248" rx="14" fill="#161B22" stroke="#262D38" stroke-width="1.5"/>
  <text x="84" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">One package</text>
  <text x="84" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">agent-plugins format</text>
  <circle cx="90" cy="189" r="3.5" fill="#79C9F1"/>
  <text x="104" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">SKILL.md skills</text>
  <circle cx="90" cy="219" r="3.5" fill="#79C9F1"/>
  <text x="104" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">MCP servers &amp; tools</text>
  <circle cx="90" cy="249" r="3.5" fill="#79C9F1"/>
  <text x="104" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">Model providers</text>
  <circle cx="90" cy="279" r="3.5" fill="#79C9F1"/>
  <text x="104" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">JavaScript pages</text>
  <circle cx="90" cy="309" r="3.5" fill="#79C9F1"/>
  <text x="104" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">Settings</text>
  <rect x="470" y="96" width="340" height="104" rx="14" fill="#161B22" stroke="#262D38" stroke-width="1.5"/>
  <text x="494" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">Host</text>
  <text x="494" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">loads skills, MCP, tools</text>
  <text x="494" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">and providers for the agent</text>
  <rect x="470" y="240" width="340" height="104" rx="14" fill="#161B22" stroke="#3D8BEF" stroke-width="1.5"/>
  <text x="494" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">Desktop</text>
  <text x="494" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">renders JavaScript UI with</text>
  <text x="494" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">native GPUI Kit components</text>
  <polyline points="360,180 470,148" fill="none" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="360,260 470,292" fill="none" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="96" width="240" height="104" rx="14" fill="#161B22" stroke="#262D38" stroke-width="1.5"/>
  <text x="924" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">Agent</text>
  <text x="924" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">new tools and models</text>
  <rect x="900" y="240" width="240" height="104" rx="14" fill="#161B22" stroke="#262D38" stroke-width="1.5"/>
  <text x="924" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">Your screen</text>
  <text x="924" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">native look and speed</text>
  <polyline points="810,148 900,148" fill="none" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="810,292 900,292" fill="none" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
