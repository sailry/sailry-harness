<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">插件</title>
  <desc id="desc">一个 agent-plugins 插件包通过 Node 给智能体加上技能、MCP 服务、工具和模型服务商，它的 JavaScript 页面由桌面端用原生 GPUI Kit 组件渲染。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker>
    <marker id="link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3D8BEF"/></marker>
  </defs>
  <rect width="1200" height="380" rx="28" fill="#0F1217"/>
  <text x="60" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA4B2" text-anchor="start" letter-spacing="2">插件包</text>
  <text x="470" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA4B2" text-anchor="start" letter-spacing="2">SAILRY</text>
  <text x="900" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9AA4B2" text-anchor="start" letter-spacing="2">效果</text>
  <rect x="60" y="96" width="300" height="248" rx="14" fill="#161B22" stroke="#262D38" stroke-width="1.5"/>
  <text x="84" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">一个插件包</text>
  <text x="84" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">agent-plugins 格式</text>
  <circle cx="90" cy="189" r="3.5" fill="#79C9F1"/>
  <text x="104" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">SKILL.md 技能</text>
  <circle cx="90" cy="219" r="3.5" fill="#79C9F1"/>
  <text x="104" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">MCP 服务和工具</text>
  <circle cx="90" cy="249" r="3.5" fill="#79C9F1"/>
  <text x="104" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">模型服务商</text>
  <circle cx="90" cy="279" r="3.5" fill="#79C9F1"/>
  <text x="104" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">JavaScript 页面</text>
  <circle cx="90" cy="309" r="3.5" fill="#79C9F1"/>
  <text x="104" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" fill="#F2F5F9" text-anchor="start">设置</text>
  <rect x="470" y="96" width="340" height="104" rx="14" fill="#161B22" stroke="#262D38" stroke-width="1.5"/>
  <text x="494" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">Host</text>
  <text x="494" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">加载技能、MCP、工具</text>
  <text x="494" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">和模型服务商给智能体</text>
  <rect x="470" y="240" width="340" height="104" rx="14" fill="#161B22" stroke="#3D8BEF" stroke-width="1.5"/>
  <text x="494" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">桌面端</text>
  <text x="494" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">用原生 GPUI Kit 组件</text>
  <text x="494" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">渲染 JavaScript 界面</text>
  <polyline points="360,180 470,148" fill="none" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="360,260 470,292" fill="none" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="96" width="240" height="104" rx="14" fill="#161B22" stroke="#262D38" stroke-width="1.5"/>
  <text x="924" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">智能体</text>
  <text x="924" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">多了新工具和新模型</text>
  <rect x="900" y="240" width="240" height="104" rx="14" fill="#161B22" stroke="#262D38" stroke-width="1.5"/>
  <text x="924" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#F2F5F9" text-anchor="start" font-weight="600">你的屏幕</text>
  <text x="924" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#9AA4B2" text-anchor="start">原生的观感和速度</text>
  <polyline points="810,148 900,148" fill="none" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="810,292 900,292" fill="none" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
