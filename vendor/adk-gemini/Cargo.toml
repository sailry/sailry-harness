# Source: https://github.com/dux-web/adk-rust/tree/ae14f6410e742ff84a73a7b0033a1cb77679b762/adk-gemini
# Local patch: use the application-provided Rustls crypto provider.
# Resolve inherited workspace fields; vendored targets contain the library only.

[package]
edition = "2024"
name = "adk-gemini"
version = "2.2.0"
rust-version = "1.95"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust client for Google Gemini API"
documentation = "https://docs.rs/adk-gemini"
readme = "README.md"
keywords = [
    "gemini",
    "embed",
    "google",
    "ai",
    "client",
]
categories = ["api-bindings"]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-rust"

[features]
default = ["studio"]
studio = []
interactions = []
vertex = ["dep:google-cloud-aiplatform-v1", "dep:google-cloud-auth", "dep:google-cloud-gax"]
backtrace = ["snafu/backtraces-impl-backtrace-crate"]

[lib]
name = "adk_gemini"
path = "src/lib.rs"

[dependencies.adk-core]
version = "2.2.0"
git = "https://github.com/dux-web/adk-rust.git"
rev = "ae14f6410e742ff84a73a7b0033a1cb77679b762"

[dependencies.async-stream]
version = "0.3"

[dependencies.async-trait]
version = "^0.1"

[dependencies.base64]
version = "0.22"

[dependencies.eventsource-stream]
version = "0.2"

[dependencies.futures]
version = "^0.3.1"

[dependencies.futures-util]
version = "^0.3"

[dependencies.google-cloud-aiplatform-v1]
version = "1.9.0"
features = ["prediction-service"]
default-features = false
optional = true

[dependencies.google-cloud-auth]
version = "1.8.0"
default-features = false
optional = true

[dependencies.google-cloud-gax]
version = "1.9.0"
default-features = false
optional = true

[dependencies.mime]
version = "0.3"

[dependencies.mime_guess]
version = "2.0"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "charset",
    "h2",
    "http2",
    "json",
    "stream",
    "rustls-tls-webpki-roots-no-provider",
    "rustls-tls-native-roots-no-provider",
    "multipart",
]

[dependencies.schemars]
version = "1.0"

[dependencies.serde]
version = "^1.0"
features = ["derive"]

[dependencies.serde_json]
version = "^1.0"

[dependencies.snafu]
version = "0.8"
default-features = false
features = ["std", "rust_1_65"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.strum_macros]
version = "0.28"

[dependencies.time]
version = "0.3"
features = [
    "serde",
    "parsing",
    "formatting",
]

[dependencies.tokio]
version = "1"
features = ["io-util", "rt-multi-thread", "sync"]

[dependencies.tracing]
version = "0.1.41"

[dependencies.url]
version = "^2.4"
features = ["serde"]

[dev-dependencies.display-error-chain]
version = "0.2"

[dev-dependencies.futures]
version = "^0.3.1"

[dev-dependencies.proptest]
version = "1"

[dev-dependencies.tokio]
version = "^1.47"
features = ["full"]

[dev-dependencies.tracing-subscriber]
version = "0.3.20"
features = ["env-filter"]

[dev-dependencies.wiremock]
version = "0.6"
