# Source: https://github.com/dux-web/adk-rust/tree/b3e360bbf49ca39d49cccba182c0f7cb4d251970/adk-model
# Local patch: retain Responses streaming with native tools, expose stream activity,
# and preserve optional function parameters with explicit non-strict declarations.

[package]
"name" = "adk-model"
"version" = "2.2.0"
"edition" = "2024"
"rust-version" = "1.95"
"license" = "Apache-2.0"
"authors" = ["James Karanja Maina <james.karanja@zavora.ai>"]
"description" = "LLM model integrations for Rust Agent Development Kit (ADK-Rust) (Gemini, OpenAI, Claude, DeepSeek, etc.)"
"repository" = "https://github.com/zavora-ai/adk-rust"
"documentation" = "https://docs.rs/adk-model"
"keywords" = ["ai", "agent", "adk", "gemini", "llm"]
"categories" = ["api-bindings", "asynchronous"]
"readme" = "README.md"

[dependencies]
"adk-core" = { "version" = "2.2.0", "git" = "https://github.com/dux-web/adk-rust.git", "rev" = "b3e360bbf49ca39d49cccba182c0f7cb4d251970" }
"adk-telemetry" = { "version" = "2.2.0", "git" = "https://github.com/dux-web/adk-rust.git", "rev" = "b3e360bbf49ca39d49cccba182c0f7cb4d251970" }
"adk-gemini" = { "version" = "2.2.0", "optional" = true, "git" = "https://github.com/dux-web/adk-rust.git", "rev" = "b3e360bbf49ca39d49cccba182c0f7cb4d251970" }
"async-trait" = { "version" = "0.1" }
"tokio" = { "version" = "1.40", "default-features" = false, "features" = ["sync", "time"] }
"futures" = { "version" = "0.3" }
"async-stream" = { "version" = "0.3" }
"serde_json" = { "version" = "1.0" }
"serde" = { "version" = "1.0", "features" = ["derive"] }
"async-openai" = { "version" = "0.41", "optional" = true, "default-features" = false, "features" = ["rustls", "chat-completion", "responses", "middleware"] }
"adk-anthropic" = { "version" = "2.2.0", "optional" = true, "git" = "https://github.com/dux-web/adk-rust.git", "rev" = "b3e360bbf49ca39d49cccba182c0f7cb4d251970" }
"reqwest" = { "version" = "0.12", "default-features" = false, "features" = ["json", "stream", "rustls-tls-native-roots", "multipart"], "optional" = true }
"reqwest-openai" = { "package" = "reqwest", "version" = "0.13", "optional" = true, "default-features" = false, "features" = ["rustls", "stream"] }
"http" = { "version" = "1", "optional" = true }
"tower" = { "version" = "0.5", "optional" = true, "features" = ["util"] }
"tokio-tungstenite" = { "version" = "0.28", "features" = ["rustls-tls-native-roots", "connect"], "optional" = true }
"anyhow" = { "version" = "1.0" }
"tracing" = { "version" = "0.1" }
"chrono" = { "version" = "0.4.44", "features" = ["serde"] }
"base64" = "0.22"
"ollama-rs" = { "version" = "0.3.4", "optional" = true, "default-features" = false, "features" = ["stream"] }
"schemars" = { "version" = "1.0", "optional" = true }
"aws-sdk-bedrockruntime" = { "version" = "1.128", "optional" = true, "default-features" = false, "features" = ["default-https-client", "rt-tokio"] }
"aws-config" = { "version" = "1", "optional" = true, "features" = ["behavior-version-latest"] }
"aws-smithy-types" = { "version" = "1.4.7", "optional" = true }

[features]
"default" = ["gemini"]
"gemini" = ["dep:adk-gemini"]
"gemini-vertex" = ["gemini", "adk-gemini/vertex"]
"gemini-interactions" = ["gemini", "adk-gemini/interactions"]
"openai" = ["dep:async-openai", "dep:reqwest", "dep:reqwest-openai", "dep:http", "dep:tower"]
"openai-ws" = ["openai", "dep:tokio-tungstenite"]
"openai-conversations" = ["openai"]
"openai-responses-full" = ["openai-ws", "openai-conversations"]
"xai" = ["openai"]
"anthropic" = ["dep:adk-anthropic", "dep:http"]
"opencode" = ["openai", "anthropic", "gemini"]
"deepseek" = ["dep:reqwest"]
"ollama" = ["dep:ollama-rs", "dep:schemars"]
"groq" = ["dep:reqwest"]
"openrouter" = ["dep:reqwest"]
"fireworks" = ["openai"]
"together" = ["openai"]
"mistral" = ["openai"]
"perplexity" = ["openai"]
"cerebras" = ["openai"]
"sambanova" = ["openai"]
"bedrock" = ["dep:aws-sdk-bedrockruntime", "dep:aws-config", "dep:aws-smithy-types"]
"azure-ai" = ["dep:reqwest"]
"all-providers" = ["gemini", "openai", "anthropic", "deepseek", "ollama", "groq", "openrouter", "opencode", "bedrock", "azure-ai"]

[dev-dependencies]
"proptest" = "1.5"
"tokio" = { "version" = "1.40", "default-features" = false, "features" = ["rt", "macros"] }
"tracing-subscriber" = { "version" = "0.3", "features" = ["fmt", "env-filter"] }
"futures" = "0.3"
"wiremock" = "0.6"
"dotenvy" = "0.15"

[[example]]
"name" = "openrouter_chat"
"required-features" = ["openrouter"]

[[example]]
"name" = "openrouter_adapter"
"required-features" = ["openrouter"]

[[example]]
"name" = "openrouter_discovery"
"required-features" = ["openrouter"]

[[example]]
"name" = "openrouter_responses"
"required-features" = ["openrouter"]

[[example]]
"name" = "gemini_thinking"
"required-features" = ["gemini"]

[[example]]
"name" = "gemini_openai_compat"
"required-features" = ["openai"]

[[test]]
"name" = "openai_schema_property_tests"
"required-features" = ["openai"]
