[package]
name = "adk-model"
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
homepage = "https://www.zavora.ai"
description = "LLM model integrations for Rust Agent Development Kit (ADK-Rust) (Gemini, OpenAI, Claude, DeepSeek, etc.)"
repository = "https://github.com/zavora-ai/adk-rust"
documentation = "https://docs.rs/adk-model"
keywords = ["ai", "agent", "adk", "gemini", "llm"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

# Keep focused upstream tests independent of application workspace members.
[workspace]
resolver = "3"

[profile.dev]
opt-level = "z"
debug = "limited"
split-debuginfo = "unpacked"

[package.metadata.docs.rs]
features = ["all-providers", "gemini-vertex", "gemini-interactions", "openai-responses-full"]

[dependencies]
adk-core = { git = "https://github.com/dux-web/adk-rust.git", rev = "e15668344ecaf4a3579ca9978b3c7bb35434ef0d" }
adk-telemetry = { git = "https://github.com/dux-web/adk-rust.git", rev = "e15668344ecaf4a3579ca9978b3c7bb35434ef0d" }
adk-gemini = { git = "https://github.com/dux-web/adk-rust.git", rev = "e15668344ecaf4a3579ca9978b3c7bb35434ef0d", optional = true }
async-trait = "0.1"
tokio = { version = "1.40", default-features = false, features = ["sync", "time"] }
futures = "0.3"
async-stream = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
async-openai = { version = "0.41", optional = true, default-features = false, features = ["rustls", "chat-completion", "responses", "middleware", "byot"] }
adk-anthropic = { git = "https://github.com/dux-web/adk-rust.git", rev = "e15668344ecaf4a3579ca9978b3c7bb35434ef0d", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "multipart"], optional = true }
reqwest-openai = { package = "reqwest", version = "0.13", optional = true, default-features = false, features = ["rustls", "stream"] }
http = { version = "1", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots", "connect"], optional = true }
anyhow = "1.0"
tracing = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
httpdate = "1"
base64 = "0.22"
ollama-rs = { version = "0.3.4", optional = true, default-features = false, features = ["stream"] }
schemars = { version = "1.0", optional = true }
aws-sdk-bedrockruntime = { version = "1.128", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "1", optional = true, features = ["behavior-version-latest"] }
aws-smithy-types = { version = "1.4.7", optional = true }

[features]
default = ["gemini"]
gemini = ["dep:adk-gemini", "dep:reqwest"]
gemini-vertex = ["gemini", "adk-gemini/vertex"]
gemini-interactions = ["gemini", "adk-gemini/interactions"]
openai = ["dep:async-openai", "dep:reqwest", "dep:reqwest-openai", "dep:http", "dep:tower", "tokio/rt"]
openai-ws = ["openai", "dep:tokio-tungstenite"]
openai-conversations = ["openai"]
# openai-webhooks feature removed: it only forwarded a dep on adk-server, creating the
# cycle adk-model -> adk-server -> adk-agent -> (dev) adk-model. The webhooks
# implementation lives in adk-server (`openai-webhooks` feature, src/webhooks/) — use
# adk-server directly for webhook verification/handling.
openai-responses-full = ["openai-ws", "openai-conversations"]
xai = ["openai"]
anthropic = ["dep:adk-anthropic"]
opencode = ["openai", "anthropic", "gemini"]
deepseek = ["dep:reqwest"]
ollama = ["dep:ollama-rs", "dep:schemars", "dep:reqwest"]
groq = ["dep:reqwest"]
openrouter = ["dep:reqwest"]
fireworks = ["openai"]
together = ["openai"]
mistral = ["openai"]
perplexity = ["openai"]
cerebras = ["openai"]
sambanova = ["openai"]
bedrock = ["dep:aws-sdk-bedrockruntime", "dep:aws-config", "dep:aws-smithy-types"]
azure-ai = ["dep:reqwest"]
all-providers = ["gemini", "openai", "anthropic", "deepseek", "ollama", "groq", "openrouter", "opencode", "bedrock", "azure-ai"]

[dev-dependencies]
proptest = "1.5"
tokio = { version = "1.40", default-features = false, features = ["rt", "macros", "net", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures = "0.3"
wiremock = "0.6"
dotenvy = "0.15"
google-cloud-gax = { version = "1.9.0", default-features = false }

# Examples require the openrouter feature — skip when not enabled.
[[example]]
name = "openrouter_chat"
required-features = ["openrouter"]

[[example]]
name = "openrouter_adapter"
required-features = ["openrouter"]

[[example]]
name = "openrouter_discovery"
required-features = ["openrouter"]

[[example]]
name = "openrouter_responses"
required-features = ["openrouter"]

[[example]]
name = "gemini_thinking"
required-features = ["gemini"]

[[example]]
name = "gemini_openai_compat"
required-features = ["openai"]

[[test]]
name = "openai_schema_property_tests"
required-features = ["openai"]
