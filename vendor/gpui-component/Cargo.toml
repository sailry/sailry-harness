[package]
description = "GPUI Component: the styled component library of GPUI Kit, with 60+ desktop UI components for GPUI."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
name = "gpui-component"
documentation = "https://docs.rs/gpui-component"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
version = "0.7.1"
publish = true
edition = "2024"

[lib]
doctest = false

[features]
gpui-fast = ["dep:gpui-fast", "gpui-base/gpui-fast", "gpui-kit-assets/gpui-fast"]
test-support = ["gpui/test-support", "gpui-base/test-support", "gpui-fast?/test-support"]
decimal = ["gpui-base/decimal"]
inspector = ["gpui_macros/inspector", "gpui/inspector", "gpui-base/inspector", "gpui-fast?/inspector"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-json"]
# Speech input: microphone capture and the system speech recognizer.
speech = [
    "dep:cpal",
    "dep:block2",
    "dep:objc2-speech",
    "dep:objc2-avf-audio",
    "dep:objc2-av-foundation",
    "objc2-foundation/NSBundle",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSError",
    "objc2-foundation/NSLocale",
    "windows/Foundation_Collections",
    "windows/Globalization",
    "windows/Media_SpeechRecognition",
]

# For syntax highlighting in Markdown and CodeEditor.
tree-sitter-languages = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
]
tree-sitter-astro = ["tree-sitter", "dep:tree-sitter-astro-next"]
tree-sitter-bash = ["tree-sitter", "dep:tree-sitter-bash"]
tree-sitter-c = ["tree-sitter", "dep:tree-sitter-c"]
tree-sitter-cmake = ["tree-sitter", "dep:tree-sitter-cmake"]
tree-sitter-cpp = ["tree-sitter", "dep:tree-sitter-cpp"]
tree-sitter-csharp = ["tree-sitter", "dep:tree-sitter-c-sharp"]
tree-sitter-css = ["tree-sitter", "dep:tree-sitter-css"]
tree-sitter-diff = ["tree-sitter", "dep:tree-sitter-diff"]
tree-sitter-ejs = ["tree-sitter", "dep:tree-sitter-embedded-template"]
tree-sitter-elixir = ["tree-sitter", "dep:tree-sitter-elixir"]
tree-sitter-erb = ["tree-sitter", "dep:tree-sitter-embedded-template"]
tree-sitter-go = ["tree-sitter", "dep:tree-sitter-go"]
tree-sitter-graphql = ["tree-sitter", "dep:tree-sitter-graphql"]
tree-sitter-html = ["tree-sitter", "dep:tree-sitter-html"]
tree-sitter-java = ["tree-sitter", "dep:tree-sitter-java"]
tree-sitter-javascript = ["tree-sitter", "dep:tree-sitter-javascript"]
tree-sitter-jsdoc = ["tree-sitter", "dep:tree-sitter-jsdoc"]
tree-sitter-kotlin = ["tree-sitter", "dep:tree-sitter-kotlin-sg"]
tree-sitter-lua = ["tree-sitter", "dep:tree-sitter-lua"]
tree-sitter-make = ["tree-sitter", "dep:tree-sitter-make"]
tree-sitter-markdown = ["tree-sitter", "dep:tree-sitter-md"]
tree-sitter-markdown-inline = ["tree-sitter-markdown"]
tree-sitter-php = ["tree-sitter", "dep:tree-sitter-php"]
tree-sitter-proto = ["tree-sitter", "dep:tree-sitter-proto"]
tree-sitter-python = ["tree-sitter", "dep:tree-sitter-python"]
tree-sitter-ruby = ["tree-sitter", "dep:tree-sitter-ruby"]
tree-sitter-rust = ["tree-sitter", "dep:tree-sitter-rust"]
tree-sitter-scala = ["tree-sitter", "dep:tree-sitter-scala"]
tree-sitter-sql = ["tree-sitter", "dep:tree-sitter-sequel"]
tree-sitter-svelte = ["tree-sitter", "dep:tree-sitter-svelte-next"]
tree-sitter-swift = ["tree-sitter", "dep:tree-sitter-swift"]
tree-sitter-toml = ["tree-sitter", "dep:tree-sitter-toml-ng"]
tree-sitter-tsx = ["tree-sitter", "dep:tree-sitter-typescript"]
tree-sitter-typescript = ["tree-sitter", "dep:tree-sitter-typescript"]
tree-sitter-yaml = ["tree-sitter", "dep:tree-sitter-yaml"]
tree-sitter-zig = ["tree-sitter", "dep:tree-sitter-zig"]

[dependencies]
unicode-width = "0.2"
unicode-segmentation = "1"
similar = { version = "2.7", features = ["unicode"] }
regex = "1"
anyhow = { version = "1" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-fast = { package = "gpui-fast", version = "=0.1.6", features = ["windows-manifest-provided-by-host"], optional = true }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.8" }
gpui-base = { version = "0.7.1", path = "../gpui-base" }
gpui-component-macros = { git = "https://github.com/longbridge/gpui-kit", rev = "1ccf011620da24d633f7cd6d3c11ca2e97798dcf" }
gpui-kit-assets = { version = "0.7.1", path = "../gpui-kit/assets" }
notify = { version = "8.2.0" }
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
rust-i18n = { version = "4.2.0" }
schemars = { version = "1" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1" }
serde_repr = { version = "0.1" }
smallvec = { version = "1" }
sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.8" }
tracing = { version = "0.1.41" }
log = { version = "0.4" }
markdown = { version = "1.0.0", features = ["serde"] }

enum-iterator = "2.1.0"
itertools = "0.13.0"
once_cell = "1.19.0"
paste = "1"
uuid = "1.10"

# Chart
num-traits = "0.2"

# Calendar
chrono = "0.4.38"

# Code Editor
lsp-types = { version = "0.97.0", features = ["proposed"] }

# Cross-platform time APIs (zero-cost on native, uses web APIs on WASM)
instant = { version = "0.1", features = ["wasm-bindgen"] }

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = { version = "2" }
cpal = { version = "0.15.3", optional = true }
tree-sitter = { version = "0.26.13", optional = true }
tree-sitter-astro-next = { version="0.1.1", optional = true }
tree-sitter-bash = { version = "0.23.3", optional = true }
tree-sitter-c = { version = "0.24.1", optional = true }
tree-sitter-c-sharp = { version = "0.23.1", optional = true }
tree-sitter-cmake = { version = "0.7.1", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-css = { version = "0.23.2", optional = true }
tree-sitter-diff = { version = "0.1.0", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-embedded-template = { version = "0.23.0", optional = true }
tree-sitter-go = { version = "0.23.4", optional = true }
tree-sitter-graphql = { version = "0.1.0", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.23.1", optional = true }
tree-sitter-jsdoc = { version = "0.23.2", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-kotlin-sg = { version = "0.4.0", optional = true }
tree-sitter-lua = { version = "0.4.1", optional = true }
tree-sitter-make = { version = "1.1.1", optional = true }
tree-sitter-md = { version = "0.5.1", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-proto = { version = "0.2.0", optional = true }
tree-sitter-python = { version = "0.23.6", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust = { version = "0.24.0", optional = true }
tree-sitter-scala = { version = "0.23.4", optional = true }
tree-sitter-sequel = { version = "0.3.8", optional = true }
tree-sitter-svelte-next = { version = "0.1.1", optional = true }
tree-sitter-swift = { version = "0.7.0", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-yaml = { version = "0.7.1", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
# Native menu (NativeMenu) — drives AppKit NSMenu via objc2.
raw-window-handle = { version = "0.6.2" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSMenu",
    "NSMenuItem",
    "NSView",
    "NSWindow",
    "NSResponder",
    "NSEvent",
    "NSImage",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }
# Speech input (SystemRecognizer) — SFSpeechRecognizer via objc2.
block2 = { version = "0.6", optional = true }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVMediaFormat",
], optional = true }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioBuffer",
    "AVAudioFormat",
    "AVAudioTypes",
], optional = true }
objc2-speech = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-avf-audio",
    "SFSpeechRecognitionMetadata",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFSpeechRecognizer",
    "SFTranscription",
], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Native menu (NativeMenu) — drives Win32 popup menus.
raw-window-handle = { version = "0.6.2" }
resvg = "0.45.1"
windows = { features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"], version = "0.58.0" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui-fast = { package = "gpui-fast", version = "=0.1.6", features = ["windows-manifest-provided-by-host", "test-support"] }
indoc = "2"

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[package.metadata.cargo-machete]
ignored = ["gpui_macros"]

[workspace]
