[package]
name = "gpui-component-shell"
description = "gpui-component bindings for the gpui-shell runtime."
version = "0.7.0"
publish = false
edition = "2024"

[lib]
name = "gpui_component_shell"
path = "src/lib.rs"

[dependencies]
gpui-shell = { version = "0.7.0", path = "../shell" }
gpui-component = { version = "0.7.0", features = ["tree-sitter-rust"], path = "../../gpui-component" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui-base = { version = "0.7.0", features = ["test-support"], path = "../../gpui-base" }
gpui-component = { version = "0.7.0", features = ["test-support"], path = "../../gpui-component" }
serde_json = { version = "1" }

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[workspace]
