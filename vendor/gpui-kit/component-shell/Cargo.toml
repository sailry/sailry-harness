[package]
name = "gpui-component-shell"
description = "gpui-component bindings for the gpui-shell runtime."
version = "0.7.1"
publish = false
edition = "2024"

[lib]
name = "gpui_component_shell"
path = "src/lib.rs"

[dependencies]
gpui-shell = { version = "0.7.1", path = "../shell" }
gpui-component = { version = "0.7.1", path = "../../gpui-component", features = ["tree-sitter-rust"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui-fast = { package = "gpui-fast", version = "=0.1.6", features = ["windows-manifest-provided-by-host", "test-support"] }
gpui-base = { version = "0.7.1", path = "../../gpui-base", features = ["test-support"] }
gpui-component = { version = "0.7.1", path = "../../gpui-component", features = ["test-support"] }
serde_json = { version = "1" }

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[features]
gpui-fast = ["gpui-shell/gpui-fast", "gpui-component/gpui-fast", "gpui-base/gpui-fast"]

[workspace]
