[package]
name = "sailry-iroh"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "sailry_iroh"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "relay-fixture"
path = "src/bin/relay-fixture.rs"
required-features = ["relay-fixture"]

[features]
relay-fixture = ["dep:iroh-relay"]

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring", "server", "test-utils"], optional = true }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
futures-util = "=0.3.34"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
rustls-platform-verifier = "=0.7.0"
