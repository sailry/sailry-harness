tracing-log.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rolling-file.workspace = true
age.workspace = true
opendal.workspace = true
russh.workspace = true
russh-sftp.workspace = true
sqlx.workspace = true
libsqlite3-sys.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
thiserror.workspace = true
dirs.workspace = true
sailry-protocol.workspace = true
ammonia.workspace = true
html5ever.workspace = true
sailry-embedding.workspace = true
sailry-decision.workspace = true
sailry-ocr.workspace = true
hayro.workspace = true
sailry-model-assets.workspace = true
sha1.workspace = true
sailry-link.workspace = true
turso.workspace = true
tree-sitter.workspace = true
tree-sitter-language-pack.workspace = true
unicode-normalization.workspace = true
serde.workspace = true
