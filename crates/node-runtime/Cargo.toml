[package]
name = "sailry-node-runtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

# The library has no documentation examples; skip the empty rustdoc pass.
[lib]
doctest = false

[[test]]
name = "agent"
path = "tests/agent.rs"

[[test]]
name = "logging"
path = "tests/logging.rs"

[[test]]
name = "logging_logger"
path = "tests/logging/logger.rs"

[[test]]
name = "databases"
path = "tests/databases.rs"

[[test]]
name = "files"
path = "tests/suites/files.rs"

[[test]]
name = "repositories"
path = "tests/suites/repositories.rs"

[[test]]
name = "connections"
path = "tests/suites/connections.rs"

[[test]]
name = "configuration"
path = "tests/suites/configuration.rs"

[[test]]
name = "extensions"
path = "tests/suites/extensions.rs"

[[test]]
name = "resources"
path = "tests/suites/resources.rs"

[[test]]
name = "knowledge"
path = "tests/suites/knowledge.rs"

[[test]]
name = "code_index"
path = "tests/code_index.rs"

[features]
test-support = ["sailry-link/test-support"]

[[example]]
name = "plugin-test-host"
path = "examples/plugin-test-host.rs"
required-features = ["test-support"]

[dependencies]
anyhow.workspace = true
