[package]
name = "sailry-link"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

# The library has no documentation examples; skip the empty rustdoc pass.
[lib]
doctest = false

[[test]]
name = "transport"
path = "tests/transport.rs"

[features]
test-support = []

[dependencies]
sailry-protocol.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
iroh.workspace = true
serde_json.workspace = true
serde.workspace = true
reqwest.workspace = true
rustls.workspace = true
zeroize.workspace = true
tempfile.workspace = true
libc.workspace = true
tracing.workspace = true
semver.workspace = true
zstd.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
