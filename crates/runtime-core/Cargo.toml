[package]
name = "sailry-runtime-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

# The library has no documentation examples; skip the empty rustdoc pass.
[lib]
doctest = false

[dependencies]
blake3.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
cap-tempfile.workspace = true
dirs.workspace = true
encoding_rs.workspace = true
globset.workspace = true
git2.workspace = true
ignore.workspace = true
sailry-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
turso.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
trash.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemServices", "Win32_System_Threading"] }
windows.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
