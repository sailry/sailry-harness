[package]
name = "sailry-mobile-bridge"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
blake3.workspace = true
flutter_rust_bridge.workspace = true
sailry-client.workspace = true
sailry-link.workspace = true
sailry-protocol.workspace = true
sailry-speech.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
rustls-platform-verifier.workspace = true

[dev-dependencies]
mysql_async.workspace = true
russh.workspace = true
portable-pty.workspace = true
rusqlite.workspace = true
url.workspace = true
base64.workspace = true
sailry-node-runtime = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { workspace = true, features = ["NSFileManager", "NSPathUtilities", "NSURL"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
