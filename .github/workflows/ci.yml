name: CI

# Checks and build verification only; CI does not publish app packages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration:
        description: Run the integration-tagged tests
        type: boolean
        default: false
      integration_packages:
        description: Packages for the integration run; empty selects the default set
        type: string
        default: ''
      mobile_builds:
        description: Mobile package builds to verify
        type: choice
        default: 'none'
        options: ['none', 'android', 'ios', 'both']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.integration && 'manual-integration' || 'manual') || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  GOTOOLCHAIN: go1.27.3
  CGO_ENABLED: '0'

jobs:
  # Path selection must not wait for the compiler or cross-platform vet.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.scope.outputs.go }}
      native: ${{ steps.scope.outputs.native }}
      mobile: ${{ steps.scope.outputs.mobile }}
      android: ${{ steps.scope.outputs.android }}
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 2
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Changed inputs
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          MOBILE_BUILDS: ${{ inputs.mobile_builds }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            bash .github/scripts/ci-scope.sh "${MOBILE_BUILDS:-none}" >> "$GITHUB_OUTPUT"
            exit
          fi

          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$BEFORE
            if [ -n "$base" ] && [ "$base" != '0000000000000000000000000000000000000000' ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base" || true
            fi
          fi

          # Compare trees directly, including both paths of a rename.
          paths="$RUNNER_TEMP/ci-changed-paths"
          if [ -n "$base" ] && git diff --no-renames --name-only -z "$base" HEAD -- > "$paths"; then
            bash .github/scripts/ci-scope.sh < "$paths" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Could not determine changed paths; running checks without mobile package builds'
            bash .github/scripts/ci-scope.sh none >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: ubuntu-24.04
    env:
      GO_CACHE_ROLE: lint
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Test lane routing
        run: |
          bash .github/scripts/ci-scope_test.sh
          bash .github/scripts/test_test.sh
      - name: Test release workflow boundaries
        run: python3 -B .github/scripts/test_release_workflows.py
      - name: Test Sentry intake and repair routing
        run: |
          python3 -B .github/scripts/test_sentry_intake.py
          python3 -B .github/scripts/sentry_repair_test.py
          bash .github/scripts/sentry-draft_test.sh
      - uses: ./.github/actions/go-cache
        id: go-cache
      - name: Format
        run: |
          files=$(git ls-files --cached --others --exclude-standard -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$files" ]; then
            printf 'gofmt differs:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Architecture boundaries
        run: |
          set -euo pipefail
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          bad=$(go list -f '{{.ImportPath}} {{range .Imports}}{{.}} {{end}}' ./internal/... | awk '$1 != "github.com/sailry/sailry-harness/internal/desktop/testassembly" && $0 ~ /github\.com\/sailry\/sailry-harness\/sdk\// { print $1 }')
          if [ -n "$bad" ]; then
            printf 'internal packages must not import sdk packages:\n%s\n' "$bad" >&2
            exit 1
          fi
      # The integration tag adds files and removes none, so one pass per OS also
      # compiles the integration tests that no routine job runs. Run the three
      # OS passes concurrently, plus cgo vet for the mobile C ABI exports.
      - name: Vet
        run: |
          set -euo pipefail
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          pids=()
          for goos in linux windows darwin; do
            GOOS=$goos go vet -tags integration ./... &
            pids+=($!)
          done
          CGO_ENABLED=1 go vet ./cmd/sailry-mobile &
          pids+=($!)
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  test:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        lane: [linux-0, linux-1, linux-2, linux-3]
        include:
          - { os: windows-2025, lane: platform, target: windows-amd64 }
          - { os: macos-15, lane: platform, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      GO_CACHE_ROLE: test
    defaults:
      run:
        shell: bash
    steps:
      # Linux runs the complete suite. Native macOS and Windows builds run
      # their platform regressions; integration libraries are checked below.
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/go-cache
        id: go-cache
      - name: Linux command sandbox and UI fonts
        if: runner.os == 'Linux'
        # Fontconfig needs CJK glyphs for the Chinese UI's pixel assertions.
        run: bash .github/scripts/setup-linux-command-sandbox.sh fonts-noto-cjk
      - uses: ./.github/actions/turso
      - name: Test
        run: bash .github/scripts/test.sh '${{ matrix.lane }}'
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && (matrix.lane == 'linux-0' || matrix.lane == 'platform') }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  race:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: ubuntu-24.04
    env:
      GO_CACHE_ROLE: race
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/go-cache
        id: go-cache
      - uses: ./.github/actions/turso
      - name: Race detector
        run: |
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=1
          go test -race -p 2 -parallel 4 \
            ./internal/client ./internal/link ./internal/mobile ./internal/protocol/wire \
            ./internal/node/agent/engine ./internal/node/agent/model ./internal/node/agent/output \
            ./internal/node/mcp ./internal/node/process ./internal/node/web \
            ./internal/node/telemetry ./internal/node/fswatch ./internal/node/externalbrowser
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-amd64 }
          - { os: windows-2025, target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: capture
        with:
          path: |
            .runtime/native/${{ matrix.target }}/libsailry-capture.so
            .runtime/native/${{ matrix.target }}/libsailry-capture.dylib
            .runtime/native/${{ matrix.target }}/sailry-capture.dll
          key: native-capture-v2-${{ matrix.target }}-${{ hashFiles('native/capture/sailry_capture.c', 'native/capture/miniaudio.lock.json', 'native/capture/build.sh') }}
      - name: Build capture
        if: steps.capture.outputs.cache-hit != 'true'
        run: sh native/capture/build.sh
      - uses: ./.github/actions/turso
      - name: Windows C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/windows/crt.ps1
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.capture.outputs.cache-hit != 'true'
        with:
          path: |
            .runtime/native/${{ matrix.target }}/libsailry-capture.so
            .runtime/native/${{ matrix.target }}/libsailry-capture.dylib
            .runtime/native/${{ matrix.target }}/sailry-capture.dll
          key: ${{ steps.capture.outputs.cache-primary-key }}
      # The artifact is the directory `go run ./native/fetch -artifacts` reads:
      # the built libraries and their SHA256SUMS at its root.
      - name: Checksums
        working-directory: .runtime/native/${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              set -- turso_sync_sdk_kit.dll sailry-capture.dll windows-crt.json
              while IFS= read -r name; do set -- "$@" "$name"; done < <(jq -r '.files[]' windows-crt.json | tr -d '\r')
              ;;
            macOS) set -- libturso_sync_sdk_kit.dylib libsailry-capture.dylib ;;
            *) set -- libturso_sync_sdk_kit.so libsailry-capture.so ;;
          esac
          mkdir artifact
          for name in "$@"; do
            cp "$name" "artifact/$name"
            if command -v sha256sum >/dev/null; then
              sum=$(sha256sum "$name")
            else
              sum=$(shasum -a 256 "$name")
            fi
            printf '%s  %s\n' "${sum%% *}" "$name"
          done > artifact/SHA256SUMS
          cat artifact/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: .runtime/native/${{ matrix.target }}/artifact/
          # .runtime is a hidden directory.
          include-hidden-files: true
          if-no-files-found: error

  mobile:
    name: apps/mobile (Android)
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: ''
      GO_CACHE_ROLE: mobile-android
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/go-cache
        id: go-cache
        if: needs.scope.outputs.android == 'true'
        with:
          modules-scope: mobile
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/android
        if: needs.scope.outputs.android == 'true'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --concurrency=4
      - name: Build ARM64 release APK
        if: needs.scope.outputs.android == 'true'
        run: flutter build apk --release --no-pub --target-platform android-arm64
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-scope: mobile
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  mobile-ios:
    name: apps/mobile (iOS)
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-15
    env:
      CGO_ENABLED: ''
      GO_CACHE_ROLE: mobile-ios
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/go-cache
        id: go-cache
        with:
          modules-scope: mobile
      - uses: ./.github/actions/flutter
      - name: Xcode version
        run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-pub --no-codesign
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-scope: mobile
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  # Integration tests run only on manual request, with an optional package list.
  integration:
    needs: native
    if: inputs.integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64, process: './internal/node/process' }
          - { os: macos-15, target: darwin-arm64, process: './internal/node/process' }
          - { os: windows-2025, target: windows-amd64, process: '' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GO_CACHE_ROLE: test
      # The default set: packages whose integration tests build every fixture
      # themselves (temporary directories, loopback listeners, in-process
      # servers, the runner's Git and shell) and the capture library from this
      # run's native artifact. Left out because a runner does not provide what
      # they need:
      #   internal/node, internal/desktop/live, internal/localmodels/...,
      #   internal/speech: downloaded models and ONNX Runtime (SAILRY_* paths)
      #   internal/node/web: the public internet
      #   cmd/sailry-desktop: runs only beside a packaged executable
      # Select ./internal/desktop/application in integration_packages for the
      # legacy profile upgrade test.
      DEFAULT_INTEGRATION_PACKAGES: >-
        ./internal/core
        ./internal/desktop/updater
        ./internal/link
        ./internal/node/backup
        ./internal/node/computer
        ./internal/node/store
        ./internal/node/terminal
        ./internal/node/wsl
        ./internal/speech/capture
        ${{ matrix.process }}
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/go-cache
        id: go-cache
      - name: Linux command sandbox
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-linux-command-sandbox.sh
      - name: macOS command sandbox
        if: runner.os == 'macOS'
        run: |
          test -x /usr/bin/sandbox-exec
          command -v nc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-${{ matrix.target }}
          path: .runtime/native/${{ matrix.target }}
      - name: Verify native artifact checksums
        working-directory: .runtime/native/${{ matrix.target }}
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then
            sha256sum --check SHA256SUMS
          else
            shasum -a 256 --check SHA256SUMS
          fi
      - name: Integration tests
        env:
          PACKAGES: ${{ inputs.integration_packages }}
          SAILRY_CAPTURE_DIR: ${{ github.workspace }}/.runtime/native/${{ matrix.target }}
        # Linux runs only tests declared in //go:build integration files, which
        # its test lanes do not cover; macOS and Windows run whole suites.
        run: |
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          # The default set already exercises libp2p direct and relay routes.
          # Keep that local transport check when a manual run omits ./internal/link.
          if [ -n "$PACKAGES" ] && ! grep -Eq '(^|[[:space:]])\./internal/link([[:space:]]|$)' <<<"$PACKAGES"; then
            go test -tags integration ./internal/link -run '^TestLibp2pLink'
          fi
          # shellcheck disable=SC2086
          bash .github/scripts/test.sh integration ${PACKAGES:-$DEFAULT_INTEGRATION_PACKAGES}
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}
          save-build: 'false'
