name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'
  # Avoid a Homebrew index refresh before every package install.
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  source:
    name: Source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shared: ${{ steps.scope.outputs.shared }}
      host: ${{ steps.scope.outputs.host }}
      desktop: ${{ steps.scope.outputs.desktop }}
      mobile: ${{ steps.scope.outputs.mobile }}
      mobile_ffi: ${{ steps.scope.outputs.mobile_ffi }}
      android: ${{ steps.scope.outputs.android }}
      services: ${{ steps.scope.outputs.services }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Select affected checks
        id: scope
        run: python3 scripts/ci.py select
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.26.1'
          cache: false
      - name: Common source fixtures
        run: python3 scripts/ci.py fixtures shared
      - name: Concise function and test names
        run: python3 scripts/check-names.py
      - name: Workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=
      - name: Script syntax
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n
          python3 -m compileall -q scripts

  services:
    name: Pairing service
    needs: source
    if: needs.source.outputs.services == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - name: Pairing service
        working-directory: services/pairing-relay
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm build:edgeone

  shared:
    name: Shared Node
    needs: source
    if: needs.source.outputs.shared == 'true'
    runs-on: macos-15
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      BUILD_JOBS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Compiler cache
        uses: Mozilla-Actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # sccache holds compiled objects; multi-GB target archives would
          # exceed the repository cache quota and evict each other.
          shared-key: macos-cargo-home
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false
          cache-bin: false
      - name: Speech cache identity
        id: speech-key
        run: python3 scripts/ci.py speech-key aarch64-apple-darwin shared
      - name: Speech native libraries
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Prepare uncached speech libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p sailry-speech --jobs "$BUILD_JOBS" -vv
      - name: Save speech native libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        # Save before later checks fail.
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Shared strict lint
        run: cargo clippy --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-speech -p sailry-embedding -p sailry-model-assets -p sailry-ocr -p sailry-release --all-targets --jobs "$BUILD_JOBS" -- -D warnings
      - name: Shared unit and local/remote integration
        run: cargo nextest run --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-release --timings --build-jobs "$BUILD_JOBS" --profile ci --test-threads=4
      - name: Isolated database engines
        run: |
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          cargo nextest run --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-release --build-jobs "$BUILD_JOBS" --profile databases --run-ignored only --filterset 'binary(databases)' --test-threads=1
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-shared
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  desktop:
    name: Desktop
    needs: source
    if: needs.source.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      BUILD_JOBS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Compiler cache
        uses: Mozilla-Actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # sccache holds compiled objects; multi-GB target archives would
          # exceed the repository cache quota and evict each other.
          shared-key: macos-cargo-home
          save-if: false
          cache-targets: false
          cache-bin: false
      - name: Speech cache identity
        id: speech-key
        run: python3 scripts/ci.py speech-key aarch64-apple-darwin shared
      - name: Speech native libraries
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Prepare uncached speech libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p sailry-speech --jobs "$BUILD_JOBS" -vv
      - name: Save speech native libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        # Save before later checks fail.
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - name: Desktop source fixtures
        run: |
          python3 scripts/ci.py fixtures desktop
          python3 -m unittest discover -s apps/desktop/src/content/files/preview/web -v
          python3 themes/scripts/catalog.py --check
          python3 -m unittest discover -s themes/scripts/tests -v
          node --test crates/content/src/markdown/visuals/render.test.mjs
          python3 scripts/check-locales.py --product desktop
      - name: Formatting
        if: needs.source.outputs.shared != 'true'
        run: cargo fmt --all -- --check
      - name: Desktop strict lint
        run: cargo clippy --locked -p sailry-content -p sailry-desktop --all-targets --jobs "$BUILD_JOBS" -- -D warnings
      - name: Desktop logic and service contracts
        # Process isolation permits bounded concurrency without shared global state.
        run: cargo nextest run --locked -p sailry-content -p sailry-desktop --lib --bin sailry-desktop --timings --build-jobs "$BUILD_JOBS" --profile ci
      - name: Desktop without test features
        # Tests enable test-support features; type-check the shipped feature set.
        run: cargo check --locked -p sailry-desktop --jobs "$BUILD_JOBS"
      - name: Desktop process lifecycle
        run: cargo nextest run --locked -p sailry-desktop --test lifecycle --build-jobs "$BUILD_JOBS" --profile lifecycle
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-desktop
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  host:
    name: Host
    needs: source
    if: needs.source.outputs.host == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      BUILD_JOBS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Compiler cache
        uses: Mozilla-Actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # sccache holds compiled objects; multi-GB target archives would
          # exceed the repository cache quota and evict each other.
          shared-key: macos-cargo-home
          save-if: false
          cache-targets: false
          cache-bin: false
      - name: Host source fixtures
        run: python3 scripts/ci.py fixtures host
      - name: Formatting
        if: needs.source.outputs.shared != 'true' && needs.source.outputs.desktop != 'true'
        run: cargo fmt --all -- --check
      - name: Host strict lint
        run: cargo clippy --locked -p sailry-host --all-targets --jobs "$BUILD_JOBS" -- -D warnings
      - name: Host logic and service contracts
        run: cargo nextest run --locked -p sailry-host --timings --build-jobs "$BUILD_JOBS" --profile ci --test-threads=4
      - name: Host without test features
        run: cargo check --locked -p sailry-host --jobs "$BUILD_JOBS"
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-host
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  mobile:
    name: Mobile, shared bridge and iOS
    needs: source
    if: needs.source.outputs.mobile == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Compiler cache
        uses: Mozilla-Actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-cargo-home
          save-if: false
          cache-targets: false
          cache-bin: false
      - name: Speech cache identity
        id: speech-key
        run: python3 scripts/ci.py speech-key aarch64-apple-darwin shared
      - name: Speech native libraries
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Prepare uncached speech libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p sailry-speech --jobs 1 -vv
      - name: Save speech native libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - name: Mobile source fixtures
        run: |
          python3 scripts/ci.py fixtures mobile
          python3 scripts/check-locales.py --product mobile
      - name: Flutter analysis and widget tests
        working-directory: apps/mobile
        run: |
          dart format --output=none --set-exit-if-changed lib preview test integration_test tool
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Formatting
        if: needs.source.outputs.shared != 'true' && needs.source.outputs.desktop != 'true' && needs.source.outputs.host != 'true'
        run: cargo fmt --all -- --check
      - name: Mobile strict lint
        run: cargo clippy --locked -p sailry-mobile-bridge --all-targets --jobs 1 -- -D warnings
      - name: Native shared bridge
        run: cargo build --locked -p sailry-mobile-bridge --lib
      - name: Flutter controls a real remote Node
        run: cargo test --locked -p sailry-mobile-bridge --test flutter controls_remote_node -- --ignored --exact --nocapture
      - name: iOS Rust dependency boundary
        if: ${{ !cancelled() }}
        run: |
          rustup target add aarch64-apple-ios
          bash scripts/check-mobile-boundary.sh aarch64-apple-ios sailry-mobile-bridge
      - name: Unsigned iOS application
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign --build-name="$(python3 ../../scripts/package/versions.py --apple)"
          git diff --exit-code -- pubspec.lock
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  mobile_ffi:
    name: Mobile Dart FFI contracts
    needs: source
    if: needs.source.outputs.mobile_ffi == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Compiler cache
        uses: Mozilla-Actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-cargo-home
          save-if: false
          cache-targets: false
          cache-bin: false
      - name: Speech cache identity
        id: speech-key
        run: python3 scripts/ci.py speech-key aarch64-apple-darwin shared
      - name: Speech native libraries
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Prepare uncached speech libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p sailry-speech --jobs 1 -vv
      - name: Save speech native libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - name: Native shared bridge
        run: cargo build --locked -p sailry-mobile-bridge --lib --jobs 1
      - name: Dart FFI contract fixtures
        run: |
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          cd tests/mobile-contract
          dart pub get --enforce-lockfile
          dart analyze
          cd ../..
          cargo test --locked -p sailry-mobile-bridge --test dart --timings -- --ignored --skip mcp_peer::stdio_peer --test-threads=4 --nocapture
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  android:
    name: Mobile Android
    needs: source
    if: needs.source.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Android toolchain
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.0
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Android native prerequisites
        run: |
          printf 'ANDROID_NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Rust boundary and Android initializer
        env:
          SAILRY_ANDROID_API: '36'
        run: bash scripts/check-mobile-android.sh
      - name: ARM64 release APK
        working-directory: apps/mobile
        # CI uses a disposable debug certificate; distribution signing is tag-only.
        # Pub setup regenerates release registrants without test-only plugins.
        run: flutter build apk --release --target-platform android-arm64
      - name: Bundled native libraries
        run: |
          git diff --exit-code -- apps/mobile/pubspec.lock
          python3 scripts/package/verify-android.py apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --version "$(python3 scripts/package/versions.py)" \
            --code "$(python3 scripts/package/versions.py --android-code)"

  desktop_ready:
    name: Desktop ready
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      needs.shared.result == 'success' && needs.desktop.result == 'success'
    needs: [source, shared, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Require product results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py report desktop

  host_ready:
    name: Host ready
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      needs.shared.result == 'success' && needs.host.result == 'success'
    needs: [source, shared, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Require product results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py report host

  mobile_ready:
    name: Mobile ready
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      needs.shared.result == 'success' && needs.mobile.result == 'success' && needs.mobile_ffi.result == 'success' && needs.android.result == 'success'
    needs: [source, shared, mobile, mobile_ffi, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Require product results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py report mobile

  checks:
    name: Checks passed
    if: ${{ !cancelled() }}
    needs: [source, shared, desktop, host, mobile, mobile_ffi, android, services]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Require selected results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py report
