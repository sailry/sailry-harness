name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'

jobs:
  source:
    name: Source and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - name: Public source and fixtures
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Plugin packages and examples
        run: python3 scripts/test-plugins.py
      - name: Pairing service
        working-directory: services/pairing-relay
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm build:edgeone

  rust:
    name: Rust and desktop
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Backend unit and local/remote integration
        run: cargo test --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-host -- --test-threads=4
      - name: Desktop behavior and Kit interactions
        # Desktop fixtures share process-global locale and native UI state.
        run: cargo test --locked -p sailry-desktop -- --test-threads=1

  mobile:
    name: Mobile and shared bridge
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Flutter analysis and widget tests
        working-directory: apps/mobile
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Native shared bridge
        run: cargo build --locked -p sailry-mobile-bridge --lib
      - name: Dart FFI contract fixtures
        run: |
          cd tests/mobile-contract
          dart pub get --enforce-lockfile
          dart analyze
          cd ../..
          cargo test --locked -p sailry-mobile-bridge --test dart -- --ignored --skip mcp_peer::stdio_peer --skip databases:: --test-threads=4 --nocapture
      - name: Flutter controls a real remote Node
        run: cargo test --locked -p sailry-mobile-bridge --test flutter controls_remote_node -- --ignored --exact --nocapture
