name: CI

# Checks only. release.yml calls this workflow on a version tag and owns
# every packaging and publishing step.
on:
  pull_request:
  push:
    branches: [main, sailry-go]
  workflow_dispatch:
    inputs:
      integration:
        description: Run the integration-tagged tests
        type: boolean
        default: false
      integration_packages:
        description: Packages for the integration run; empty selects the release set
        type: string
        default: ''
  workflow_call:
    inputs:
      integration:
        type: boolean
        default: false
      integration_packages:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: go1.27.3
  CGO_ENABLED: '0'

jobs:
  lint:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Changed inputs
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Releases (a tag, through release.yml) and manual runs build and
          # check everything. A push whose
          # previous commit is unavailable is treated the same way.
          native=true
          mobile=true
          base=
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push)
              case "$GITHUB_REF" in
                refs/tags/*) ;;
                *) if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; fi ;;
              esac
              ;;
          esac
          if [ -n "$base" ]; then
            changed=$(git diff --name-only "$base" HEAD)
            printf '%s\n' "$changed" | grep -Eq '^native/(iroh|capture)/' || native=false
            printf '%s\n' "$changed" | grep -Eq '^(apps/mobile|internal/mobile)/' || mobile=false
          fi
          printf 'native=%s\nmobile=%s\n' "$native" "$mobile" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          for goos in linux windows darwin; do
            GOOS=$goos go vet ./...
          done

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The default tests load no native library, so this job does not wait
      # for the native job's artifacts.
      - name: Repository line endings
        # Git for Windows otherwise checks out CRLF, so fixtures and embedded text would differ from other platforms.
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive
          fetch-depth: 2
      # setup-go caches exactly GOMODCACHE and GOCACHE.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            go test ./...
            exit
          fi
          # Pull requests test the packages whose own files or dependencies,
          # including test dependencies, contain a changed file.
          changed=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$changed" | grep -Eq '^(go\.mod|go\.sum|\.github/workflows/ci\.yml)$'; then
            go test ./...
            exit
          fi
          module=$(go list -m)
          go list ./... > "$RUNNER_TEMP/packages.txt"
          go list -test -f '{{.ImportPath}}{{range .Deps}} {{.}}{{end}}' ./... > "$RUNNER_TEMP/deps.txt"
          # A changed file belongs to the nearest enclosing package, so test
          # data and embedded resources count for the package that owns them.
          # The root package owns its Go files and the embedded submodules.
          printf '%s\n' "$changed" | while IFS= read -r file; do
            [ -n "$file" ] || continue
            directory=$(dirname "$file")
            while [ "$directory" != . ] && ! grep -Fxq "$module/$directory" "$RUNNER_TEMP/packages.txt"; do
              directory=$(dirname "$directory")
            done
            if [ "$directory" != . ]; then
              printf '%s\n' "$module/$directory"
              continue
            fi
            case "$file" in
              plugins|plugins/*|themes|themes/*) printf '%s\n' "$module" ;;
              */*) ;;
              *.go) printf '%s\n' "$module" ;;
            esac
          done | sort -u > "$RUNNER_TEMP/changed.txt"
          affected=$(awk '
            FILENAME == ARGV[1] { changed[$0] = 1; next }
            $1 ~ /\.test$/ {
              name = substr($1, 1, length($1) - 5)
              for (i = 2; i <= NF; i++) {
                if ($i in changed) { print name; next }
              }
            }
          ' "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/deps.txt" | sort -u)
          if [ -z "$affected" ]; then
            echo 'No affected Go packages'
            exit
          fi
          go test $affected

  native:
    needs: lint
    if: needs.lint.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64, triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: linux-arm64, triple: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: darwin-arm64, triple: aarch64-apple-darwin }
          - { os: macos-15-intel, target: darwin-amd64, triple: x86_64-apple-darwin }
          # Windows is built for x64 only, like the Rust repository's releases.
          - { os: windows-2025, target: windows-amd64, triple: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Pinned Rust toolchain
        working-directory: native/iroh
        run: |
          rustup toolchain install
          test "$(rustc -vV | awk '/^host: / {print $2}')" = '${{ matrix.triple }}'
      # The Linux iroh library ships in the Host archive, whose installer
      # preflight admits GNU libc 2.34: it is linked against that version
      # instead of the runner's.
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        if: runner.os == 'Linux'
        with:
          version: 0.16.0
          use-cache: false
      - name: cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-zigbuild --version 0.23.4 --locked
          echo 'SAILRY_GLIBC=2.34' >> "$GITHUB_ENV"
      # Windows runs the same scripts in Git Bash: cargo builds sailry_iroh.dll
      # for the MSVC target and cl builds sailry-capture.dll.
      - name: Build
        run: |
          sh native/iroh/build.sh
          sh native/capture/build.sh
      - name: GNU libc floor
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The build and the preflight must name the same version, and the
          # library must need nothing newer.
          grep -q "requires GNU libc $SAILRY_GLIBC or later" internal/node/wsl/preflight.sh
          needed=$(objdump -T ".runtime/native/${{ matrix.target }}/libsailry_iroh.so" |
            grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -V | tail -n 1)
          echo "libsailry_iroh.so needs GNU libc $needed"
          test "$(printf '%s\n%s\n' "$needed" "$SAILRY_GLIBC" | sort -V | tail -n 1)" = "$SAILRY_GLIBC"
      # The artifact is the directory `go run ./native/fetch -artifacts` reads:
      # the two libraries and their SHA256SUMS at its root.
      - name: Checksums
        working-directory: .runtime/native/${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) set -- sailry_iroh.dll sailry-capture.dll ;;
            macOS) set -- libsailry_iroh.dylib libsailry-capture.dylib ;;
            *) set -- libsailry_iroh.so libsailry-capture.so ;;
          esac
          mkdir artifact
          for name in "$@"; do
            cp "$name" "artifact/$name"
            if command -v sha256sum >/dev/null; then
              sum=$(sha256sum "$name")
            else
              sum=$(shasum -a 256 "$name")
            fi
            printf '%s  %s\n' "${sum%% *}" "$name"
          done > artifact/SHA256SUMS
          cat artifact/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: .runtime/native/${{ matrix.target }}/artifact/
          # .runtime is a hidden directory.
          include-hidden-files: true
          if-no-files-found: error

  mobile:
    name: apps/mobile
    needs: lint
    if: needs.lint.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  # Integration tests never run on pull requests or main. A manual run chooses
  # its packages; a release runs RELEASE_PACKAGES.
  integration:
    needs: native
    if: inputs.integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: windows-2025, target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The release set: packages whose integration tests build every fixture
      # themselves (temporary directories, loopback listeners, in-process
      # servers, the runner's Git and shell) and the capture library from this
      # run's native artifact. Left out because a runner does not provide what
      # they need:
      #   internal/node, internal/desktop/live, internal/localmodels/...,
      #   internal/speech: downloaded models and ONNX Runtime (SAILRY_* paths)
      #   internal/databases: external database servers
      #   internal/node/web: the public internet
      #   internal/node/process: a sandbox wrapper (bubblewrap) on Linux
      #   cmd/sailry-desktop: runs only beside a packaged executable
      RELEASE_PACKAGES: >-
        ./internal/core
        ./internal/desktop/updater
        ./internal/link
        ./internal/node/backup
        ./internal/node/computer
        ./internal/node/git
        ./internal/node/store
        ./internal/node/terminal
        ./internal/node/wsl
        ./internal/speech/capture
        ./internal/ssh
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-${{ matrix.target }}
          path: .runtime/native/${{ matrix.target }}
      # Loads this run's iroh library through the Go binding and opens and
      # closes a loopback endpoint: no relay and no external service.
      - name: Native libraries
        working-directory: .runtime/native/${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) library=sailry_iroh.dll ;;
            macOS) library=libsailry_iroh.dylib ;;
            *) library=libsailry_iroh.so ;;
          esac
          if command -v sha256sum >/dev/null; then
            sha256sum --check SHA256SUMS
          else
            shasum -a 256 --check SHA256SUMS
          fi
          printf '{"op":"close"}\n' |
            go run -tags integration github.com/sailry/sailry-harness/internal/link/iroh/cmd/iroh-spike --library "$library" |
            tee "$RUNNER_TEMP/iroh.txt"
          grep -q '"closed":true' "$RUNNER_TEMP/iroh.txt"
      - name: Integration tests
        env:
          PACKAGES: ${{ inputs.integration_packages }}
          SAILRY_CAPTURE_DIR: ${{ github.workspace }}/.runtime/native/${{ matrix.target }}
        run: go test -tags integration ${PACKAGES:-$RELEASE_PACKAGES}
