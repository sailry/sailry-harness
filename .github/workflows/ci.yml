name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'
  # Avoid a Homebrew index refresh before every package install.
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  source:
    name: Source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shared: ${{ steps.scope.outputs.shared }}
      host: ${{ steps.scope.outputs.host }}
      desktop: ${{ steps.scope.outputs.desktop }}
      mobile: ${{ steps.scope.outputs.mobile }}
      mobile_ffi: ${{ steps.scope.outputs.mobile_ffi }}
      android: ${{ steps.scope.outputs.android }}
      services: ${{ steps.scope.outputs.services }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Select affected checks
        id: scope
        run: python3 scripts/ci.py select
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.26.1'
          cache: false
      - name: Common source fixtures
        run: python3 scripts/ci.py check source
      - name: Concise function and test names
        run: python3 scripts/ci.py check names
      - name: Workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          ACTIONLINT="$(go env GOPATH)/bin/actionlint" python3 scripts/ci.py check workflows
      - name: Script syntax
        run: python3 scripts/ci.py check scripts

  services:
    name: Pairing service
    needs: source
    if: needs.source.outputs.services == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - name: Pairing service
        working-directory: services/pairing-relay
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --ignore-scripts
          python3 ../../scripts/ci.py check services

  lint:
    name: Rust strict lint
    needs: source
    if: needs.source.outputs.shared == 'true' || needs.source.outputs.desktop == 'true' || needs.source.outputs.host == 'true' || needs.source.outputs.mobile == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      CHECK_SCOPE: ${{ toJSON(needs.source.outputs) }}
      BUILD_JOBS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Speech cache identity
        if: needs.source.outputs.shared == 'true' || needs.source.outputs.desktop == 'true' || needs.source.outputs.mobile == 'true'
        id: speech-key
        run: python3 scripts/ci.py speech-key aarch64-apple-darwin shared
      - name: Speech native libraries
        if: steps.speech-key.outcome == 'success'
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/sherpa-onnx-prebuilt
            target/llama-prebuilt
          key: ${{ steps.speech-key.outputs.key }}-llama-${{ hashFiles('scripts/package/llama-runtime.lock.json') }}
      - name: Prepare uncached speech libraries
        if: steps.speech-key.outcome == 'success' && steps.speech-cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p sailry-speech --jobs "$BUILD_JOBS" -vv
      - name: Save speech native libraries
        continue-on-error: true
        if: steps.speech-key.outcome == 'success' && steps.speech-cache.outputs.cache-hit != 'true'
        # Save before later checks fail.
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/sherpa-onnx-prebuilt
            target/llama-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - name: Formatting
        run: python3 scripts/ci.py check format
      - name: Strict lint for selected packages
        run: python3 scripts/ci-run.py -- python3 scripts/ci.py lint
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  shared:
    name: Shared Node
    needs: source
    if: needs.source.outputs.shared == 'true'
    runs-on: macos-15
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      BUILD_JOBS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      source-key: ${{ steps.rust-cache.outputs.source-key }}
      source-ready: ${{ steps.rust-cache.outputs.source-hit == 'true' || steps.source-save.outcome == 'success' }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Fetch locked workspace sources
        id: workspace-sources
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.source-key != '' && steps.rust-cache.outputs.source-hit != 'true'
        run: cargo fetch --locked
      - name: Speech cache identity
        id: speech-key
        run: python3 scripts/ci.py speech-key aarch64-apple-darwin shared
      - name: Speech native libraries
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/sherpa-onnx-prebuilt
            target/llama-prebuilt
          key: ${{ steps.speech-key.outputs.key }}-llama-${{ hashFiles('scripts/package/llama-runtime.lock.json') }}
      - name: Prepare uncached speech libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p sailry-speech --jobs "$BUILD_JOBS" -vv
      - name: Save speech native libraries
        continue-on-error: true
        if: steps.speech-cache.outputs.cache-hit != 'true'
        # Save before later checks fail.
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/sherpa-onnx-prebuilt
            target/llama-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - name: Shared unit and local/remote integration
        run: python3 scripts/ci-run.py -- python3 scripts/ci.py check backend
      - name: Isolated database engines
        run: |
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          python3 scripts/ci.py check databases
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-shared
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage compressed dependency sources
        id: source-archive
        continue-on-error: true
        if: always() && github.ref == 'refs/heads/main' && steps.workspace-sources.outcome == 'success'
        run: python3 scripts/ci.py source-cache save
      - name: Save compressed dependency sources
        id: source-save
        if: always() && github.ref == 'refs/heads/main' && steps.source-archive.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cargo-sources
          key: ${{ steps.rust-cache.outputs.source-key }}
          enableCrossOsArchive: true
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  source_cache:
    name: Retire superseded source archives
    needs: shared
    if: always() && github.ref == 'refs/heads/main' && needs.shared.outputs.source-ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Retire matching legacy source keys
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ needs.shared.outputs.source-key }}
        run: python3 scripts/prune-source-cache.py --saved-key "$SOURCE_KEY"

  desktop:
    name: Desktop
    needs: source
    if: needs.source.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      BUILD_JOBS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Speech cache identity
        id: speech-key
        run: python3 scripts/ci.py speech-key aarch64-apple-darwin shared
      - name: Speech native libraries
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/sherpa-onnx-prebuilt
            target/llama-prebuilt
          key: ${{ steps.speech-key.outputs.key }}-llama-${{ hashFiles('scripts/package/llama-runtime.lock.json') }}
      - name: Prepare uncached speech libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p sailry-speech --jobs "$BUILD_JOBS" -vv
      - name: Save speech native libraries
        continue-on-error: true
        if: steps.speech-cache.outputs.cache-hit != 'true'
        # Save before later checks fail.
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/sherpa-onnx-prebuilt
            target/llama-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - name: Desktop source fixtures
        run: python3 scripts/ci.py check desktop-source
      - name: Desktop logic and service contracts
        # Process isolation permits bounded concurrency without shared global state.
        run: python3 scripts/ci.py check desktop
      - name: Desktop without test features
        # Tests enable test-support features; type-check the shipped feature set.
        run: python3 scripts/ci.py check desktop-production
      - name: Desktop process lifecycle
        run: python3 scripts/ci.py check desktop-lifecycle
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-desktop
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  host:
    name: Host
    needs: source
    if: needs.source.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = x86_64-unknown-linux-gnu
      - name: Linux build and sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential pkg-config clang ripgrep bubblewrap libx11-dev libxi-dev libxtst-dev
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Host source fixtures
        run: python3 scripts/ci.py check host-source
      - name: Host logic and service contracts
        run: python3 scripts/ci.py check host
      - name: Host without test features
        run: python3 scripts/ci.py check host-production
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-host
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  host_mac:
    name: macOS Host lifecycle
    needs: source
    if: needs.source.outputs.host == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      BUILD_JOBS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Host macOS lifecycle
        run: python3 scripts/ci.py check host-mac
      - name: Host without test features
        run: python3 scripts/ci.py check host-production
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-host-macos
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  mobile:
    name: Mobile logic and iOS
    needs: source
    if: needs.source.outputs.mobile == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Mobile source fixtures
        run: python3 scripts/ci.py check mobile-source
      - name: Flutter analysis and logic tests
        working-directory: apps/mobile
        run: |
          python3 ../../scripts/ci.py check mobile-format
          python3 ../../scripts/ci.py check mobile-check
      - name: iOS Rust dependency boundary
        if: ${{ !cancelled() }}
        run: |
          rustup target add aarch64-apple-ios
          bash scripts/check-mobile-boundary.sh aarch64-apple-ios sailry-mobile-bridge
      - name: Unsigned iOS application
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign --build-name="$(python3 ../../scripts/package/versions.py --apple)"
          git diff --exit-code -- pubspec.lock
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  mobile_ffi:
    name: Mobile Dart FFI contracts
    needs: source
    if: needs.source.outputs.mobile_ffi == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Speech cache identity
        id: speech-key
        run: python3 scripts/ci.py speech-key aarch64-apple-darwin shared
      - name: Speech native libraries
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Prepare uncached speech libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: cargo build --locked -p sailry-speech --jobs 1 -vv
      - name: Save speech native libraries
        continue-on-error: true
        if: steps.speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - name: Native shared bridge
        run: cargo build --locked -p sailry-mobile-bridge --lib --jobs 1
      - name: Code index contract resources
        run: |
          task_source="$(python3 scripts/package/code-parsers.py --target aarch64-apple-darwin --output target/debug/code-parsers --sign -)"
          printf 'TSLP_SOURCE_BUNDLE_URL=%s\n' "$task_source" >> "$GITHUB_ENV"
      - name: Dart FFI contract fixtures
        run: |
          unset TSLP_OFFLINE TSLP_LANGUAGES
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          cd tests/mobile-contract
          dart pub get --enforce-lockfile
          dart analyze
          cd ../..
          cargo test --locked -p sailry-mobile-bridge --test dart --timings -- --ignored --skip mcp_peer::stdio_peer --test-threads=4 --nocapture
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  android:
    name: Mobile Android
    needs: source
    if: needs.source.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Android toolchain
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.0
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Android native prerequisites
        run: |
          printf 'ANDROID_NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Rust boundary and Android initializer
        env:
          SAILRY_ANDROID_API: '36'
        run: bash scripts/check-mobile-android.sh
      - name: ARM64 release APK
        working-directory: apps/mobile
        # CI uses a disposable debug certificate; distribution signing is tag-only.
        # Pub setup regenerates release registrants without test-only plugins.
        run: flutter build apk --release --target-platform android-arm64
      - name: Bundled native libraries
        run: |
          git diff --exit-code -- apps/mobile/pubspec.lock
          python3 scripts/package/verify-android.py apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --version "$(python3 scripts/package/versions.py)" \
            --code "$(python3 scripts/package/versions.py --android-code)"

  desktop_ready:
    name: Desktop ready
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.lint.result == 'success' &&
      needs.shared.result == 'success' && needs.desktop.result == 'success'
    needs: [source, lint, shared, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Require product results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py report desktop

  host_ready:
    name: Host ready
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.lint.result == 'success' &&
      needs.shared.result == 'success' && needs.host.result == 'success' && needs.host_mac.result == 'success'
    needs: [source, lint, shared, host, host_mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Require product results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py report host

  mobile_ready:
    name: Mobile ready
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.lint.result == 'success' &&
      needs.shared.result == 'success' && needs.mobile.result == 'success' && needs.mobile_ffi.result == 'success' && needs.android.result == 'success'
    needs: [source, lint, shared, mobile, mobile_ffi, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Require product results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py report mobile

  checks:
    name: Checks passed
    if: ${{ !cancelled() }}
    needs: [source, lint, shared, desktop, host, host_mac, mobile, mobile_ffi, android, services]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Require selected results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py report
