name: Checks
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Candidate validation' || 'Source checks' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'candidate' || 'source' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'

jobs:
  source:
    name: Source and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.26.1'
          cache: false
      - name: Public source and fixtures
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Concise function and test names
        run: python3 scripts/check-names.py
      - name: Localization coverage and placeholders
        run: python3 scripts/check-locales.py
      - name: Workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=
      - name: Script syntax
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n
          python3 -m compileall -q scripts
      - name: Plugin packages and examples
        run: python3 scripts/test-plugins.py
      - name: Pairing service
        working-directory: services/pairing-relay
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm build:edgeone

  rust:
    if: github.event_name == 'workflow_dispatch'
    name: Rust ${{ matrix.kind }} (${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        kind: [backend, desktop, lint]
        platform:
          - runner: macos-15
            target: aarch64-apple-darwin
            # Large Rust targets can exceed the standard ARM runner's 7 GB RAM.
            jobs: 1
            threads: 4
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            jobs: 2
            # Concurrent real-Node fixtures repeatedly exhausted their deadlines.
            threads: 2
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    env:
      # CLI job limits keep this cache-hashed environment shared with Mobile.
      CARGO_BUILD_JOBS: '2'
      # Main and test Desktop targets together can exceed Intel's 14 GB RAM too.
      BUILD_JOBS: ${{ matrix.kind == 'desktop' && 1 || matrix.platform.jobs }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        env:
          DESKTOP_TARGET: ${{ matrix.platform.target }}
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$DESKTOP_TARGET"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Compiler cache
        uses: Mozilla-Actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
      - name: Process-isolated test runner
        if: matrix.kind != 'lint'
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Retain native dependencies; avoid duplicating them in lint archives.
          shared-key: ${{ matrix.platform.target }}${{ matrix.kind == 'lint' && '-lint-sources' || '' }}-rust
          save-if: ${{ matrix.kind != 'backend' }}
          cache-on-failure: true
          cache-targets: ${{ matrix.kind != 'lint' }}
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DEVELOPER_DIR SDKROOT MACOSX_DEPLOYMENT_TARGET
      - name: Speech native libraries
        if: matrix.kind != 'backend'
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: speech-${{ matrix.platform.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Prepare uncached speech libraries
        if: matrix.kind != 'backend' && steps.speech-cache.outputs.cache-hit != 'true'
        # A restored build-script fingerprint can outlive its downloaded libraries.
        run: |
          cargo clean --locked -p sherpa-onnx-sys
          cargo build --locked -p sailry-speech --jobs "$BUILD_JOBS" -vv
      - name: Save speech native libraries
        if: matrix.kind != 'backend' && steps.speech-cache.outputs.cache-hit != 'true'
        # Save before later checks fail or rust-cache prunes target directories.
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - name: Formatting
        if: matrix.kind == 'lint'
        run: cargo fmt --all -- --check
      - name: Strict lint
        if: matrix.kind == 'lint'
        run: cargo clippy --locked --workspace --all-targets --jobs "$BUILD_JOBS" -- -D warnings
      - name: Backend test compilation
        if: matrix.kind == 'backend'
        run: cargo test --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-host --no-run --timings --jobs "$BUILD_JOBS"
      - name: Backend unit and local/remote integration
        if: matrix.kind == 'backend'
        run: cargo nextest run --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-host --build-jobs "$BUILD_JOBS" --profile ci --test-threads=${{ matrix.platform.threads }}
      - name: Backend documentation tests
        if: matrix.kind == 'backend'
        run: cargo test --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-host --doc --jobs "$BUILD_JOBS"
      - name: Isolated database engines
        if: matrix.kind == 'backend' && matrix.platform.target == 'aarch64-apple-darwin'
        run: |
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          cargo nextest run --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-host --build-jobs "$BUILD_JOBS" --profile databases --run-ignored only --filterset 'binary(databases)' --test-threads=1
      - name: Desktop test compilation
        if: matrix.kind == 'desktop'
        run: cargo test --locked -p sailry-desktop --bin sailry-desktop --no-run --timings --jobs "$BUILD_JOBS"
      - name: Desktop behavior and Kit interactions
        if: matrix.kind == 'desktop'
        # Process isolation permits bounded concurrency without shared locale/UI state.
        run: cargo nextest run --locked -p sailry-desktop --bin sailry-desktop --build-jobs "$BUILD_JOBS" --profile ci
      - name: Desktop and Host binaries
        if: matrix.kind == 'desktop'
        run: cargo build --locked -p sailry-desktop -p sailry-host --jobs "$BUILD_JOBS"
      - name: Desktop process lifecycle
        if: matrix.kind == 'desktop'
        run: cargo nextest run --locked -p sailry-desktop --test lifecycle --build-jobs "$BUILD_JOBS" --profile lifecycle
      - name: Compilation timings
        if: always() && matrix.kind != 'lint'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-${{ matrix.kind }}-${{ matrix.platform.target }}
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  mobile:
    if: github.event_name == 'workflow_dispatch'
    name: Mobile and shared bridge
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Compiler cache
        uses: Mozilla-Actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reuse Desktop's dependencies without another target archive.
          shared-key: aarch64-apple-darwin-rust
          save-if: false
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DEVELOPER_DIR SDKROOT MACOSX_DEPLOYMENT_TARGET
      - name: Speech native libraries
        id: speech-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: speech-aarch64-apple-darwin-${{ hashFiles('Cargo.lock') }}
      - name: Prepare uncached speech libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        # The shared Rust cache includes build scripts, not their downloaded libraries.
        run: |
          cargo clean --locked -p sherpa-onnx-sys
          cargo build --locked -p sailry-speech --jobs 1 -vv
      - name: Save speech native libraries
        if: steps.speech-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-cache.outputs.cache-primary-key }}
      - name: Flutter analysis and widget tests
        working-directory: apps/mobile
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Native shared bridge
        run: cargo build --locked -p sailry-mobile-bridge --lib
      - name: Dart FFI test compilation
        run: cargo test --locked -p sailry-mobile-bridge --test dart --no-run --timings
      - name: Dart FFI contract fixtures
        run: |
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          cd tests/mobile-contract
          dart pub get --enforce-lockfile
          dart analyze
          cd ../..
          cargo test --locked -p sailry-mobile-bridge --test dart -- --ignored --skip mcp_peer::stdio_peer --test-threads=4 --nocapture
      - name: Flutter controls a real remote Node
        run: cargo test --locked -p sailry-mobile-bridge --test flutter controls_remote_node -- --ignored --exact --nocapture
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  android:
    if: github.event_name == 'workflow_dispatch'
    name: Mobile Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Android toolchain
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.0
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Android native prerequisites
        run: |
          printf 'ANDROID_NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Rust boundary and Android initializer
        env:
          SAILRY_ANDROID_API: '36'
        run: bash scripts/check-mobile-android.sh
      - name: ARM64 release APK
        working-directory: apps/mobile
        # CI uses a disposable debug certificate; distribution signing is tag-only.
        # Pub setup regenerates release registrants without test-only plugins.
        run: flutter build apk --release --target-platform android-arm64
      - name: Bundled native libraries
        run: |
          git diff --exit-code -- apps/mobile/pubspec.lock
          python3 scripts/package/verify-android.py apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --version "$(python3 scripts/package/versions.py)" \
            --code "$(python3 scripts/package/versions.py --android-code)"

  ios:
    if: github.event_name == 'workflow_dispatch'
    name: Mobile iOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: iOS toolchain
        run: |
          xcodebuild -version
          brew install ripgrep
          rustup target add aarch64-apple-ios
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Rust dependency boundary
        run: bash scripts/check-mobile-boundary.sh aarch64-apple-ios sailry-mobile-bridge
      - name: Unsigned iOS application
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign --build-name="$(python3 ../../scripts/package/versions.py --apple)"
          git diff --exit-code -- pubspec.lock

  checks:
    name: Checks passed
    if: ${{ !cancelled() }}
    needs: [source, rust, mobile, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require results for this scope
        env:
          CHECK_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'candidate' || 'source' }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          scope = os.environ['CHECK_SCOPE']
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          expected = {
              name: 'success' if scope == 'candidate' or name == 'source' else 'skipped'
              for name in results
          }
          if any(job['result'] != expected[name] for name, job in results.items()):
              raise SystemExit('One or more required checks did not pass')
          if scope == 'candidate':
              print('Candidate validation passed')
          else:
              print('Source checks passed; native validation was not run')
          PY
