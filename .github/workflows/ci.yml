name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'

jobs:
  source:
    name: Source and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.26.1'
          cache: false
      - name: Public source and fixtures
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Concise function and test names
        run: python3 scripts/check-names.py
      - name: Localization coverage and placeholders
        run: python3 scripts/check-locales.py
      - name: Workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=
      - name: Script syntax
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n
          python3 -m compileall -q scripts
      - name: Plugin packages and examples
        run: python3 scripts/test-plugins.py
      - name: Pairing service
        working-directory: services/pairing-relay
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm build:edgeone

  rust:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    # Cold Intel builds reached the former two-hour job limit.
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$DESKTOP_TARGET"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Search prerequisite
        run: brew install ripgrep
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DEVELOPER_DIR SDKROOT MACOSX_DEPLOYMENT_TARGET
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Backend test compilation
        run: cargo test --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-host --no-run
      - name: Backend unit and local/remote integration
        run: cargo test --locked -p sailry-protocol -p sailry-link -p sailry-client -p sailry-node-runtime -p sailry-host --no-fail-fast -- --test-threads=4
      - name: Isolated database engines
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          cargo test --locked -p sailry-node-runtime --test databases -- --ignored --test-threads=1
      - name: Desktop test compilation
        run: cargo test --locked -p sailry-desktop --no-run
      - name: Desktop behavior and Kit interactions
        # Desktop fixtures share process-global locale and native UI state.
        run: cargo test --locked -p sailry-desktop -- --test-threads=1
      - name: Desktop and Host binaries
        run: cargo build --locked -p sailry-desktop -p sailry-host

  mobile:
    name: Mobile and shared bridge
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Search prerequisite
        run: brew install ripgrep
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DEVELOPER_DIR SDKROOT MACOSX_DEPLOYMENT_TARGET
      - name: Flutter analysis and widget tests
        working-directory: apps/mobile
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Native shared bridge
        run: cargo build --locked -p sailry-mobile-bridge --lib
      - name: Dart FFI test compilation
        run: cargo test --locked -p sailry-mobile-bridge --test dart --no-run
      - name: Dart FFI contract fixtures
        run: |
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          cd tests/mobile-contract
          dart pub get --enforce-lockfile
          dart analyze
          cd ../..
          cargo test --locked -p sailry-mobile-bridge --test dart -- --ignored --skip mcp_peer::stdio_peer --test-threads=4 --nocapture
      - name: Flutter controls a real remote Node
        run: cargo test --locked -p sailry-mobile-bridge --test flutter controls_remote_node -- --ignored --exact --nocapture

  android:
    name: Mobile Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Android toolchain
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.0
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Android native prerequisites
        run: |
          printf 'ANDROID_NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Rust boundary and Android initializer
        env:
          SAILRY_ANDROID_API: '36'
        run: bash scripts/check-mobile-android.sh
      - name: ARM64 release APK
        working-directory: apps/mobile
        # CI uses a disposable debug certificate; distribution signing is tag-only.
        # Pub setup regenerates release registrants without test-only plugins.
        run: flutter build apk --release --target-platform android-arm64
      - name: Bundled native libraries
        run: |
          git diff --exit-code -- apps/mobile/pubspec.lock
          python3 scripts/package/verify-android.py apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --version "$(python3 scripts/package/versions.py)" \
            --code "$(python3 scripts/package/versions.py --android-code)"

  ios:
    name: Mobile iOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: iOS toolchain
        run: |
          xcodebuild -version
          brew install ripgrep
          rustup target add aarch64-apple-ios
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Rust dependency boundary
        run: bash scripts/check-mobile-boundary.sh aarch64-apple-ios sailry-mobile-bridge
      - name: Unsigned iOS application
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign --build-name="$(python3 ../../scripts/package/versions.py --apple)"
          git diff --exit-code -- pubspec.lock

  checks:
    name: Checks passed
    if: always()
    needs: [source, rust, mobile, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every result
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('One or more required checks did not pass')
          PY
