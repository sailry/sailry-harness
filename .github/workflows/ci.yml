name: CI

# Checks and build verification only. release.yml owns distribution signing
# and publishing, and calls this workflow on a version tag.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration:
        description: Run the integration-tagged tests
        type: boolean
        default: false
      integration_packages:
        description: Packages for the integration run; empty selects the release set
        type: string
        default: ''
  workflow_call:
    inputs:
      integration:
        type: boolean
        default: false
      integration_packages:
        type: string
        default: ''
      skip_mobile_builds:
        description: Release jobs build the signed mobile packages separately
        type: boolean
        default: false
      reuse_go:
        description: The release caller verified successful Go checks for this exact commit
        type: boolean
        default: false
      reuse_mobile:
        description: The release caller verified successful mobile checks for this exact commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_type == 'tag' && 'release' || github.event_name == 'workflow_dispatch' && (inputs.integration && 'manual-integration' || 'manual') || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

env:
  GOTOOLCHAIN: go1.27.3
  CGO_ENABLED: '0'

jobs:
  # Path selection must not wait for the compiler or cross-platform vet.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: Changed inputs
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Releases and manual runs verify every build. A missing push base
          # also falls back to the full set.
          native=true
          mobile=true
          base=
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push)
              case "$GITHUB_REF" in
                refs/tags/*) ;;
                *) if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; fi ;;
              esac
              ;;
          esac
          if [ -n "$base" ]; then
            changed=$(git diff --name-only "$base" HEAD)
            grep -Eq '^native/(iroh|turso|capture|windows)/|^\.github/(workflows/ci\.yml$|actions/)' <<< "$changed" || native=false
            grep -Eq '^(apps/mobile|cmd/sailry-mobile|internal/(mobile|client|link|protocol|shipped)|native/iroh)/|^(go\.(mod|sum)|\.github/workflows/ci\.yml)$|^\.github/actions/' <<< "$changed" || mobile=false
          fi
          printf 'native=%s\nmobile=%s\n' "$native" "$mobile" >> "$GITHUB_OUTPUT"

  lint:
    if: ${{ !inputs.reuse_go }}
    runs-on: ubuntu-24.04
    env:
      GO_CACHE_ROLE: lint
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive
      - name: Test lane routing
        run: bash .github/scripts/test_test.sh
      - name: Test release CI reuse
        run: bash .github/scripts/reuse-ci_test.sh
      - uses: ./.github/actions/go-cache
        id: go-cache
      - name: Format
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf 'gofmt differs:\n%s\n' "$files" >&2
            exit 1
          fi
      # The integration tag adds files and removes none, so one pass also
      # compiles the integration tests that no routine job runs.
      - name: Vet
        run: |
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          for goos in linux windows darwin; do
            GOOS=$goos go vet -tags integration ./...
          done
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  test:
    if: ${{ !inputs.reuse_go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        lane: [linux-0, linux-1, linux-2, linux-3]
        include:
          - { os: windows-2025, lane: platform, target: windows-amd64 }
          - { os: macos-15, lane: platform, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      GO_CACHE_ROLE: test
    defaults:
      run:
        shell: bash
    steps:
      # Linux runs the complete suite. Native macOS and Windows builds run
      # their platform regressions; integration libraries are checked below.
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive
      - uses: ./.github/actions/go-cache
        id: go-cache
      - name: UI fonts
        if: runner.os == 'Linux'
        # Fontconfig needs CJK glyphs for the Chinese UI's pixel assertions.
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
      - uses: ./.github/actions/turso
      - name: Test
        run: bash .github/scripts/test.sh '${{ matrix.lane }}'
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && (matrix.lane == 'linux-0' || matrix.lane == 'platform') }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64, triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: linux-arm64, triple: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: darwin-arm64, triple: aarch64-apple-darwin }
          - { os: macos-15-intel, target: darwin-amd64, triple: x86_64-apple-darwin }
          # Windows is built for x64 only, like the Rust repository's releases.
          - { os: windows-2025, target: windows-amd64, triple: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      # The Linux iroh library ships in the Host archive, whose installer
      # preflight admits GNU libc 2.34: it is linked against that version
      # instead of the runner's. The build scripts read it on Linux only.
      SAILRY_GLIBC: '2.34'
      ZIG_VERSION: 0.16.0
      ZIGBUILD_VERSION: 0.23.4
    defaults:
      run:
        shell: bash
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      # The iroh and capture libraries depend only on their pinned sources and
      # these tool versions. Unchanged inputs reuse the built bytes, in CI and
      # in a release alike; the checks below run on every restored library.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: libraries
        with:
          path: |
            .runtime/native/${{ matrix.target }}/libsailry_iroh.so
            .runtime/native/${{ matrix.target }}/libsailry_iroh.dylib
            .runtime/native/${{ matrix.target }}/sailry_iroh.dll
            .runtime/native/${{ matrix.target }}/libsailry-capture.so
            .runtime/native/${{ matrix.target }}/libsailry-capture.dylib
            .runtime/native/${{ matrix.target }}/sailry-capture.dll
          key: native-libraries-v1-${{ matrix.target }}-glibc${{ env.SAILRY_GLIBC }}-zig${{ env.ZIG_VERSION }}-zigbuild${{ env.ZIGBUILD_VERSION }}-${{ hashFiles('native/iroh/**', 'native/capture/**') }}
      - name: Pinned Rust toolchain
        if: steps.libraries.outputs.cache-hit != 'true'
        working-directory: native/iroh
        run: |
          rustup toolchain install
          test "$(rustc -vV | awk '/^host: / {print $2}')" = '${{ matrix.triple }}'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        if: runner.os == 'Linux' && steps.libraries.outputs.cache-hit != 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: cargo-zigbuild
        if: runner.os == 'Linux' && steps.libraries.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --version "$ZIGBUILD_VERSION" --locked
      # Windows runs the same scripts in Git Bash: cargo builds sailry_iroh.dll
      # for the MSVC target and cl builds sailry-capture.dll.
      - name: Build
        if: steps.libraries.outputs.cache-hit != 'true'
        run: |
          sh native/iroh/build.sh
          sh native/capture/build.sh
      - uses: ./.github/actions/turso
      - name: Windows C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/windows/crt.ps1
      - name: GNU libc floor
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The build and the preflight must name the same version, and the
          # library must need nothing newer. The Turso action has already
          # checked its own library.
          grep -q "requires GNU libc $SAILRY_GLIBC or later" internal/node/wsl/preflight.sh
          needed=$(objdump -T ".runtime/native/${{ matrix.target }}/libsailry_iroh.so" |
            grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -V | tail -n 1)
          echo "libsailry_iroh.so needs GNU libc $needed"
          test "$(printf '%s\n%s\n' "$needed" "$SAILRY_GLIBC" | sort -V | tail -n 1)" = "$SAILRY_GLIBC"
      # Saved only after the floor check, so a library that fails it is rebuilt.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.libraries.outputs.cache-hit != 'true'
        with:
          path: |
            .runtime/native/${{ matrix.target }}/libsailry_iroh.so
            .runtime/native/${{ matrix.target }}/libsailry_iroh.dylib
            .runtime/native/${{ matrix.target }}/sailry_iroh.dll
            .runtime/native/${{ matrix.target }}/libsailry-capture.so
            .runtime/native/${{ matrix.target }}/libsailry-capture.dylib
            .runtime/native/${{ matrix.target }}/sailry-capture.dll
          key: ${{ steps.libraries.outputs.cache-primary-key }}
      # The artifact is the directory `go run ./native/fetch -artifacts` reads:
      # the built libraries and their SHA256SUMS at its root.
      - name: Checksums
        working-directory: .runtime/native/${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              set -- sailry_iroh.dll turso_sync_sdk_kit.dll sailry-capture.dll windows-crt.json
              while IFS= read -r name; do set -- "$@" "$name"; done < <(jq -r '.files[]' windows-crt.json | tr -d '\r')
              ;;
            macOS) set -- libsailry_iroh.dylib libturso_sync_sdk_kit.dylib libsailry-capture.dylib ;;
            *) set -- libsailry_iroh.so libturso_sync_sdk_kit.so libsailry-capture.so ;;
          esac
          mkdir artifact
          for name in "$@"; do
            cp "$name" "artifact/$name"
            if command -v sha256sum >/dev/null; then
              sum=$(sha256sum "$name")
            else
              sum=$(shasum -a 256 "$name")
            fi
            printf '%s  %s\n' "${sum%% *}" "$name"
          done > artifact/SHA256SUMS
          cat artifact/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: .runtime/native/${{ matrix.target }}/artifact/
          # .runtime is a hidden directory.
          include-hidden-files: true
          if-no-files-found: error

  mobile:
    name: apps/mobile (Android)
    needs: scope
    if: ${{ needs.scope.outputs.mobile == 'true' && !inputs.reuse_mobile }}
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: ''
      GO_CACHE_ROLE: mobile-android
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/go-cache
        id: go-cache
        if: ${{ !inputs.skip_mobile_builds }}
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/android
        if: ${{ !inputs.skip_mobile_builds }}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build ARM64 release APK
        if: ${{ !inputs.skip_mobile_builds }}
        run: flutter build apk --release --no-pub --target-platform android-arm64
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  mobile-ios:
    name: apps/mobile (iOS)
    needs: scope
    if: ${{ needs.scope.outputs.mobile == 'true' && !inputs.skip_mobile_builds }}
    runs-on: macos-15
    env:
      CGO_ENABLED: ''
      GO_CACHE_ROLE: mobile-ios
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/go-cache
        id: go-cache
      - uses: ./.github/actions/flutter
      - name: Native prerequisites
        working-directory: native/iroh
        run: |
          xcodebuild -version
          rustup toolchain install
          rustup target add aarch64-apple-ios
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-pub --no-codesign
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}

  # Integration tests never run on pull requests or main. A manual run chooses
  # its packages; a release runs RELEASE_PACKAGES.
  integration:
    needs: native
    if: inputs.integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64, process: './internal/node/process' }
          - { os: macos-15, target: darwin-arm64, process: './internal/node/process' }
          - { os: windows-2025, target: windows-amd64, process: '' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GO_CACHE_ROLE: test
      # The release set: packages whose integration tests build every fixture
      # themselves (temporary directories, loopback listeners, in-process
      # servers, the runner's Git and shell) and the capture library from this
      # run's native artifact. Left out because a runner does not provide what
      # they need:
      #   internal/node, internal/desktop/live, internal/localmodels/...,
      #   internal/speech: downloaded models and ONNX Runtime (SAILRY_* paths)
      #   internal/databases: external database servers
      #   internal/node/web: the public internet
      #   cmd/sailry-desktop: runs only beside a packaged executable
      RELEASE_PACKAGES: >-
        ./internal/core
        ./internal/desktop/updater
        ./internal/link
        ./internal/node/backup
        ./internal/node/computer
        ./internal/node/git
        ./internal/node/store
        ./internal/node/terminal
        ./internal/node/wsl
        ./internal/speech/capture
        ./internal/ssh
        ${{ matrix.process }}
    steps:
      - name: Repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive
      - uses: ./.github/actions/go-cache
        id: go-cache
      - name: Linux command sandbox
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap netcat-openbsd apparmor
          sysctl kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns || true
          # Ubuntu permits a binary-specific userns profile. Keep the host's
          # restriction enabled and prefer its packaged bubblewrap profile.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = 1 ] &&
             [ "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || true)" = Y ]; then
            profile=
            for candidate in /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/bwrap; do
              if [ -f "$candidate" ]; then profile=$candidate; break; fi
            done
            if [ -z "$profile" ]; then
              profile=/etc/apparmor.d/sailry-ci-bwrap
              sudo tee "$profile" >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            fi
            sudo apparmor_parser -r "$profile"
          fi
          bwrap --die-with-parent --unshare-pid --unshare-net --new-session --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - name: macOS command sandbox
        if: runner.os == 'macOS'
        run: |
          test -x /usr/bin/sandbox-exec
          command -v nc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-${{ matrix.target }}
          path: .runtime/native/${{ matrix.target }}
      # Loads this run's iroh library through the Go binding and opens and
      # closes a loopback endpoint: no relay and no external service.
      - name: Native libraries
        working-directory: .runtime/native/${{ matrix.target }}
        env:
          NATIVE_DIR: ${{ github.workspace }}/.runtime/native/${{ matrix.target }}
        run: |
          set -euo pipefail
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          case "$RUNNER_OS" in
            Windows) library=sailry_iroh.dll ;;
            macOS) library=libsailry_iroh.dylib ;;
            *) library=libsailry_iroh.so ;;
          esac
          if command -v sha256sum >/dev/null; then
            sha256sum --check SHA256SUMS
          else
            shasum -a 256 --check SHA256SUMS
          fi
          printf 'SAILRY_IROH_LIB=%s/%s\n' "$NATIVE_DIR" "$library" >> "$GITHUB_ENV"
          printf '{"op":"close"}\n' |
            go run -tags integration github.com/sailry/sailry-harness/internal/link/iroh/cmd/iroh-spike --library "$library" |
            tee "$RUNNER_TEMP/iroh.txt"
          grep -q '"closed":true' "$RUNNER_TEMP/iroh.txt"
      - name: Integration tests
        env:
          PACKAGES: ${{ inputs.integration_packages }}
          SAILRY_CAPTURE_DIR: ${{ github.workspace }}/.runtime/native/${{ matrix.target }}
        # Isolate the concurrent storage corpus from other packages' CPU
        # and disk workloads; measure hardware budgets separately below.
        run: |
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          go test -p 1 -tags integration ${PACKAGES:-$RELEASE_PACKAGES}
      - name: Reference storage performance
        if: runner.os == 'macOS'
        # Keep the original hardware budgets on one reference platform;
        # all platforms still run the complete concurrent correctness corpus.
        run: |
          unset GOROOT
          export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
          go test -tags integration ./internal/node/store -run '^$' -bench '^BenchmarkStorageLoad$' -benchtime=1x -count=1
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
        with:
          phase: save
          modules-hit: ${{ steps.go-cache.outputs.modules-hit }}
          build-hit: ${{ steps.go-cache.outputs.build-hit }}
          save-build: 'false'
