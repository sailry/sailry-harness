name: Checks

on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: Completed full Checks run with unchanged product inputs
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'
  # Avoid a Homebrew index refresh before every package install.
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  source:
    name: Source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shared: ${{ steps.scope.outputs.shared }}
      host: ${{ steps.scope.outputs.host }}
      desktop: ${{ steps.scope.outputs.desktop }}
      mobile: ${{ steps.scope.outputs.mobile }}
      mobile_ffi: ${{ steps.scope.outputs.mobile_ffi }}
      android: ${{ steps.scope.outputs.android }}
      services: ${{ steps.scope.outputs.services }}
      mode: ${{ steps.scope.outputs.mode }}
      light_linux: ${{ steps.scope.outputs.light_linux }}
      light_macos: ${{ steps.scope.outputs.light_macos }}
      reuse_proof: ${{ steps.reuse.outputs.proof }}
      reuse_archive_run: ${{ steps.reuse.outputs.archive_run }}
      reuse_lint: ${{ steps.reuse.outputs.lint }}
      reuse_build: ${{ steps.reuse.outputs.build }}
      reuse_shared: ${{ steps.reuse.outputs.shared }}
      reuse_shared_matrix: ${{ steps.reuse.outputs.shared_matrix }}
      reuse_desktop: ${{ steps.reuse.outputs.desktop }}
      reuse_host: ${{ steps.reuse.outputs.host }}
      reuse_mobile: ${{ steps.reuse.outputs.mobile }}
      reuse_android: ${{ steps.reuse.outputs.android }}
      reuse_services: ${{ steps.reuse.outputs.services }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Select affected checks
        id: scope
        run: python3 scripts/ci.py select
      - name: Tool versions
        run: python3 scripts/ci.py tools gh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.26.1'
          cache: false
      - name: Common source fixtures
        run: python3 scripts/ci.py check source
      - name: Concise function and test names
        run: python3 scripts/ci.py check names
      - name: Workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          ACTIONLINT="$(go env GOPATH)/bin/actionlint" python3 scripts/ci.py check workflows
      - name: Script syntax
        run: python3 scripts/ci.py check scripts
      - name: Verify reusable results
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_REUSE_RUN: ${{ inputs.reuse_run }}
        run: python3 scripts/ci_reuse.py prepare
      - name: Reuse evidence
        if: steps.reuse.outputs.proof != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-reuse
          path: .runtime/ci/reuse.json
          if-no-files-found: error
          retention-days: 7

  services:
    name: Pairing service
    needs: source
    if: needs.source.outputs.services == 'true' && needs.source.outputs.reuse_services != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - name: Pairing service
        working-directory: services/pairing-relay
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --ignore-scripts
          python3 ../../scripts/ci.py check services

  lint:
    name: Rust strict lint
    needs: source
    if: >-
      needs.source.outputs.mode == 'full' && (needs.source.outputs.shared == 'true' || needs.source.outputs.desktop == 'true' ||
      needs.source.outputs.host == 'true' || needs.source.outputs.mobile == 'true') && needs.source.outputs.reuse_lint != 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      CHECK_SCOPE: ${{ toJSON(needs.source.outputs) }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # Checks link the runner's OpenSSL instead of compiling the vendored copy; releases stay vendored.
      OPENSSL_NO_VENDOR: '1'
      OPENSSL_STATIC: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: System OpenSSL
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Ghostty build inputs
        id: ghostty
        continue-on-error: true
        uses: ./.github/actions/ghostty-cache
      - name: Native library cache
        if: needs.source.outputs.shared == 'true' || needs.source.outputs.desktop == 'true' || needs.source.outputs.mobile == 'true'
        id: native-cache
        continue-on-error: true
        uses: ./.github/actions/native-cache
        with:
          target: aarch64-apple-darwin
          libraries: speech
      - name: Formatting
        run: python3 scripts/ci.py check format
      - name: Strict lint for selected packages
        run: python3 scripts/ci-run.py -- python3 scripts/ci.py lint
      - name: Desktop without test features
        # Tests enable test-support features; type-check the shipped feature set.
        if: needs.source.outputs.desktop == 'true'
        run: python3 scripts/ci.py check desktop-production
      - name: Host without test features
        # The Linux Host job checks its own shipped feature set; this covers macOS-only code.
        if: needs.source.outputs.host == 'true'
        run: python3 scripts/ci.py check host-production
      - name: Save Ghostty build inputs
        if: github.ref == 'refs/heads/main' && steps.ghostty.outcome == 'success' && steps.ghostty.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ghostty.outputs.path }}
          key: ${{ steps.ghostty.outputs.key }}
      - name: Save native libraries
        if: github.ref == 'refs/heads/main' && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.hit != 'true' && hashFiles('target/sherpa-onnx-prebuilt/**/*') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  build:
    name: Test build
    needs: source
    if: >-
      needs.source.outputs.mode == 'full' && (needs.source.outputs.shared == 'true' || needs.source.outputs.host == 'true' ||
      needs.source.outputs.desktop == 'true') && needs.source.outputs.reuse_build != 'true'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      # The 3-core, 7 GB runner fits three rustc processes, including ~2 GiB test crates.
      CARGO_BUILD_JOBS: '3'
      CHECK_SCOPE: ${{ toJSON(needs.source.outputs) }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # Static linking keeps archived test binaries independent of the test runner's Homebrew.
      OPENSSL_NO_VENDOR: '1'
      OPENSSL_STATIC: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: System OpenSSL
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Tool versions
        run: python3 scripts/ci.py tools zig cargo-nextest
      - name: Fetch locked workspace sources
        id: workspace-sources
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.source-key != '' && steps.rust-cache.outputs.source-hit != 'true'
        run: cargo fetch --locked
      - name: Ghostty build inputs
        id: ghostty
        continue-on-error: true
        uses: ./.github/actions/ghostty-cache
      - name: Native library cache
        id: native-cache
        continue-on-error: true
        uses: ./.github/actions/native-cache
        with:
          target: aarch64-apple-darwin
          libraries: speech
      - name: Compile selected macOS tests once
        run: python3 scripts/ci-run.py -- python3 scripts/ci.py check archive
      - name: Test archive
        # The archive is already zstd-compressed and only serves this run.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: .runtime/ci/tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-build
          path: target/cargo-timings
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage compressed dependency sources
        id: source-archive
        continue-on-error: true
        if: always() && github.ref == 'refs/heads/main' && steps.workspace-sources.outcome == 'success'
        run: python3 scripts/ci.py source-cache save
      - name: Save compressed dependency sources
        id: source-save
        if: always() && github.ref == 'refs/heads/main' && steps.source-archive.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-sources
          key: ${{ steps.rust-cache.outputs.source-key }}
          enableCrossOsArchive: true
      - name: Save Ghostty build inputs
        if: github.ref == 'refs/heads/main' && steps.ghostty.outcome == 'success' && steps.ghostty.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ghostty.outputs.path }}
          key: ${{ steps.ghostty.outputs.key }}
      - name: Save native libraries
        if: github.ref == 'refs/heads/main' && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.hit != 'true' && hashFiles('target/sherpa-onnx-prebuilt/**/*') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  shared:
    name: Shared Node (${{ matrix.partition }}/2)
    needs: [source, build]
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      (needs.build.result == 'success' || needs.source.outputs.reuse_build == 'true') &&
      needs.source.outputs.mode == 'full' && (needs.source.outputs.shared == 'true' || needs.source.outputs.host == 'true') &&
      needs.source.outputs.reuse_shared != 'true'
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.reuse_shared_matrix) }}
    env:
      CHECK_SCOPE: ${{ toJSON(needs.source.outputs) }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Tool versions
        run: python3 scripts/ci.py tools rg cargo-nextest
      - name: Test archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nextest-archive
          path: .runtime/ci
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.reuse_archive_run || github.run_id }}
      - name: Shared and macOS Host contracts
        id: tests
        # Archive settings stay on the steps that run archived binaries.
        env:
          CHECK_ARCHIVE: .runtime/ci/tests.tar.zst
          CHECK_PARTITION: count:${{ matrix.partition }}/2
        run: python3 scripts/ci-run.py -- python3 scripts/ci.py check shared
      - name: Plugin contracts
        if: matrix.partition == 2 && needs.source.outputs.shared == 'true'
        env:
          CHECK_ARCHIVE: .runtime/ci/tests.tar.zst
        run: python3 scripts/ci.py check plugin-contracts
      - name: Isolated database engines
        id: databases
        if: matrix.partition == 1 && needs.source.outputs.shared == 'true'
        env:
          CHECK_ARCHIVE: .runtime/ci/tests.tar.zst
        run: |
          brew install postgresql@17 mysql@8.4
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix mysql@8.4)/bin:$PATH"
          python3 scripts/ci.py check shared-databases
      - name: Flaky tests
        if: always()
        run: >-
          python3 scripts/ci.py flaky "target/nextest/ci/junit.xml=${{ steps.tests.outcome }}"
          "target/nextest/databases/junit.xml=${{ steps.databases.outcome }}"
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-shared-${{ matrix.partition }}
          path: |
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop
    needs: [source, build]
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      (needs.build.result == 'success' || needs.source.outputs.reuse_build == 'true') &&
      needs.source.outputs.mode == 'full' && needs.source.outputs.desktop == 'true' &&
      needs.source.outputs.reuse_desktop != 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Tool versions
        run: python3 scripts/ci.py tools rg cargo-nextest
      - name: Rust dependency sources
        uses: ./.github/actions/rust-cache
      - name: Restore locked source checkouts
        run: cargo fetch --locked --target aarch64-apple-darwin
      - name: Test archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nextest-archive
          path: .runtime/ci
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.reuse_archive_run || github.run_id }}
      - name: Desktop source fixtures
        run: python3 scripts/ci.py check desktop-source
      - name: Desktop logic and service contracts
        id: tests
        # Process isolation permits bounded concurrency without shared global state.
        env:
          CHECK_ARCHIVE: .runtime/ci/tests.tar.zst
        run: python3 scripts/ci.py check desktop
      - name: Desktop process lifecycle
        id: lifecycle
        env:
          CHECK_ARCHIVE: .runtime/ci/tests.tar.zst
        run: python3 scripts/ci.py check desktop-lifecycle
      - name: Flaky tests
        if: always()
        run: >-
          python3 scripts/ci.py flaky "target/nextest/ci/junit.xml=${{ steps.tests.outcome }}"
          "target/nextest/lifecycle/junit.xml=${{ steps.lifecycle.outcome }}"
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-desktop
          path: |
            target/nextest/ci/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  host:
    name: Host
    needs: source
    if: needs.source.outputs.mode == 'full' && needs.source.outputs.host == 'true' && needs.source.outputs.reuse_host != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '4'
      OPENSSL_NO_VENDOR: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = x86_64-unknown-linux-gnu
      - name: Linux build and sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential pkg-config clang libssl-dev ripgrep bubblewrap libx11-dev libxi-dev libxtst-dev
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Process-isolated test runner
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Tool versions
        run: python3 scripts/ci.py tools rg cargo-nextest zig
      - name: Ghostty build inputs
        id: ghostty
        continue-on-error: true
        uses: ./.github/actions/ghostty-cache
      - name: Host source fixtures
        run: python3 scripts/ci.py check host-source
      - name: Host logic and service contracts
        id: tests
        run: python3 scripts/ci.py check host
      - name: Host without test features
        run: python3 scripts/ci.py check host-production
      - name: Flaky tests
        if: always()
        run: python3 scripts/ci.py flaky "target/nextest/ci/junit.xml=${{ steps.tests.outcome }}"
      - name: Save Ghostty build inputs
        if: github.ref == 'refs/heads/main' && steps.ghostty.outcome == 'success' && steps.ghostty.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ghostty.outputs.path }}
          key: ${{ steps.ghostty.outputs.key }}
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-host
          path: |
            target/cargo-timings
            target/nextest/ci/junit.xml
            target/nextest/databases/junit.xml
            target/nextest/lifecycle/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  mobile:
    name: Mobile
    needs: source
    if: needs.source.outputs.mode == 'full' && needs.source.outputs.mobile == 'true' && needs.source.outputs.reuse_mobile != 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Tool versions
        run: python3 scripts/ci.py tools flutter
      - name: Pinned Flutter dependencies
        if: needs.source.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - name: Search prerequisite
        run: brew install ripgrep
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Mobile source fixtures
        if: needs.source.outputs.mobile == 'true'
        run: python3 scripts/ci.py check mobile-source
      - name: Flutter analysis and logic tests
        if: needs.source.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: |
          python3 ../../scripts/ci.py check mobile-format
          python3 ../../scripts/ci.py check mobile-check
      - name: iOS Rust dependency boundary
        if: ${{ !cancelled() && needs.source.outputs.mobile == 'true' }}
        run: |
          rustup target add aarch64-apple-ios
          bash scripts/check-mobile-boundary.sh aarch64-apple-ios sailry-mobile-bridge --dependencies-only
      - name: Unsigned iOS application
        if: ${{ !cancelled() && needs.source.outputs.mobile == 'true' }}
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign --build-name="$(python3 ../../scripts/package/versions.py --apple)"
          git diff --exit-code -- pubspec.lock
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  android:
    name: Mobile Android
    needs: source
    # Linux hosts the Dart FFI fixture: its real Node compiles faster on four cores and frees macOS capacity.
    if: >-
      needs.source.outputs.mode == 'full' && (needs.source.outputs.android == 'true' || needs.source.outputs.mobile_ffi == 'true') &&
      needs.source.outputs.reuse_android != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        if: needs.source.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - name: Android toolchain
        if: needs.source.outputs.android == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.0
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        if: needs.source.outputs.mobile_ffi == 'true'
        with:
          version: '0.16.0'
          use-cache: false
      - name: Android native prerequisites
        if: needs.source.outputs.android == 'true'
        run: |
          printf 'ANDROID_NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          rustup toolchain install
          rustup target add aarch64-linux-android
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
      - name: Dart FFI prerequisites
        if: needs.source.outputs.mobile_ffi == 'true'
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential pkg-config clang libssl-dev ripgrep bubblewrap libx11-dev libxi-dev libxtst-dev
          # Fixtures run private servers under /tmp; Ubuntu's mysqld profile only permits service paths.
          if test -e /etc/apparmor.d/usr.sbin.mysqld; then sudo apparmor_parser --remove /etc/apparmor.d/usr.sbin.mysqld || true; fi
          # The runner image provides PostgreSQL and MySQL; initdb and postgres are not on PATH.
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - name: Tool versions
        run: python3 scripts/ci.py tools flutter rg
      - name: Rust dependency caches
        uses: ./.github/actions/rust-cache
      - name: Ghostty build inputs
        if: needs.source.outputs.mobile_ffi == 'true'
        id: ghostty
        continue-on-error: true
        uses: ./.github/actions/ghostty-cache
      - name: Native library cache
        if: needs.source.outputs.mobile_ffi == 'true'
        id: native-cache
        continue-on-error: true
        uses: ./.github/actions/native-cache
        with:
          target: x86_64-unknown-linux-gnu
          libraries: speech
      - name: Pinned Flutter dependencies
        if: needs.source.outputs.android == 'true'
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: ARM64 release APK
        if: needs.source.outputs.android == 'true'
        working-directory: apps/mobile
        # CI uses a disposable debug certificate; distribution signing is tag-only.
        # Pub setup regenerates release registrants without test-only plugins.
        run: flutter build apk --release --target-platform android-arm64
      - name: Rust boundary and Android initializer
        if: needs.source.outputs.android == 'true'
        env:
          SAILRY_ANDROID_API: '36'
        run: bash scripts/check-mobile-android.sh --apk apps/mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Bundled native libraries
        if: needs.source.outputs.android == 'true'
        run: |
          git diff --exit-code -- apps/mobile/pubspec.lock
          python3 scripts/package/verify-android.py apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --version "$(python3 scripts/package/versions.py)" \
            --code "$(python3 scripts/package/versions.py --android-code)"
      - name: Dart FFI contract fixtures
        if: ${{ !cancelled() && needs.source.outputs.mobile_ffi == 'true' }}
        env:
          OPENSSL_NO_VENDOR: '1'
        run: |
          initdb --version
          mysqld --version
          python3 scripts/ci.py check mobile-contract
      - name: Save Ghostty build inputs
        if: github.ref == 'refs/heads/main' && steps.ghostty.outcome == 'success' && steps.ghostty.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ghostty.outputs.path }}
          key: ${{ steps.ghostty.outputs.key }}
      - name: Save native libraries
        if: github.ref == 'refs/heads/main' && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.hit != 'true' && hashFiles('target/sherpa-onnx-prebuilt/**/*') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}

  light_linux:
    name: Rust lint Linux
    needs: source
    if: needs.source.outputs.light_linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '4'
      CHECK_SCOPE: ${{ toJSON(needs.source.outputs) }}
      OPENSSL_NO_VENDOR: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = x86_64-unknown-linux-gnu
      - name: Linux build prerequisites
        # Source fixtures search with ripgrep, as they do in the test jobs.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential pkg-config clang libssl-dev ripgrep libx11-dev libxi-dev libxtst-dev
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Ghostty build inputs
        continue-on-error: true
        uses: ./.github/actions/ghostty-cache
      - name: Formatting
        run: python3 scripts/ci.py check format
      - name: Host source fixtures
        if: needs.source.outputs.host == 'true'
        run: python3 scripts/ci.py check host-source
      - name: Mobile source fixtures
        if: needs.source.outputs.mobile == 'true'
        run: python3 scripts/ci.py check mobile-source
      - name: Strict lint for Linux packages
        run: python3 scripts/ci-run.py -- python3 scripts/ci.py lint linux
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  light_macos:
    name: Rust lint macOS
    needs: source
    if: needs.source.outputs.light_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      CHECK_SCOPE: ${{ toJSON(needs.source.outputs) }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      OPENSSL_NO_VENDOR: '1'
      OPENSSL_STATIC: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          test "$(rustc -vV | awk '/^host: / {print $2}')" = aarch64-apple-darwin
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: System OpenSSL and search prerequisite
        run: |
          brew install openssl@3 ripgrep
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Rust dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-cache
      - name: Ghostty build inputs
        continue-on-error: true
        uses: ./.github/actions/ghostty-cache
      - name: Native library cache
        id: native-cache
        continue-on-error: true
        uses: ./.github/actions/native-cache
        with:
          target: aarch64-apple-darwin
          libraries: speech
      - name: Desktop source fixtures
        if: needs.source.outputs.desktop == 'true'
        run: python3 scripts/ci.py check desktop-source
      - name: Strict lint for macOS packages
        run: python3 scripts/ci-run.py -- python3 scripts/ci.py lint macos
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 scripts/ci.py cache-usage

  desktop_ready:
    name: Desktop ready
    if: >-
      needs.source.outputs.shared == 'true' && needs.source.outputs.desktop == 'true' &&
      !cancelled() && needs.source.result == 'success' &&
      (needs.lint.result == 'success' || (needs.lint.result == 'skipped' && needs.source.outputs.reuse_lint == 'true')) &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.source.outputs.reuse_build == 'true')) &&
      (needs.shared.result == 'success' || (needs.shared.result == 'skipped' && needs.source.outputs.reuse_shared == 'true')) &&
      (needs.desktop.result == 'success' || (needs.desktop.result == 'skipped' && needs.source.outputs.reuse_desktop == 'true'))
    needs: [source, lint, build, shared, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require product results
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
          CHECK_REUSE_PROOF: ${{ needs.source.outputs.reuse_proof }}
        run: python3 scripts/ci_reuse.py report desktop

  host_ready:
    name: Host ready
    if: >-
      needs.source.outputs.shared == 'true' && needs.source.outputs.host == 'true' &&
      !cancelled() && needs.source.result == 'success' &&
      (needs.lint.result == 'success' || (needs.lint.result == 'skipped' && needs.source.outputs.reuse_lint == 'true')) &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.source.outputs.reuse_build == 'true')) &&
      (needs.shared.result == 'success' || (needs.shared.result == 'skipped' && needs.source.outputs.reuse_shared == 'true')) &&
      (needs.host.result == 'success' || (needs.host.result == 'skipped' && needs.source.outputs.reuse_host == 'true'))
    needs: [source, lint, build, shared, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require product results
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
          CHECK_REUSE_PROOF: ${{ needs.source.outputs.reuse_proof }}
        run: python3 scripts/ci_reuse.py report host

  mobile_ready:
    name: Mobile ready
    if: >-
      needs.source.outputs.shared == 'true' && needs.source.outputs.mobile == 'true' && needs.source.outputs.mobile_ffi == 'true' && needs.source.outputs.android == 'true' &&
      !cancelled() && needs.source.result == 'success' &&
      (needs.lint.result == 'success' || (needs.lint.result == 'skipped' && needs.source.outputs.reuse_lint == 'true')) &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.source.outputs.reuse_build == 'true')) &&
      (needs.shared.result == 'success' || (needs.shared.result == 'skipped' && needs.source.outputs.reuse_shared == 'true')) &&
      (needs.mobile.result == 'success' || (needs.mobile.result == 'skipped' && needs.source.outputs.reuse_mobile == 'true')) &&
      (needs.android.result == 'success' || (needs.android.result == 'skipped' && needs.source.outputs.reuse_android == 'true'))
    needs: [source, lint, build, shared, mobile, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require product results
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
          CHECK_REUSE_PROOF: ${{ needs.source.outputs.reuse_proof }}
        run: python3 scripts/ci_reuse.py report mobile

  checks:
    name: Checks passed
    if: ${{ !cancelled() }}
    needs: [source, lint, build, shared, desktop, host, mobile, android, services, light_linux, light_macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require selected results
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
          CHECK_REUSE_PROOF: ${{ needs.source.outputs.reuse_proof }}
        run: python3 scripts/ci_reuse.py report
