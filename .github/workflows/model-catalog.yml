name: Model metadata

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-catalog
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.27.3
  CGO_ENABLED: '0'

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GO_CACHE_ROLE: lint
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/go-cache
        id: go-cache
      - name: Refresh and validate the bundled catalog
        id: refresh
        run: |
          set -euo pipefail
          unset GOROOT
          path=internal/node/providers/data/model-catalog.json
          go run ./cmd/update-model-catalog
          if git diff --quiet -- "$path"; then
            echo 'Bundled model catalog is unchanged'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go test ./cmd/update-model-catalog ./internal/node/providers
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Commit changed metadata
        if: steps.refresh.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          path=internal/node/providers/data/model-catalog.json
          git add -- "$path"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh bundled model metadata'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
