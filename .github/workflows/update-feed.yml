name: Published update catalog

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact published tag with complete signed Desktop assets; run from main'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: published-update-catalog-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify release and publish its signed catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-release.py
            /scripts/publish-update-feed.py
            /scripts/package/publication.py
            /scripts/package/versions.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Verify the published tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          python3 .workflow-tools/scripts/check-release.py --source "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --published \
            --event "$RUNNER_TEMP/published-release.json"
      - name: Download published updater assets
        id: canonical
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .workflow-tools/scripts/publish-update-feed.py --download \
            --source "$GITHUB_WORKSPACE" --assets "$RUNNER_TEMP/update-assets" \
            --event "$RUNNER_TEMP/published-release.json" --repository "$GITHUB_REPOSITORY"
      - name: Build pinned release producer
        if: steps.canonical.outputs.ready == 'true'
        run: cargo build --locked --release -p sailry-release
      - name: Publish signed catalog to the exact release
        if: steps.canonical.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SAILRY_UPDATE_SIGNING_KEY: ${{ secrets.SAILRY_UPDATE_SIGNING_KEY }}
        run: |
          python3 .workflow-tools/scripts/publish-update-feed.py \
            --source "$GITHUB_WORKSPACE" \
            --assets "$RUNNER_TEMP/update-assets" \
            --binary target/release/sailry-release \
            --event "$RUNNER_TEMP/published-release.json" \
            --keys release/update-public-keys.txt \
            --repository "$GITHUB_REPOSITORY" \
            --stage "$RUNNER_TEMP/update-feed"
