name: Release Host

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact version tag to build; run this workflow from main'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: host-release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  version:
    name: Verify Host readiness and published tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - name: Require a matching version tag and Host gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          python3 .workflow-tools/scripts/check-release.py --source "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --component host --published

  build:
    name: macOS Host ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            jobs: 1
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            jobs: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Verify target and release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$RELEASE_TAG"
      - name: Rust dependency caches
        uses: ./.workflow-tools/.github/actions/rust-cache
      - name: Native library cache
        id: native-cache
        continue-on-error: true
        uses: ./.workflow-tools/.github/actions/native-cache
        with:
          target: ${{ matrix.target }}
      - name: Verify distribution signing configuration
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import os
          names = ('APPLE_CERTIFICATE_P12', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_API_PRIVATE_KEY',
                   'APPLE_SIGNING_IDENTITY', 'APPLE_TEAM_ID', 'APPLE_API_KEY_ID',
                   'APPLE_API_ISSUER_ID')
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('The macOS distribution signing configuration is incomplete')
          PY
      - name: Build prerequisites
        run: |
          brew install llvm@21 ripgrep
      - name: Build native Host
        env:
          # Preserve line tables before packaging strips its copied executable.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          SAILRY_SENTRY_DSN: ${{ secrets.SAILRY_SENTRY_DSN }}
          SAILRY_TELEMETRY_KEY: ${{ secrets.SAILRY_TELEMETRY_KEY }}
        run: |
          python3 .workflow-tools/scripts/ci-run.py --parsers -- cargo build --locked --release --timings -p sailry-host
      - name: Collect Host debug symbols
        id: symbols
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python3 .workflow-tools/scripts/package/debug-symbols.py collect \
            --binary target/release/sailry-host --target "$PACKAGE_TARGET" \
            --output "target/debug-symbols/host/$PACKAGE_TARGET"
      - name: Preserve Host debug symbols
        if: always() && steps.symbols.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-host-${{ matrix.target }}
          path: target/debug-symbols/host/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload Host debug symbols
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
        run: |
          python3 .workflow-tools/scripts/package/debug-symbols.py upload \
            --symbols "target/debug-symbols/host/$PACKAGE_TARGET"
      - name: Save native libraries
        if: github.ref == 'refs/heads/main' && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.hit != 'true' && hashFiles('target/sherpa-onnx-prebuilt/**/*') != '' && hashFiles('target/llama-prebuilt/**/*') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/sherpa-onnx-prebuilt
            target/llama-prebuilt
          key: ${{ steps.native-cache.outputs.key }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 .workflow-tools/scripts/ci.py cache-usage
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Import signing credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: python3 .workflow-tools/scripts/package/signing-credentials.py install
      - name: Sign, notarize and package
        id: package
        env:
          SAILRY_SIGNING: developer-id
          SAILRY_NOTARIZE: '1'
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          bash scripts/package-macos.sh release host | tee "$RUNNER_TEMP/package.log"
          task_package="$(sed -n 's/^Local package: //p' "$RUNNER_TEMP/package.log")"
          test -d "$task_package"
          (
            cd "$task_package"
            shasum -a 256 ./*.tar.gz > "SHA256SUMS-${{ matrix.target }}"
            rm SHA256SUMS
          )
          printf 'directory=%s\n' "$task_package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-macos-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.directory }}/*.tar.gz
            ${{ steps.package.outputs.directory }}/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        run: python3 .workflow-tools/scripts/package/signing-credentials.py cleanup

  host:
    name: Linux Host ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Rust dependency caches
        uses: ./.workflow-tools/.github/actions/rust-cache
      - name: Linux native build tools
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/host-sysroots
            target/tooling
          key: host-tools-v1-zigbuild-0.23.4-${{ matrix.target }}-${{ hashFiles('scripts/package/linux-sysroot.lock.json', 'scripts/package/linux-sysroot.py') }}
      - name: Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes llvm pkg-config ripgrep jq libx11-6 libxi6
          rustup target add '${{ matrix.target }}'
          if ! test -x target/tooling/bin/cargo-zigbuild; then
            cargo install cargo-zigbuild --version 0.23.4 --locked --root target/tooling
          fi
      - name: Build one Host architecture
        env:
          # Retain line tables in the original binary for separate symbol artifacts.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          SAILRY_SENTRY_DSN: ${{ secrets.SAILRY_SENTRY_DSN }}
          SAILRY_TELEMETRY_KEY: ${{ secrets.SAILRY_TELEMETRY_KEY }}
        run: python3 .workflow-tools/scripts/ci-run.py -- bash scripts/build-host.sh release '${{ matrix.target }}'
      - name: Collect Host debug symbols
        id: symbols
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python3 .workflow-tools/scripts/package/debug-symbols.py collect \
            --binary "target/$PACKAGE_TARGET/release/sailry-host" --target "$PACKAGE_TARGET" \
            --output "target/debug-symbols/host/$PACKAGE_TARGET"
      - name: Preserve Host debug symbols
        if: always() && steps.symbols.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-host-${{ matrix.target }}
          path: target/debug-symbols/host/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload Host debug symbols
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
        run: |
          python3 .workflow-tools/scripts/package/debug-symbols.py upload \
            --symbols "target/debug-symbols/host/$PACKAGE_TARGET"
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 .workflow-tools/scripts/ci.py cache-usage
      - name: Verify headless startup and shutdown
        run: python3 scripts/check-host.py 'target/host-artifacts/${{ matrix.target }}/sailry-host'
      - name: Package standalone Host
        id: package
        run: |
          set -o pipefail
          bash scripts/package-host.sh release '${{ matrix.target }}' | tee "$RUNNER_TEMP/host-package.log"
          task_package="$(sed -n 's/^Host package: //p' "$RUNNER_TEMP/host-package.log")"
          test -d "$task_package"
          printf 'directory=%s\n' "$task_package" >> "$GITHUB_OUTPUT"
      - name: Verify installation and systemd lifecycle
        run: sudo python3 scripts/check-host-install.py '${{ steps.package.outputs.directory }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.directory }}/*.tar.gz
            ${{ steps.package.outputs.directory }}/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Append Host assets to the published release
    needs: [build, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: host-*
          path: packages
          merge-multiple: true
      - name: Verify Host archives and append installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS-*)
          cp scripts/install-host.sh packages/install-host.sh
          (cd packages && sha256sum install-host.sh > SHA256SUMS-installer)
          python3 .workflow-tools/scripts/publish-packages.py --source "$GITHUB_WORKSPACE" --component host --tag "$RELEASE_TAG" --directory packages
