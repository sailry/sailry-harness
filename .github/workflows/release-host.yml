name: Release Host

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact version tag to build; run this workflow from main'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: host-release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  version:
    name: Verify Host readiness and published tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/rust-cache/
            /scripts/ci.py
            /scripts/ci-run.py
            /scripts/check-release.py
            /scripts/package/publication.py
            /scripts/package/versions.py
      - name: Require a matching version tag and Host gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          python3 .workflow-tools/scripts/check-release.py --source "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --component host --published

  build:
    name: macOS Host ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            jobs: 1
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            jobs: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/rust-cache/
            /scripts/ci.py
            /scripts/ci-run.py
            /scripts/check-release.py
            /scripts/package/publication.py
            /scripts/package/versions.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Verify target and release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$RELEASE_TAG"
      - name: Rust dependency caches
        uses: ./.workflow-tools/.github/actions/rust-cache
      - name: Speech cache identity
        id: speech-key
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/ci.py speech-key "$PACKAGE_TARGET" shared
      - name: Speech native libraries
        id: speech-cache
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Verify distribution signing configuration
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import os
          names = ('APPLE_CERTIFICATE_P12', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_API_PRIVATE_KEY',
                   'APPLE_SIGNING_IDENTITY', 'APPLE_TEAM_ID', 'APPLE_API_KEY_ID',
                   'APPLE_API_ISSUER_ID')
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('The macOS distribution signing configuration is incomplete')
          PY
      - name: Build prerequisites
        run: |
          brew install llvm@21 ripgrep
      - name: Host packaging fixtures
        run: |
          python3 scripts/ci.py fixtures shared
          python3 scripts/ci.py fixtures host
      - name: Build native Host
        run: |
          python3 .workflow-tools/scripts/ci-run.py -- cargo build --locked --release --timings -p sailry-host
      - name: Save speech native libraries
        if: always() && steps.speech-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 .workflow-tools/scripts/ci.py cache-usage
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Import signing credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, subprocess, uuid
          names = ('APPLE_CERTIFICATE_P12', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_API_PRIVATE_KEY')
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('The macOS signing secrets are not configured')
          stage = pathlib.Path(os.environ['RUNNER_TEMP'])
          certificate = stage / 'sailry-signing.p12'
          key = stage / 'sailry-notary.p8'
          certificate.write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE_P12'], validate=True))
          key.write_text(os.environ['APPLE_API_PRIVATE_KEY'])
          certificate.chmod(0o600)
          key.chmod(0o600)
          keychain = stage / 'sailry-signing.keychain-db'
          password = uuid.uuid4().hex
          def security(*args):
              result = subprocess.run(['security', *map(str, args)], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit('Temporary signing keychain setup failed')
          security('create-keychain', '-p', password, keychain)
          security('set-keychain-settings', '-lut', '21600', keychain)
          security('unlock-keychain', '-p', password, keychain)
          security('import', certificate, '-k', keychain, '-P', os.environ['APPLE_CERTIFICATE_PASSWORD'], '-T', '/usr/bin/codesign')
          security('set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', password, keychain)
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write(f'APPLE_SIGNING_KEYCHAIN={keychain}\nAPPLE_API_KEY_PATH={key}\n')
          certificate.unlink()
          PY
      - name: Sign, notarize and package
        id: package
        env:
          SAILRY_SIGNING: developer-id
          SAILRY_NOTARIZE: '1'
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          bash scripts/package-macos.sh release host | tee "$RUNNER_TEMP/package.log"
          task_package="$(sed -n 's/^Local package: //p' "$RUNNER_TEMP/package.log")"
          test -d "$task_package"
          (
            cd "$task_package"
            shasum -a 256 ./*.tar.gz > "SHA256SUMS-${{ matrix.target }}"
            rm SHA256SUMS
          )
          printf 'directory=%s\n' "$task_package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-macos-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.directory }}/*.tar.gz
            ${{ steps.package.outputs.directory }}/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          stage = pathlib.Path(os.environ['RUNNER_TEMP'])
          keychain = stage / 'sailry-signing.keychain-db'
          if keychain.exists():
              subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
          for name in ('sailry-signing.p12', 'sailry-notary.p8'):
              (stage / name).unlink(missing_ok=True)
          PY

  host:
    name: Linux Host ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/rust-cache/
            /scripts/ci.py
            /scripts/ci-run.py
            /scripts/check-release.py
            /scripts/package/publication.py
            /scripts/package/versions.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Rust dependency caches
        uses: ./.workflow-tools/.github/actions/rust-cache
      - name: Linux native build tools
        continue-on-error: true
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/host-sysroots
            target/tooling
          key: host-tools-v1-zigbuild-0.23.4-${{ matrix.target }}-${{ hashFiles('scripts/package/linux-sysroot.lock.json', 'scripts/package/linux-sysroot.py') }}
      - name: Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes llvm pkg-config ripgrep jq libx11-6 libxi6
          rustup target add '${{ matrix.target }}'
          if ! test -x target/tooling/bin/cargo-zigbuild; then
            cargo install cargo-zigbuild --version 0.23.4 --locked --root target/tooling
          fi
      - name: Build one Host architecture
        run: python3 .workflow-tools/scripts/ci-run.py -- bash scripts/build-host.sh release '${{ matrix.target }}'
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 .workflow-tools/scripts/ci.py cache-usage
      - name: Verify headless startup and shutdown
        run: python3 scripts/check-host.py 'target/host-artifacts/${{ matrix.target }}/sailry-host'
      - name: Package standalone Host
        id: package
        run: |
          set -o pipefail
          bash scripts/package-host.sh release '${{ matrix.target }}' | tee "$RUNNER_TEMP/host-package.log"
          task_package="$(sed -n 's/^Host package: //p' "$RUNNER_TEMP/host-package.log")"
          test -d "$task_package"
          printf 'directory=%s\n' "$task_package" >> "$GITHUB_OUTPUT"
      - name: Verify installation and systemd lifecycle
        run: sudo python3 scripts/check-host-install.py '${{ steps.package.outputs.directory }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.directory }}/*.tar.gz
            ${{ steps.package.outputs.directory }}/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Append Host assets to the published release
    needs: [build, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/rust-cache/
            /scripts/ci.py
            /scripts/ci-run.py
            /scripts/check-release.py
            /scripts/package/publication.py
            /scripts/package/versions.py
            /scripts/publish-packages.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: host-*
          path: packages
          merge-multiple: true
      - name: Verify Host archives and append installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS-*)
          cp scripts/install-host.sh packages/install-host.sh
          (cd packages && sha256sum install-host.sh > SHA256SUMS-installer)
          python3 .workflow-tools/scripts/publish-packages.py --source "$GITHUB_WORKSPACE" --component host --tag "$RELEASE_TAG" --directory packages
