name: Release changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact published version tag'
        type: string
        required: true
      notify_website:
        description: 'Notify the website after formal Desktop publication'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-changelog
  cancel-in-progress: false

jobs:
  update:
    name: Record published release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Verify the published tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 scripts/check-release.py --tag "$RELEASE_TAG" --published \
            --event "$RUNNER_TEMP/published-release.json"
      - name: Update changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          branch = subprocess.check_output(['gh', 'api', f'repos/{repo}', '--jq', '.default_branch'], text=True).strip()
          current = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/contents/CHANGELOG.md?ref={branch}']))
          original = base64.b64decode(current['content'])
          pathlib.Path('CHANGELOG.md').write_bytes(original)
          stage = pathlib.Path(os.environ['RUNNER_TEMP'])
          (stage / 'changelog-original.md').write_bytes(original)
          (stage / 'changelog-sha').write_text(current['sha'])
          PY
          python3 scripts/release-notes.py --tag "$RELEASE_TAG" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/release-notes.md" --changelog CHANGELOG.md
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = pathlib.Path(os.environ['RUNNER_TEMP'])
          content = pathlib.Path('CHANGELOG.md').read_bytes()
          if content == (stage / 'changelog-original.md').read_bytes():
              print('CHANGELOG.md already contains this release')
              raise SystemExit(0)
          payload = {'message': f"docs: update changelog for {os.environ['RELEASE_TAG']}",
                     'sha': (stage / 'changelog-sha').read_text(),
                     'content': base64.b64encode(content).decode()}
          result = subprocess.run(['gh', 'api', '--method', 'PUT', f'repos/{repo}/contents/CHANGELOG.md', '--input', '-'],
                                  input=json.dumps(payload), capture_output=True, text=True)
          if result.returncode:
              raise SystemExit('Updating CHANGELOG.md failed; inspect the workflow before retrying')
          print('CHANGELOG.md updated on the default branch')
          PY
      - name: Notify website
        if: github.event_name == 'workflow_dispatch' && inputs.notify_website && steps.changelog.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          token = os.environ.get('WEBSITE_DISPATCH_TOKEN')
          if not token:
              raise SystemExit('WEBSITE_DISPATCH_TOKEN is required to notify the website')
          repo = os.environ['GITHUB_REPOSITORY']
          sha = subprocess.check_output(['gh', 'api', f'repos/{repo}/git/ref/heads/main',
                                         '--jq', '.object.sha'], text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Resolving main returned an invalid commit SHA')
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/sailry/sailry-website/dispatches',
                          '-f', 'event_type=harness-docs-updated', '-f', f'client_payload[sha]={sha}'],
                         env={**os.environ, 'GH_TOKEN': token}, check=True)
          PY
