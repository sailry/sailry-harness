name: Formal Desktop signing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact published product tag'
        type: string
        required: true
      source_sha:
        description: 'Exact product commit checked out by the producer'
        type: string
        required: true
      producer_run:
        description: 'Initial Desktop publication workflow run'
        type: string
        required: true
      producer_revision:
        description: 'Workflow revision used by that producer'
        type: string
        required: true
      artifacts:
        description: 'Exact native target, artifact ID and digest records'
        type: string
        required: true
      signed_arm_from:
        description: 'Original same-source signed ARM producer, when preserving its files'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-formal-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  version:
    name: Verify published version and native producer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.producer.outputs.matrix }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - name: Require the published exact tag and product gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 .workflow-tools/scripts/check-release.py --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --component desktop --published
      - name: Verify original native artifact identities
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_REVISION: ${{ inputs.producer_revision }}
          PRODUCT_SOURCE: ${{ inputs.source_sha }}
          NATIVE_ARTIFACTS: ${{ inputs.artifacts }}
          SIGNED_ARM_FROM: ${{ inputs.signed_arm_from }}
        run: |
          arguments=()
          if test -n "$SIGNED_ARM_FROM"; then arguments+=(--signed-arm); fi
          python3 .workflow-tools/scripts/desktop-build.py select --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --run "$PRODUCER_RUN" --revision "$PRODUCER_REVISION" \
            --source-sha "$PRODUCT_SOURCE" --artifacts "$NATIVE_ARTIFACTS" "${arguments[@]}"

  sign:
    name: Sign Desktop ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Verify target and release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$RELEASE_TAG"
      - name: Packaging prerequisites
        run: brew install ripgrep jq
      - name: Restore compiled Desktop
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          PACKAGE_TARGET: ${{ matrix.target }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_REVISION: ${{ inputs.producer_revision }}
          PRODUCT_SOURCE: ${{ inputs.source_sha }}
          NATIVE_ARTIFACT: ${{ matrix.id }}
          NATIVE_DIGEST: ${{ matrix.digest }}
        run: |
          python3 .workflow-tools/scripts/desktop-build.py restore --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --target "$PACKAGE_TARGET" \
            --run "$PRODUCER_RUN" --revision "$PRODUCER_REVISION" --source-sha "$PRODUCT_SOURCE" \
            --artifact-id "$NATIVE_ARTIFACT" --artifact-digest "$NATIVE_DIGEST"
      - name: Recover signed ARM packages
        if: inputs.signed_arm_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_INTEL_FROM: ${{ inputs.signed_arm_from }}
        run: |
          python3 .workflow-tools/scripts/recover-desktop.py --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --run "$RESUME_INTEL_FROM" \
            --directory "$RUNNER_TEMP/recovered-arm" --binary target/release/sailry-release
      - name: Preserve recovered ARM packages
        if: inputs.signed_arm_from != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-aarch64-apple-darwin
          path: ${{ runner.temp }}/recovered-arm/*
          if-no-files-found: error
          retention-days: 14
      - name: Use workflow notarization helper
        run: |
          python3 - <<'PYTHON'
          import shutil, subprocess
          product = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tooling = subprocess.check_output(['git', '-C', '.workflow-tools', 'rev-parse', 'HEAD'], text=True).strip()
          print(f'Product source: {product}; packaging helper source: {tooling}')
          shutil.copyfile('.workflow-tools/scripts/package/notarize-macos.py', 'scripts/package/notarize-macos.py')
          PYTHON
      - name: Import signing credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: python3 .workflow-tools/scripts/package/signing-credentials.py install
      - name: Sign, notarize and package
        id: package
        env:
          SAILRY_SIGNING: developer-id
          SAILRY_NOTARIZE: '1'
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          SAILRY_UPDATE_SIGNING_KEY: ${{ secrets.SAILRY_UPDATE_SIGNING_KEY }}
          SAILRY_RELEASE_REPOSITORY: ${{ github.repository }}
          SAILRY_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SAILRY_RELEASE_TOOL: target/release/sailry-release
        run: |
          set -o pipefail
          bash scripts/package-macos.sh release desktop | tee "$RUNNER_TEMP/package.log"
          task_package="$(sed -n 's/^Local package: //p' "$RUNNER_TEMP/package.log")"
          test -d "$task_package"
          (
            cd "$task_package"
            shasum -a 256 ./*.dmg ./*.zip ./*.zip.update.json > "SHA256SUMS-desktop-${{ matrix.target }}"
            rm SHA256SUMS
          )
          printf 'directory=%s\n' "$task_package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.directory }}/*.zip
            ${{ steps.package.outputs.directory }}/*.zip.update.json
            ${{ steps.package.outputs.directory }}/*.dmg
            ${{ steps.package.outputs.directory }}/SHA256SUMS-desktop-*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        run: python3 .workflow-tools/scripts/package/signing-credentials.py cleanup

  publish:
    name: Append formally signed Desktop packages
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Verify archives and publish Desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS-desktop-*)
          python3 scripts/release-notes.py --tag "$RELEASE_TAG" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/release-notes.md" --changelog CHANGELOG.md
          python3 .workflow-tools/scripts/publish-packages.py --source "$GITHUB_WORKSPACE" --component desktop --append-signed --tag "$RELEASE_TAG" \
            --notes "$RUNNER_TEMP/release-notes.md" --directory packages
      - name: Publish signed update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-feed.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$RELEASE_TAG"
