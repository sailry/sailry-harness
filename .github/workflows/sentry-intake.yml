name: Sentry intake

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sentry-intake
  cancel-in-progress: false

jobs:
  poll:
    if: >-
      vars.SENTRY_INTAKE_ENABLED == 'true' && github.repository == 'sailry/sailry-harness' &&
      github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Keep SENTRY_READ_TOKEN only in this environment, restricted to the default branch.
    environment: sentry-intake
    permissions:
      contents: read
    outputs:
      candidates: ${{ steps.poll.outputs.candidates }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/sentry_intake.py
          sparse-checkout-cone-mode: false
      - id: poll
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_ID: ${{ vars.SENTRY_PROJECT_ID }}
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
        run: python3 -I .github/scripts/sentry_intake.py

  handoff:
    needs: poll
    if: github.run_attempt == '1' && needs.poll.outputs.candidates != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.poll.outputs.candidates) }}
    steps:
      # Reserve the group/revision before dispatch. An uncertain request is not retried.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: previous
        with:
          lookup-only: true
          path: sentry-intake-claim
          key: sentry-intake-v1-${{ matrix.candidate.fingerprint }}-${{ matrix.candidate.target }}
      - if: steps.previous.outputs.cache-hit != 'true'
        run: printf '%s\n' "$GITHUB_RUN_ID" > sentry-intake-claim
      - if: steps.previous.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: sentry-intake-claim
          key: sentry-intake-v1-${{ matrix.candidate.fingerprint }}-${{ matrix.candidate.target }}
      - if: steps.previous.outputs.cache-hit != 'true'
        run: rm sentry-intake-claim
      - if: steps.previous.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: reservation
        with:
          path: sentry-intake-claim
          key: sentry-intake-v1-${{ matrix.candidate.fingerprint }}-${{ matrix.candidate.target }}
      - name: Run reviewed verifier on the default branch
        if: steps.previous.outputs.cache-hit != 'true'
        env:
          RESERVED: ${{ steps.reservation.outputs.cache-hit }}
          INPUTS: ${{ toJSON(matrix.candidate) }}
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RESERVED" = true
          printf '%s\n' "$GITHUB_RUN_ID" | cmp -s - sentry-intake-claim
          body=$(jq -cn --arg ref "$BRANCH" --argjson inputs "$INPUTS" '{ref:$ref,inputs:$inputs}')
          status=$(curl -q --silent --proto '=https' --max-time 20 --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' -H 'X-GitHub-Api-Version: 2022-11-28' --data-binary "$body" \
            https://api.github.com/repos/sailry/sailry-harness/actions/workflows/sentry-repair.yml/dispatches)
          case "$status" in 200|204) ;; *) echo 'Dispatch not confirmed; inspect the workflow history.' >&2; exit 1 ;; esac
