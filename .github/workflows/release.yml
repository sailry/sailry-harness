name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  build:
    name: Signed ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Verify target and release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$GITHUB_REF_NAME"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/host-cross
            target/host-sysroots
            target/tooling
            target/office-runtimes
          key: packages-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/node-runtime/src/office/runtime/requirements.lock', 'scripts/package/linux-sysroot.lock.json') }}-${{ github.sha }}
          restore-keys: |
            packages-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/node-runtime/src/office/runtime/requirements.lock', 'scripts/package/linux-sysroot.lock.json') }}-
      - name: Build prerequisites
        run: |
          brew install llvm@21 ripgrep
          python3 -m pip install --disable-pip-version-check uv==0.10.9
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          if ! test -x target/tooling/bin/cargo-zigbuild; then
            cargo install cargo-zigbuild --version 0.23.4 --locked --root target/tooling
          fi
      - name: Packaging fixtures
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build Desktop and bundled Hosts
        run: |
          cargo build --locked --release -p sailry-desktop -p sailry-host
          bash scripts/build-hosts.sh release
      - name: Import signing credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, subprocess, uuid
          names = ('APPLE_CERTIFICATE_P12', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_API_PRIVATE_KEY')
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('The macOS signing secrets are not configured')
          stage = pathlib.Path(os.environ['RUNNER_TEMP'])
          certificate = stage / 'sailry-signing.p12'
          key = stage / 'sailry-notary.p8'
          certificate.write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE_P12'], validate=True))
          key.write_text(os.environ['APPLE_API_PRIVATE_KEY'])
          certificate.chmod(0o600)
          key.chmod(0o600)
          keychain = stage / 'sailry-signing.keychain-db'
          password = uuid.uuid4().hex
          def security(*args):
              result = subprocess.run(['security', *map(str, args)], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit('Temporary signing keychain setup failed')
          security('create-keychain', '-p', password, keychain)
          security('set-keychain-settings', '-lut', '21600', keychain)
          security('unlock-keychain', '-p', password, keychain)
          security('import', certificate, '-k', keychain, '-P', os.environ['APPLE_CERTIFICATE_PASSWORD'], '-T', '/usr/bin/codesign')
          security('set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', password, keychain)
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write(f'APPLE_SIGNING_KEYCHAIN={keychain}\nAPPLE_API_KEY_PATH={key}\n')
          certificate.unlink()
          PY
      - name: Sign, notarize and package
        id: package
        env:
          SAILRY_SIGNING: developer-id
          SAILRY_NOTARIZE: '1'
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          bash scripts/package-macos.sh release | tee "$RUNNER_TEMP/package.log"
          task_package="$(sed -n 's/^Local package: //p' "$RUNNER_TEMP/package.log")"
          test -d "$task_package"
          mv "$task_package/SHA256SUMS" "$task_package/SHA256SUMS-${{ matrix.target }}"
          printf 'directory=%s\n' "$task_package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.directory }}/*.zip
            ${{ steps.package.outputs.directory }}/*.tar.gz
            ${{ steps.package.outputs.directory }}/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          stage = pathlib.Path(os.environ['RUNNER_TEMP'])
          keychain = stage / 'sailry-signing.keychain-db'
          if keychain.exists():
              subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
          for name in ('sailry-signing.p12', 'sailry-notary.p8'):
              (stage / name).unlink(missing_ok=True)
          PY

  android:
    name: Signed Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify release version
        run: python3 scripts/package/versions.py --tag "$GITHUB_REF_NAME"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.7'
          channel: stable
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.0
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Native prerequisites
        run: |
          printf 'ANDROID_NDK_HOME=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: packages-android-arm64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/mobile/pubspec.lock') }}
      - name: Pinned Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Rust dependency boundary
        run: bash scripts/check-mobile-boundary.sh aarch64-linux-android sailry-mobile-bridge
      - name: Import signing credential
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('ANDROID_KEYSTORE_BASE64')
          if not value:
              raise SystemExit('The Android release signing secret is not configured')
          keystore = pathlib.Path(os.environ['RUNNER_TEMP'], 'sailry-android.p12')
          keystore.write_bytes(base64.b64decode(value, validate=True))
          keystore.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write(f'ANDROID_KEYSTORE_PATH={keystore}\n')
          PY
      - name: Distribution APK
        working-directory: apps/mobile
        env:
          SAILRY_ANDROID_RELEASE: '1'
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Pub setup regenerates native registrants for release, excluding test-only plugins.
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify and package APK
        id: package
        env:
          ANDROID_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_SHA256 }}
        run: |
          test -n "$ANDROID_SIGNING_SHA256"
          git diff --exit-code -- apps/mobile/pubspec.lock
          task_version="$(python3 scripts/package/versions.py --tag "$GITHUB_REF_NAME")"
          python3 scripts/package/verify-android.py apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --version "$task_version" --code "$(python3 scripts/package/versions.py --android-code)" \
            --certificate "$ANDROID_SIGNING_SHA256"
          mkdir -p dist
          task_output="$(mktemp -d dist/android-release-XXXXXX)"
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "$task_output/Sailry-$task_version-android-arm64.apk"
          (cd "$task_output" && sha256sum ./*.apk > SHA256SUMS-android-arm64)
          printf 'directory=%s\n' "$task_output" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-android-arm64
          path: |
            ${{ steps.package.outputs.directory }}/*.apk
            ${{ steps.package.outputs.directory }}/SHA256SUMS-*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credential
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'sailry-android.p12').unlink(missing_ok=True)
          PY

  publish:
    name: GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Verify archives and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS-*)
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          branch = subprocess.check_output(['gh', 'api', f'repos/{repo}', '--jq', '.default_branch'], text=True).strip()
          current = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/contents/CHANGELOG.md?ref={branch}']))
          pathlib.Path('CHANGELOG.md').write_bytes(base64.b64decode(current['content']))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'changelog-sha').write_text(current['sha'])
          PY
          python3 scripts/release-notes.py --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/release-notes.md" --changelog CHANGELOG.md
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts/package')
          import versions
          tag = os.environ['GITHUB_REF_NAME']
          assets = sorted(str(file) for file in pathlib.Path('packages').iterdir() if file.is_file())
          subprocess.run(['gh', 'release', 'create', tag, *assets, '--verify-tag',
                          '--title', f'Sailry Harness {tag[1:]}',
                          '--notes-file', str(pathlib.Path(os.environ['RUNNER_TEMP'], 'release-notes.md')),
                          *versions.release_flags(tag[1:])], check=True)
          PY
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = pathlib.Path(os.environ['RUNNER_TEMP'])
          payload = {'message': f"docs: update changelog for {os.environ['GITHUB_REF_NAME']}",
                     'sha': (stage / 'changelog-sha').read_text(),
                     'content': base64.b64encode(pathlib.Path('CHANGELOG.md').read_bytes()).decode()}
          result = subprocess.run(['gh', 'api', '--method', 'PUT', f'repos/{repo}/contents/CHANGELOG.md', '--input', '-'],
                                  input=json.dumps(payload), capture_output=True, text=True)
          if result.returncode:
              raise SystemExit('Release published, but updating CHANGELOG.md failed; inspect the workflow before retrying')
          print('CHANGELOG.md updated on the default branch')
          PY
