name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact version tag to build; run this workflow from main'
        type: string
        required: true
      resume_intel_from:
        description: 'Reuse signed ARM packages from this exact-source run and rebuild only Intel'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  dispatch:
    name: Queue exact-tag build on main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch reusable release cache scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$RELEASE_TAG"

  version:
    if: github.event_name != 'push'
    name: Verify Desktop readiness and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/rust-cache/
            /scripts/ci.py
            /scripts/ci-run.py
            /scripts/check-release.py
            /scripts/package/publication.py
            /scripts/package/versions.py
            /scripts/recover-desktop.py
      - name: Require a matching version tag and Desktop gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          python3 .workflow-tools/scripts/check-release.py --source "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --component desktop --wait-ready
      - name: Select native producers
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          targets = [
              {'runner': 'macos-15', 'target': 'aarch64-apple-darwin', 'jobs': 1},
              {'runner': 'macos-15-intel', 'target': 'x86_64-apple-darwin', 'jobs': 2},
          ]
          if os.environ['RESUME_INTEL_FROM']:
              subprocess.run(['python3', '.workflow-tools/scripts/recover-desktop.py',
                              '--source', os.environ['GITHUB_WORKSPACE'], '--tag', os.environ['RELEASE_TAG'],
                              '--run', os.environ['RESUME_INTEL_FROM']], check=True)
              targets = targets[1:]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': targets}) + '\n')
          PYTHON

  build:
    name: Build Desktop ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix || '{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","jobs":1},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","jobs":2}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/rust-cache/
            /scripts/ci.py
            /scripts/ci-run.py
            /scripts/check-release.py
            /scripts/package/publication.py
            /scripts/package/versions.py
            /scripts/recover-desktop.py
            /scripts/desktop-build.py
            /scripts/package/notarize-macos.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Verify target and release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$RELEASE_TAG"
      - name: Rust dependency caches
        uses: ./.workflow-tools/.github/actions/rust-cache
      - name: Speech cache identity
        id: speech-key
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/ci.py speech-key "$PACKAGE_TARGET" shared
      - name: Speech native libraries
        id: speech-cache
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Build prerequisites
        run: |
          brew install llvm@21 ripgrep
      - name: Desktop packaging fixtures
        run: |
          python3 scripts/ci.py fixtures shared
          python3 scripts/ci.py fixtures desktop
      - name: Build native Desktop
        run: |
          python3 .workflow-tools/scripts/ci-run.py -- cargo build --locked --release --timings -p sailry-desktop -p sailry-release
      - name: Stage native Desktop
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python3 .workflow-tools/scripts/desktop-build.py stage --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --target "$PACKAGE_TARGET" \
            --output "$RUNNER_TEMP/native-$PACKAGE_TARGET.tar.gz"
      - name: Preserve native Desktop
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Save speech native libraries
        if: always() && steps.speech-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ steps.speech-key.outputs.key }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 .workflow-tools/scripts/ci.py cache-usage
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Ad-hoc Desktop ${{ matrix.target }}
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix || '{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","jobs":1},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","jobs":2}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/rust-cache/
            /scripts/ci.py
            /scripts/ci-run.py
            /scripts/check-release.py
            /scripts/package/publication.py
            /scripts/package/versions.py
            /scripts/recover-desktop.py
            /scripts/desktop-build.py
            /scripts/package-desktop-adhoc.py
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Verify target and release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$RELEASE_TAG"
      - name: Packaging prerequisites
        run: brew install ripgrep jq
      - name: Restore compiled Desktop
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python3 .workflow-tools/scripts/desktop-build.py restore --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --target "$PACKAGE_TARGET"
      - name: Recover signed ARM packages
        if: inputs.resume_intel_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          python3 .workflow-tools/scripts/recover-desktop.py --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --run "$RESUME_INTEL_FROM" \
            --directory "$RUNNER_TEMP/recovered-arm" --binary target/release/sailry-release
      - name: Preserve recovered ARM packages
        if: inputs.resume_intel_from != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-aarch64-apple-darwin
          path: ${{ runner.temp }}/recovered-arm/*
          if-no-files-found: error
          retention-days: 14
      - name: Assemble ad-hoc Desktop
        id: package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          python3 .workflow-tools/scripts/package-desktop-adhoc.py --source "$GITHUB_WORKSPACE" \
            --target "$PACKAGE_TARGET" | tee "$RUNNER_TEMP/package.log"
          task_package="$(sed -n 's/^Ad-hoc package: //p' "$RUNNER_TEMP/package.log")"
          test -d "$task_package"
          printf 'directory=%s\n' "$task_package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.target }}
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Desktop and start follow-ups
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/rust-cache/
            /scripts/ci.py
            /scripts/ci-run.py
            /scripts/check-release.py
            /scripts/package/publication.py
            /scripts/package/versions.py
            /scripts/desktop-build.py
            /scripts/publish-packages.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Verify archives and publish Desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS-desktop-*)
          python3 scripts/release-notes.py --tag "$RELEASE_TAG" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/release-notes.md" --changelog CHANGELOG.md
          arguments=()
          if test -n "$RESUME_INTEL_FROM"; then arguments+=(--signed-arm); fi
          python3 .workflow-tools/scripts/publish-packages.py --source "$GITHUB_WORKSPACE" \
            --component desktop-adhoc --tag "$RELEASE_TAG" "${arguments[@]}" \
            --notes "$RUNNER_TEMP/release-notes.md" --directory packages
      - name: Identify preserved native artifacts
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          arguments=()
          if test -n "$RESUME_INTEL_FROM"; then arguments+=(--signed-arm); fi
          python3 .workflow-tools/scripts/desktop-build.py inventory --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" "${arguments[@]}"
      - name: Dispatch exact-version formal signing and independent follow-ups
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          NATIVE_ARTIFACTS: ${{ steps.native.outputs.artifacts }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          dispatches = [
              ('release-desktop-formal.yml', 'main', {
                  'tag': tag, 'source_sha': source, 'producer_run': os.environ['GITHUB_RUN_ID'],
                  'producer_revision': os.environ['WORKFLOW_REVISION'], 'artifacts': os.environ['NATIVE_ARTIFACTS'],
                  'signed_arm_from': os.environ['RESUME_INTEL_FROM']}),
              ('release-host.yml', 'main', {'tag': tag}),
              ('changelog.yml', tag, {'tag': tag}),
          ]
          failed = []
          for workflow, ref, inputs in dispatches:
              result = subprocess.run(['gh', 'api', '--method', 'POST',
                                       f'repos/{repository}/actions/workflows/{workflow}/dispatches',
                                       '--input', '-'], input=json.dumps({'ref': ref, 'inputs': inputs}), text=True)
              if result.returncode:
                  failed.append(workflow)
          if failed:
              raise SystemExit('Follow-up dispatch failed: ' + ', '.join(failed))
          PY
