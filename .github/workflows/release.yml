name: Library release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  notes:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Read the tagged library's changelog entry
        run: python3 .github/scripts/library_release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Publish notes for the existing Go module tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          # Keep historical /releases/latest/download application links intact.
          # Go resolves @latest from module tags, not GitHub's Latest badge.
          options=(--verify-tag --latest=false --title "$tag" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ $tag == *-* ]]; then options+=(--prerelease); fi
          gh release create "$tag" "${options[@]}"
