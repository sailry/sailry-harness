name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact version tag to build; run this workflow from main'
        type: string
        required: true
      resume_intel_from:
        description: 'Reuse signed ARM packages from this exact-source run and rebuild only Intel'
        type: string
        required: false
        default: ''
      resume_native_from:
        description: 'Reuse preserved native Desktop builds from this run and build missing targets'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  version:
    name: Verify Desktop tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - name: Require a matching version tag
        # Unsigned builds run alongside Checks; symbol upload and publication wait for the Desktop gate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          python3 .workflow-tools/scripts/check-release.py --source "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --component desktop --admit
      - name: Select native producers
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
          RESUME_NATIVE_FROM: ${{ inputs.resume_native_from }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          targets = [
              {'runner': 'macos-15', 'target': 'aarch64-apple-darwin', 'jobs': 3},
              {'runner': 'macos-15-intel', 'target': 'x86_64-apple-darwin', 'jobs': 4},
          ]
          if os.environ['RESUME_INTEL_FROM'] and os.environ['RESUME_NATIVE_FROM']:
              raise SystemExit('Select either signed ARM recovery or native build recovery')
          if os.environ['RESUME_INTEL_FROM']:
              subprocess.run(['python3', '.workflow-tools/scripts/recover-desktop.py',
                              '--source', os.environ['GITHUB_WORKSPACE'], '--tag', os.environ['RELEASE_TAG'],
                              '--run', os.environ['RESUME_INTEL_FROM']], check=True)
              targets = targets[1:]
          if os.environ['RESUME_NATIVE_FROM']:
              recovered = json.loads(subprocess.check_output([
                  'python3', '.workflow-tools/scripts/desktop-build.py', 'resume',
                  '--source', os.environ['GITHUB_WORKSPACE'], '--tag', os.environ['RELEASE_TAG'],
                  '--run', os.environ['RESUME_NATIVE_FROM']], text=True))
              for target in targets:
                  native = next((item for item in recovered if item['target'] == target['target']), None)
                  if native is not None:
                      target['native'] = native
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': targets}) + '\n')
          PYTHON

  build:
    name: Build Desktop ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix || '{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","jobs":3},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","jobs":4}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        if: matrix.native == null
        with:
          version: '0.16.0'
          use-cache: false
      - name: Verify target and release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$RELEASE_TAG"
      - name: Rust dependency caches
        if: matrix.native == null
        uses: ./.workflow-tools/.github/actions/rust-cache
      - name: Native library cache
        if: matrix.native == null
        id: native-cache
        continue-on-error: true
        uses: ./.workflow-tools/.github/actions/native-cache
        with:
          target: ${{ matrix.target }}
          libraries: speech
      - name: Build prerequisites
        if: matrix.native == null
        run: |
          brew install llvm@21 ripgrep
      - name: Restore preserved Desktop
        if: matrix.native != null
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          PACKAGE_TARGET: ${{ matrix.target }}
          PRODUCER_RUN: ${{ matrix.native.run_id }}
          PRODUCER_REVISION: ${{ matrix.native.revision }}
          NATIVE_ARTIFACT: ${{ matrix.native.id }}
          NATIVE_DIGEST: ${{ matrix.native.digest }}
        run: |
          product_source="$(git rev-parse HEAD)"
          python3 .workflow-tools/scripts/desktop-build.py restore --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --target "$PACKAGE_TARGET" \
            --run "$PRODUCER_RUN" --revision "$PRODUCER_REVISION" --source-sha "$product_source" \
            --artifact-id "$NATIVE_ARTIFACT" --artifact-digest "$NATIVE_DIGEST"
      - name: Build native Desktop
        if: matrix.native == null
        env:
          # Preserve line tables for symbolication without changing development profiles.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          SAILRY_SENTRY_DSN: ${{ secrets.SAILRY_SENTRY_DSN }}
          SAILRY_TELEMETRY_KEY: ${{ secrets.SAILRY_TELEMETRY_KEY }}
        run: |
          python3 .workflow-tools/scripts/ci-run.py --parsers -- cargo build --locked --release --timings -p sailry-desktop -p sailry-release
      - name: Collect Desktop debug symbols
        # The only dsymutil pass for this binary; packaging reuses it by matching UUIDs.
        if: matrix.native == null
        id: symbols
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python3 .workflow-tools/scripts/package/debug-symbols.py collect \
            --binary target/release/sailry-desktop --target "$PACKAGE_TARGET" \
            --output "target/debug-symbols/desktop/$PACKAGE_TARGET"
      - name: Preserve Desktop debug symbols
        if: always() && steps.symbols.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-desktop-${{ matrix.target }}
          path: target/debug-symbols/desktop/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
      - name: Stage native Desktop
        if: matrix.native == null
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python3 .workflow-tools/scripts/desktop-build.py stage --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --target "$PACKAGE_TARGET" \
            --output "$RUNNER_TEMP/native-$PACKAGE_TARGET.tar.gz"
      - name: Preserve native Desktop
        if: matrix.native == null
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Save native libraries
        if: matrix.native == null && github.ref == 'refs/heads/main' && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.hit != 'true' && hashFiles('target/sherpa-onnx-prebuilt/**/*') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}
      - name: Compiler cache statistics
        if: always() && matrix.native == null
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 .workflow-tools/scripts/ci.py cache-usage
      - name: Compilation timings
        if: always() && matrix.native == null
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Ad-hoc Desktop ${{ matrix.target }}
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix || '{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","jobs":3},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","jobs":4}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14.6'
      - name: Verify target and release version
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$RELEASE_TAG"
      - name: Packaging prerequisites
        run: brew install ripgrep jq
      - name: Restore compiled Desktop
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          PACKAGE_TARGET: ${{ matrix.target }}
          PRODUCER_RUN: ${{ matrix.native.run_id }}
          PRODUCER_REVISION: ${{ matrix.native.revision }}
          NATIVE_ARTIFACT: ${{ matrix.native.id }}
          NATIVE_DIGEST: ${{ matrix.native.digest }}
        run: |
          arguments=()
          if test -n "$PRODUCER_RUN"; then
            arguments+=(--run "$PRODUCER_RUN" --revision "$PRODUCER_REVISION" \
              --source-sha "$(git rev-parse HEAD)" --artifact-id "$NATIVE_ARTIFACT" --artifact-digest "$NATIVE_DIGEST")
          fi
          python3 .workflow-tools/scripts/desktop-build.py restore --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --target "$PACKAGE_TARGET" "${arguments[@]}"
      - name: Restore Desktop debug symbols
        # Matching UUIDs let packaging reuse the build job's dSYM instead of running dsymutil again.
        if: matrix.native == null
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: debug-symbols-desktop-${{ matrix.target }}
          path: target/debug-symbols/desktop/${{ matrix.target }}
      - name: Recover Desktop debug symbols
        if: matrix.native != null
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TARGET: ${{ matrix.target }}
          PRODUCER_RUN: ${{ matrix.native.run_id }}
        run: |
          gh run download "$PRODUCER_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "debug-symbols-desktop-$PACKAGE_TARGET" --dir "target/debug-symbols/desktop/$PACKAGE_TARGET"
      - name: Recover signed ARM packages
        if: inputs.resume_intel_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          python3 .workflow-tools/scripts/recover-desktop.py --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" --run "$RESUME_INTEL_FROM" \
            --directory "$RUNNER_TEMP/recovered-arm" --binary target/release/sailry-release
      - name: Preserve recovered ARM packages
        if: inputs.resume_intel_from != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-aarch64-apple-darwin
          path: ${{ runner.temp }}/recovered-arm/*
          if-no-files-found: error
          retention-days: 14
      - name: Use workflow packaging helper
        run: |
          python3 - <<'PYTHON'
          import shutil, subprocess
          product = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tooling = subprocess.check_output(['git', '-C', '.workflow-tools', 'rev-parse', 'HEAD'], text=True).strip()
          print(f'Product source: {product}; packaging helper source: {tooling}')
          shutil.copyfile('.workflow-tools/scripts/package/agent-desktop.py', 'scripts/package/agent-desktop.py')
          PYTHON
      - name: Assemble ad-hoc Desktop
        id: package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          python3 .workflow-tools/scripts/package-desktop-adhoc.py --source "$GITHUB_WORKSPACE" \
            --target "$PACKAGE_TARGET" | tee "$RUNNER_TEMP/package.log"
          task_package="$(sed -n 's/^Ad-hoc package: //p' "$RUNNER_TEMP/package.log")"
          test -d "$task_package"
          printf 'directory=%s\n' "$task_package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve recovered Desktop debug symbols
        # Builds restored from another run upload their symbols with this run's publication.
        if: matrix.native != null
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-desktop-${{ matrix.target }}
          path: target/debug-symbols/desktop/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish Desktop and start follow-ups
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - name: Require the Desktop gate and published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .workflow-tools/scripts/check-release.py --source "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --component desktop --wait-ready --wait-published
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Verify archives and append Desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS-desktop-*)
          arguments=()
          if test -n "$RESUME_INTEL_FROM"; then arguments+=(--signed-arm); fi
          python3 .workflow-tools/scripts/publish-packages.py --source "$GITHUB_WORKSPACE" \
            --component desktop-adhoc --tag "$RELEASE_TAG" "${arguments[@]}" \
            --directory packages
      - name: Identify preserved native artifacts
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
          RESUME_NATIVE_FROM: ${{ inputs.resume_native_from }}
        run: |
          arguments=()
          if test -n "$RESUME_INTEL_FROM"; then arguments+=(--signed-arm); fi
          if test -n "$RESUME_NATIVE_FROM"; then arguments+=(--resume-run "$RESUME_NATIVE_FROM"); fi
          python3 .workflow-tools/scripts/desktop-build.py inventory --source "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" "${arguments[@]}"
      - name: Dispatch exact-version formal signing
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACTS: ${{ steps.native.outputs.artifacts }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          inputs = {
              'tag': tag, 'source_sha': source, 'artifacts': os.environ['NATIVE_ARTIFACTS'],
              'signed_arm_from': os.environ['RESUME_INTEL_FROM'],
          }
          subprocess.run(['gh', 'api', '--method', 'POST',
                          f'repos/{repository}/actions/workflows/release-desktop-formal.yml/dispatches',
                          '--input', '-'], input=json.dumps({'ref': 'main', 'inputs': inputs}), text=True, check=True)
          PY
      - name: Restore Desktop debug symbols
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: debug-symbols-desktop-*-apple-darwin
          path: symbols
      - name: Recover signed ARM debug symbols
        if: inputs.resume_intel_from != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_INTEL_FROM: ${{ inputs.resume_intel_from }}
        run: |
          gh run download "$RESUME_INTEL_FROM" --repo "$GITHUB_REPOSITORY" \
            --name debug-symbols-desktop-aarch64-apple-darwin --dir symbols/debug-symbols-desktop-aarch64-apple-darwin
      - name: Upload Desktop debug symbols
        id: symbol-upload
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
        run: python3 .workflow-tools/scripts/package/debug-symbols.py upload --symbols symbols
      - name: Report symbol upload failure
        if: steps.symbol-upload.outcome == 'failure'
        run: echo '::warning::Desktop debug symbols were preserved, but Sentry upload failed'

  windows_notices:
    name: Windows Desktop notices
    needs: version
    # Recovery inputs select macOS artifacts; rebuilt Windows bytes would collide with published assets.
    if: inputs.resume_intel_from == '' && inputs.resume_native_from == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - name: Rust dependency sources
        uses: ./.workflow-tools/.github/actions/rust-cache
      - name: Notice prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep jq
      - name: Collect Windows Desktop notices
        # The collector resolves Cargo metadata paths with POSIX tools, so it runs on Linux.
        run: |
          mkdir -p target
          bash scripts/package/licenses.sh sailry-desktop x86_64-pc-windows-msvc "$RUNNER_TEMP/notices"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/notices
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows Desktop x86_64-pc-windows-msvc
    needs: [version, windows_notices]
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_TARGET: x86_64-pc-windows-msvc
      CARGO_BUILD_JOBS: '4'
    steps:
      - name: Repository line endings
        # Git for Windows otherwise checks out CRLF, so embedded text would differ from other platforms.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # Python 3.14 extracts the zstd parser archives without a platform tar.
          python-version: '3.14.6'
      - uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: '0.16.0'
          use-cache: false
      - name: Verify target and release version
        run: |
          rustup toolchain install
          test "$(rustc -vV | awk '/^host: / {print $2}')" = "$PACKAGE_TARGET"
          python3 scripts/package/versions.py --tag "$RELEASE_TAG"
      - name: Rust dependency caches
        uses: ./.workflow-tools/.github/actions/rust-cache
      - name: Native library cache
        # Packaging runs in this job, so the cache also covers the decision libraries.
        id: native-cache
        continue-on-error: true
        uses: ./.workflow-tools/.github/actions/native-cache
        with:
          target: x86_64-pc-windows-msvc
      - name: Build native Desktop
        env:
          # Preserve line tables for symbolication without changing development profiles.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          SAILRY_SENTRY_DSN: ${{ secrets.SAILRY_SENTRY_DSN }}
          SAILRY_TELEMETRY_KEY: ${{ secrets.SAILRY_TELEMETRY_KEY }}
        run: |
          python3 .workflow-tools/scripts/ci-run.py --parsers -- cargo build --locked --release --timings -p sailry-desktop
      - name: Collect Desktop debug symbols
        id: symbols
        run: |
          python3 .workflow-tools/scripts/package/debug-symbols.py collect \
            --binary target/release/sailry-desktop.exe --target "$PACKAGE_TARGET" \
            --output "target/debug-symbols/desktop/$PACKAGE_TARGET"
      - name: Preserve Desktop debug symbols
        if: always() && steps.symbols.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-desktop-x86_64-pc-windows-msvc
          path: target/debug-symbols/desktop/x86_64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 14
      - name: Desktop notices
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: notices-x86_64-pc-windows-msvc
          path: target/notices
      - name: Assemble portable Desktop
        id: portable
        shell: pwsh
        run: |
          & ./scripts/package-windows.ps1 -Target $env:PACKAGE_TARGET -LicensesDirectory target/notices |
            Tee-Object -Variable packaging
          $reported = $packaging | Select-String -Pattern '^Local package: (.+)$' | Select-Object -Last 1
          if (-not $reported) { throw 'Windows packaging did not report its output' }
          $package = $reported.Matches[0].Groups[1].Value
          $assets = New-Item -ItemType Directory -Path dist/windows-assets
          Move-Item -LiteralPath (Join-Path $package "Sailry-$env:PACKAGE_TARGET.zip") -Destination $assets.FullName
          "bundle=$(Join-Path $package 'Sailry')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build Windows installer
        env:
          PACKAGE_BUNDLE: ${{ steps.portable.outputs.bundle }}
        run: |
          python3 .workflow-tools/scripts/package/windows-installer.py build --source "$GITHUB_WORKSPACE" \
            --bundle "$PACKAGE_BUNDLE" --target "$PACKAGE_TARGET" --output dist/windows-assets \
            --cache target/tooling/inno-setup
      # Authenticode signing belongs here, before checksums; the installer build accepts --sign-tool.
      - name: Record Windows checksums
        run: python3 .workflow-tools/scripts/package/windows-installer.py checksums --directory dist/windows-assets --target "$PACKAGE_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-x86_64-pc-windows-msvc
          path: dist/windows-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Save native libraries
        if: github.ref == 'refs/heads/main' && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.hit != 'true' && hashFiles('target/sherpa-onnx-prebuilt/**/*') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.native-cache.outputs.path }}
          key: ${{ steps.native-cache.outputs.key }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sccache --show-stats || true
          python3 .workflow-tools/scripts/ci.py cache-usage
      - name: Compilation timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-x86_64-pc-windows-msvc
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  windows_publish:
    name: Publish Windows Desktop
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Workflow tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
      - name: Require the Desktop gate and published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .workflow-tools/scripts/check-release.py --source "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --component desktop --wait-ready --wait-published
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-package-x86_64-pc-windows-msvc
          path: packages
      - name: Verify archive and append Windows Desktop
        # Unsigned zip and installer: no Authenticode certificate is configured; the update catalog covers macOS only.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS-desktop-*)
          python3 .workflow-tools/scripts/publish-packages.py --source "$GITHUB_WORKSPACE" \
            --component desktop-windows --tag "$RELEASE_TAG" --directory packages
      - name: Restore Windows debug symbols
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: debug-symbols-desktop-x86_64-pc-windows-msvc
          path: symbols/debug-symbols-desktop-x86_64-pc-windows-msvc
      - name: Upload Windows debug symbols
        id: symbol-upload
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
        run: python3 .workflow-tools/scripts/package/debug-symbols.py upload --symbols symbols
      - name: Report symbol upload failure
        if: steps.symbol-upload.outcome == 'failure'
        run: echo '::warning::Windows debug symbols were preserved, but Sentry upload failed'
