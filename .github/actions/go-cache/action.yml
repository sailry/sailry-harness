name: Go toolchain and caches
description: Restore shared Go caches or save them after checks, including failed assertions
inputs:
  phase:
    description: Restore before checks or save afterward
    default: restore
  modules-hit:
    description: Exact module cache hit from the restore phase
    default: 'false'
  build-hit:
    description: Exact compiler cache hit from the restore phase
    default: 'false'
  save-build:
    description: Allow this job to save the shared compiler cache
    default: 'true'
outputs:
  modules-hit:
    description: Whether the exact module cache was restored
    value: ${{ steps.modules.outputs.cache-hit }}
  build-hit:
    description: Whether the exact compiler cache was restored
    value: ${{ steps.build.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
      id: setup
      if: inputs.phase == 'restore'
      with:
        go-version-file: go.mod
        cache: false
    - name: Cache paths
      id: paths
      if: ${{ !cancelled() && (inputs.phase == 'save' || steps.setup.outcome == 'success') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        unset GOROOT
        export GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0
        printf 'modules=%s\nbuild=%s\n' "$(go env GOMODCACHE)" "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: modules
      if: inputs.phase == 'restore'
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GOTOOLCHAIN }}-${{ hashFiles('go.sum') }}
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: build
      if: inputs.phase == 'restore'
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GOTOOLCHAIN }}-${{ env.GO_CACHE_ROLE }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GOTOOLCHAIN }}-${{ env.GO_CACHE_ROLE }}-${{ hashFiles('go.sum') }}-
          go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GOTOOLCHAIN }}-${{ env.GO_CACHE_ROLE }}-
    # Composite actions have no post hook. Callers explicitly save under
    # !cancelled(), so a failed assertion does not discard valid compiler work.
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: ${{ !cancelled() && inputs.phase == 'save' && inputs.modules-hit != 'true' && steps.paths.outcome == 'success' }}
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GOTOOLCHAIN }}-${{ hashFiles('go.sum') }}
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: ${{ !cancelled() && inputs.phase == 'save' && inputs.save-build == 'true' && inputs.build-hit != 'true' && steps.paths.outcome == 'success' }}
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GOTOOLCHAIN }}-${{ env.GO_CACHE_ROLE }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
