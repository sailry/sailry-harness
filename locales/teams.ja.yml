role_plan_description: "実装手順と受け入れ条件を整理する"
role_prompt_plan: "現在の動作と制約を調べ、設計に影響する選択肢を整理する。検証可能な手順に分け、依存関係と確認方法を示す。主担当の判断が必要な前提を明記し、プロジェクトのファイルは変更しない。"
role_preset_frontend: "UI 設計・実装"
role_frontend_description: "画面構成、視覚的な階層、操作を設計して実装する"
role_prompt_frontend: "既存のデザインシステムに沿って画面構成、視覚的な階層、操作を設計し、実装する。必要に応じてキーボード操作、読み込み中とエラー時の表示を扱う。対応するウィンドウサイズで確認し、参考画像があれば照合する。"
role_preset_troubleshoot: "難題解決"
role_troubleshoot_description: "複雑な実装や、複数回試しても解決しない課題を引き受ける"
role_prompt_troubleshoot: "複雑な実装、または二、三回の試行で解決しなかった課題を担当する。これまでの結果を確認して重要な仮説を検証し、必要な実装や修正を行う。元の条件で検証し、変更、結果、残った制約を報告する。"
role_model_hint_review: "親セッションの停止が子エージェントに伝わるかなど、複数モジュールのレビューには推論に強いモデル（例：Opus）が適している。"
role_model_hint_implement: "設定項目の追加と保存など、範囲が明確な変更にはバランス型のコーディングモデル（例：Sonnet）が適している。"
role_model_hint_test: "対象を絞った回帰テストには高速モデル（例：Haiku）、タイミングに依存するテストの調査には推論に強いモデルが適している。"
role_model_hint_plan: "既存のセッションを保持する履歴移行など、設計上の選択を伴う計画には推論に強いモデル（例：Opus）が適している。"
role_model_hint_frontend: "画面の実装にはバランス型のコーディングモデル（例：Sonnet）が適している。設定画面をスクリーンショットと照合する場合は画像入力に対応したモデルを選ぶ。"
role_model_hint_troubleshoot: "長い会話のスクロール時に生じるメモリ使用量の急増など、再現が難しい障害には推論に強いモデル（例：Opus）が適している。"
