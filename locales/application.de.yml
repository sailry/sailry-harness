file_intro: "# Sailry\n\nEin nativer Desktop-Agent-Arbeitsbereich.\n\n## Struktur der Benutzeroberfläche\n\n- Navigation, Hauptinhalt und Kontextspalten\n- GPUI Kit Komponenten und semantische Themen\n- Gemeinsame Ressourcen-Header für Unterhaltungen, Dateien und Entwicklungstools\n\nDies ist ein gebündeltes Beispiel; es wird kein echtes Projekt gelesen."
file_design: "# Desktop-Layout\n\nDie linke Spalte enthält die Host- und Projektstruktur, die mittlere zeigt Ressourcen an und die rechte wird bei Bedarf geöffnet.\n\nSchmale Fenster reduzieren zuerst die rechte Spalte; manuelle Auswahlen werden beibehalten, wenn die Breite zurückkehrt."
diff_intro: "```diff\n- workspace: nested cards\n+ workspace: three flat panels\n\n- toolbar: global resource actions\n+ toolbar: current resource header\n```"
diff_design: "```diff\n- search: permanent search row\n+ search: command palette\n\n- theme: page-specific colors\n+ theme: GPUI Kit semantic theme\n```"
