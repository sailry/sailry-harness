file_intro: "# Sailry\n\nA native desktop Agent workspace.\n\n## UI structure\n\n- Navigation, main content and context columns\n- GPUI Kit components and semantic themes\n- Shared resource headers for conversations, files and development tools\n\nThis is a bundled example; no real project is read."
file_design: "# Desktop layout\n\nThe left column keeps the host and project tree, the middle displays resources, and the right opens as needed.\n\nNarrow windows collapse the right column first; manual choices are kept when width returns."
diff_intro: "```diff\n- workspace: nested cards\n+ workspace: three flat panels\n\n- toolbar: global resource actions\n+ toolbar: current resource header\n```"
diff_design: "```diff\n- search: permanent search row\n+ search: command palette\n\n- theme: page-specific colors\n+ theme: GPUI Kit semantic theme\n```"
