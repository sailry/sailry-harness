file_intro: "# Sailry\n\nUm espaço de trabalho de agente de desktop nativo.\n\n## Estrutura de UI\n\n- Navegação, conteúdo principal e colunas de contexto\n- GPUI Kit componentes e temas semânticos\n- Cabeçalhos de recursos compartilhados para conversas, arquivos e ferramentas de desenvolvimento\n\nEste é um exemplo agrupado; nenhum projeto real é lido."
file_design: "# Layout do desktop\n\nA coluna da esquerda mantém a árvore do host e do projeto, a do meio exibe recursos e a da direita abre conforme necessário.\n\nJanelas estreitas recolhem a coluna direita primeiro; as escolhas manuais são mantidas quando a largura retorna."
diff_intro: "```diff\n- workspace: nested cards\n+ workspace: three flat panels\n\n- toolbar: global resource actions\n+ toolbar: current resource header\n```"
diff_design: "```diff\n- search: permanent search row\n+ search: command palette\n\n- theme: page-specific colors\n+ theme: GPUI Kit semantic theme\n```"
