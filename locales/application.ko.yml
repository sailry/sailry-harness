file_intro: "# Sailry\n\n기본 데스크톱 Agent 작업 공간입니다.\n\n## UI 구조\n\n- 탐색, 주요 콘텐츠 및 컨텍스트 열\n- GPUI Kit 구성 요소 및 의미론적 테마\n- 대화, 파일 및 개발 도구를 위한 공유 리소스 헤더\n\n이것은 번들된 예제이며, 실제 프로젝트는 읽히지 않습니다."
file_design: "# 데스크톱 레이아웃\n\n왼쪽 열에는 호스트와 프로젝트 트리가 있고, 가운데 열에는 리소스가 표시되며, 오른쪽 열은 필요에 따라 열립니다.\n\n좁은 창은 먼저 오른쪽 열을 축소합니다. 너비가 돌아올 때 수동 선택은 유지됩니다."
diff_intro: "```diff\n- workspace: nested cards\n+ workspace: three flat panels\n\n- toolbar: global resource actions\n+ toolbar: current resource header\n```"
diff_design: "```diff\n- search: permanent search row\n+ search: command palette\n\n- theme: page-specific colors\n+ theme: GPUI Kit semantic theme\n```"
