file_intro: "# Sailry\n\nUn espacio de trabajo de agente de escritorio nativo.\n\n## Estructura de UI\n\n- Columnas de navegación, contenido principal y contexto\n- GPUI Kit componentes y temas semánticos\n- Encabezados de recursos compartidos para conversaciones, archivos y herramientas de desarrollo\n\nEste es un ejemplo agrupado; no se lee ningún proyecto real."
file_design: "# Diseño de escritorio\n\nLa columna izquierda mantiene el árbol de host y proyecto, la del medio muestra los recursos y la derecha se abre según sea necesario.\n\nLas ventanas estrechas contraen la columna derecha primero; las opciones manuales se mantienen cuando el ancho regresa."
diff_intro: "```diff\n- workspace: nested cards\n+ workspace: three flat panels\n\n- toolbar: global resource actions\n+ toolbar: current resource header\n```"
diff_design: "```diff\n- search: permanent search row\n+ search: command palette\n\n- theme: page-specific colors\n+ theme: GPUI Kit semantic theme\n```"
