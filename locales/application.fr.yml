file_intro: "# Sailry\n\nUn espace de travail Agent de bureau natif.\n\n## Structure de l'UI\n\n- Colonnes de navigation, de contenu principal et de contexte\n- GPUI Kit composants et thèmes sémantiques\n- En-têtes de ressources partagées pour les conversations, les fichiers et les outils de développement\n\nCeci est un exemple groupé; aucun projet réel n'est lu."
file_design: "# Mise en page du bureau\n\nLa colonne de gauche contient l'arborescence de l'hôte et du projet, la colonne du milieu affiche les ressources et la colonne de droite s'ouvre au besoin.\n\nLes fenêtres étroites réduisent d'abord la colonne de droite ; les choix manuels sont conservés lorsque la largeur revient."
diff_intro: "```diff\n- workspace: nested cards\n+ workspace: three flat panels\n\n- toolbar: global resource actions\n+ toolbar: current resource header\n```"
diff_design: "```diff\n- search: permanent search row\n+ search: command palette\n\n- theme: page-specific colors\n+ theme: GPUI Kit semantic theme\n```"
