file_intro: "# Sailry ОТЧЕТ\n\nОсновное рабочее пространство агента на рабочем столе.\n\n## Структура пользовательского интерфейса\n\n- Навигация, основное содержание и контекстные столбцы\n- GPUI Kit компоненты и семантические темы\n- Общие заголовки ресурсов для разговоров, файлов и инструментов разработчика\n\nЭто пример сгруппированного проекта; никакого реального проекта не читается."
file_design: "# Планировка рабочего стола\n\nВ левой колонке хранится дерево хоста и проекта, в средней отображаются ресурсы, а в правой открывается по мере необходимости.\n\nУзкие окна сначала сжимают правый столбец; ручные выборы сохраняются, когда ширина возвращается."
diff_intro: "```diff\n- workspace: nested cards\n+ workspace: three flat panels\n\n- toolbar: global resource actions\n+ toolbar: current resource header\n```"
diff_design: "```diff\n- search: permanent search row\n+ search: command palette\n\n- theme: page-specific colors\n+ theme: GPUI Kit semantic theme\n```"
