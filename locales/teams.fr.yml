role_builtin_research_description: "Étudier les sources web publiques et fournir des conclusions étayées"
role_prompt_test: "Vérifiez la modification ou le comportement attribué. Trouvez les tests et vérifications existants pertinents, exécutez les plus ciblés qui couvrent le périmètre et n’ajoutez des tests que sur demande.\nIndiquez les commandes exactes, les résultats et les échecs avec leur cause probable. Ne modifiez pas le code d’implémentation pour faire passer les vérifications."
role_prompt_docs: "Rédigez ou mettez à jour la documentation du périmètre attribué. Lisez d’abord le code et les documents existants concernés, suivez leur structure et leur terminologie, et restez concis et exact.\nIndiquez les fichiers modifiés et les faits que vous n’avez pas pu confirmer."
