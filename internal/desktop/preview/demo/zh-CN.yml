metrics.retention.title: "第 4 周留存率"
metrics.1.user: "解释一下你用的留存率公式。"
metrics.1.think: "对方要的是定义，不是数字。我应该给出公式，说明每一项统计的是什么，并指出数据的来源。"
metrics.1.answer: |-
  第 4 周留存率，是指一个同期群在注册四周后仍然活跃的比例：

  $$
  R_4(c) = \frac{|\{t \in c : \text{active}(t, w_c + 4)\}|}{|c|}
  $$

  其中 $c$ 是在第 $w_c$ 周注册的团队集合；团队在某一周打开过仪表盘，即视为该周活跃。

  ```mermaid
  flowchart LR
      A[注册事件] --> B[按周划分同期群]
      B --> C{第 4 周是否活跃}
      C -- 是 --> D[留存]
      C -- 否 --> E[流失]
  ```

  > 同期群要等第四周结束后才计入，所以最近三周不在图表中。

  该定义遵循[留存率指南](https://lumen.example/docs/metrics/retention)。

hash.title: "讲解一致性哈希"
hash.0.user: "讲讲一致性哈希，以及什么时候该用它。"
hash.0.think: "先给一个简短的定义，再说明节点变化时普通取模哈希为什么会失效，然后讲哈希环和虚拟节点。用表格把取舍讲清楚。"
hash.0.answer: |-
  # 一致性哈希

  一致性哈希把键分布到各个节点上，使得**增删节点时只有一小部分键需要迁移**。

  ## 问题

  使用 `node = hash(key) % n` 时，只要 `n` 变化，几乎所有的键都会被重新映射。缓存从 4 个节点扩到 5 个，会一次性丢失约 80% 的条目。

  ## 哈希环

  1. 把每个节点哈希到一个有 $2^{32}$ 个位置的环上。
  2. 把每个键哈希到同一个环上。
  3. 键归属于顺时针方向遇到的第一个节点。

  节点下线时，只有它的键需要迁移到下一个节点。平均迁移量为

  $$
  \frac{K}{n}
  $$

  其中 $K$ 是键的数量，$n$ 是节点的数量。

  ## 虚拟节点

  环上的节点太少时分布并不均匀。让每个节点占据多个位置，可以使负载更均衡：

  | 虚拟节点数 | 负载偏差 | 内存占用 |
  |---|---|---|
  | 1 | ±50% | 最低 |
  | 100 | ±10% | 低 |
  | 1000 | ±3% | 中等 |

  ## 适用场景

  - 节点会增减的缓存和分片存储
  - 需要让客户端固定到同一后端的负载均衡
  - *不适用于*节点固定的场景，那时取模更简单

  > 集合点哈希无需哈希环就能提供同样的保证，通常也更容易实现。

  原始论文见 [Consistent Hashing and Random Trees](https://dl.acm.org/doi/10.1145/258533.258660)。
hash.1.user: "用 Go 写一下查找过程。"
hash.1.answer: |-
  哈希环是一个有序的位置切片，查找就是一次二分搜索：

  ```go
  // Node returns the node that owns key.
  func (r *Ring) Node(key string) string {
      h := hash(key)
      i := sort.Search(len(r.points), func(i int) bool { return r.points[i] >= h })
      if i == len(r.points) {
          i = 0 // wrap around the ring
      }
      return r.owner[r.points[i]]
  }
  ```

  这个类型还需要：

  - [x] `Add` 插入节点的虚拟位置并排序
  - [x] `Node` 以 `O(log n)` 找到键的归属节点
  - [ ] `Remove` 删除节点的全部位置

