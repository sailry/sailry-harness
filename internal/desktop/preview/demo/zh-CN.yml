hooks.title: "Webhook 重试"
hooks.0.user: "为对外发送的 webhook 规划带退避的重试。在我看过计划之前不要写代码。"
hooks.0.think: "Deliver 只尝试一次，然后把错误交给调用方，而其中两个调用方直接忽略了它。重试需要有地方保存事件，所以计划必须在进程内队列和 outbox 表之间做出选择。"
hooks.0.answer: "目前 webhook 只发送一次：booking 会记录失败的投递，payment 则直接丢弃。这份计划把每个事件保存到 outbox 表，并由一个 worker 负责重试。"
hooks.plan.detail: "带退避的 webhook 重试"
hooks.plan.text: |-
  # Webhook 重试

  1. 在产生事件的事务中，把事件写入 `webhook_outbox`
  2. 由 worker 投递：最多 5 次，退避时间从 30 秒到 2 小时，并加入抖动
  3. 遇到超时、`429` 和 `5xx` 时重试；其他 `4xx` 直接放弃
  4. 每次尝试都签名，并在 `X-Harbor-Attempt` 中带上次数
  5. 通过 `GET /webhooks/deliveries` 列出失败的投递

  **不包含**：在仪表盘中重放投递。

