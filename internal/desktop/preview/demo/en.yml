metrics.1.user: "Explain the retention formula you used."
metrics.1.think: "They want the definition, not the numbers. I should give the formula, say what each term counts, and show where the data comes from."
metrics.1.answer: |-
  Week-4 retention is the share of a cohort that is still active four weeks after it signed up:

  $$
  R_4(c) = \frac{|\{t \in c : \text{active}(t, w_c + 4)\}|}{|c|}
  $$

  Here $c$ is the set of teams that signed up in week $w_c$, and a team is active when it opened a dashboard that week.

  ```mermaid
  flowchart LR
      A[Signup events] --> B[Cohort by week]
      B --> C{Active in week 4?}
      C -- yes --> D[Retained]
      C -- no --> E[Churned]
  ```

  > A cohort is only counted once its fourth week has ended, so the latest three weeks are not in the chart.

  The definition follows the [retention guide](https://lumen.example/docs/metrics/retention).

hash.title: "Explain consistent hashing"
hash.0.user: "Explain consistent hashing and when I should use it."
hash.0.think: "A short definition first, then why plain modulo hashing breaks when nodes change, then the ring and virtual nodes. A table makes the trade-off clear."
hash.0.answer: |-
  # Consistent hashing

  Consistent hashing spreads keys over nodes so that **adding or removing a node moves only a small share of the keys**.

  ## The problem

  With `node = hash(key) % n`, changing `n` remaps almost every key. A cache that grows from 4 to 5 nodes loses about 80% of its entries at once.

  ## The ring

  1. Hash every node onto a ring of $2^{32}$ positions.
  2. Hash each key onto the same ring.
  3. A key belongs to the first node clockwise from it.

  A read asks the ring first, then the node that owns the key:

  ```mermaid
  sequenceDiagram
      participant C as Client
      participant R as Ring
      participant N as Node B
      C->>R: hash("user:42")
      R-->>C: first node clockwise is Node B
      C->>N: GET user:42
      N-->>C: value
  ```

  When a node leaves, only its keys move, to the next node. On average that is

  $$
  \frac{K}{n}
  $$

  keys for $K$ keys on $n$ nodes.

  ## Virtual nodes

  A few nodes on a ring are spread unevenly. Giving each node many positions evens out the load:

  | Virtual nodes | Load spread | Memory |
  |---|---|---|
  | 1 | ±50% | lowest |
  | 100 | ±10% | low |
  | 1000 | ±3% | moderate |

  ## When to use it

  - Caches and sharded stores whose nodes come and go
  - Load balancers that keep a client on one backend
  - *Not* for a fixed set of nodes, where modulo is simpler

  > Rendezvous hashing gives the same guarantee without a ring and is often easier to write.

  See [Consistent Hashing and Random Trees](https://dl.acm.org/doi/10.1145/258533.258660) for the original paper.
hash.1.user: "Show me the lookup in Go."
hash.1.answer: |-
  The ring is a sorted slice of positions; a lookup is a binary search:

  ```go
  // Node returns the node that owns key.
  func (r *Ring) Node(key string) string {
      h := hash(key)
      i := sort.Search(len(r.points), func(i int) bool { return r.points[i] >= h })
      if i == len(r.points) {
          i = 0 // wrap around the ring
      }
      return r.owner[r.points[i]]
  }
  ```

  To finish the type:

  - [x] `Add` inserts a node's virtual positions and sorts the slice
  - [x] `Node` finds a key's owner in `O(log n)`
  - [ ] `Remove` deletes a node's positions

