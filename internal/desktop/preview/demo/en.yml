hooks.title: "Webhook retries"
hooks.0.user: "Plan retries with backoff for outgoing webhooks. No code until I have seen the plan."
hooks.0.think: "Deliver makes one attempt and hands the error to its caller, and two of the callers ignore it. A retry needs somewhere to keep the event, so the plan has to choose between a queue in the process and the outbox table."
hooks.0.answer: "Today a webhook is sent once: booking logs a failed delivery and payment drops it. The plan keeps every event in the outbox table and retries it from a worker."
hooks.plan.detail: "Webhook retries with backoff"
hooks.plan.text: |-
  # Webhook retries

  1. Store each event in `webhook_outbox` in the transaction that produces it
  2. Deliver from a worker: 5 attempts, backing off from 30 s to 2 h with jitter
  3. Retry on timeouts, `429` and `5xx`; give up on any other `4xx`
  4. Sign every attempt and send its number in `X-Harbor-Attempt`
  5. List failed deliveries at `GET /webhooks/deliveries`

  **Not included**: replaying a delivery from the dashboard.

